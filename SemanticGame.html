<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <base target="_self">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>認知訓練 App - 語意聯想</title>
  <style>
    /* ==========================================
       1. 全局樣式與奶油白柔和綠色系主題
       ========================================== */
    :root {
      --page-bg: #FCFBF7;       /* 奶油米白背景 */
      --card-bg: #FFFFFF;       /* 卡片背景 */
      --primary-color: #4F7058; /* 主要綠色（鼠尾線綠） */
      --primary-dark: #35473C;  /* 主要文字 / 深綠色 */
      --primary-light: #EAF0E7; /* 淡綠色背景 */
      --text-muted: #6E8075;    /* 次要文字 */
      --border-color: #E4E9DF;  /* 淡灰綠邊框 */
      --shadow: 0 4px 12px rgba(53, 71, 60, 0.06);
      --font-scale: 1;
      --base-font-size: 16px;
    }

    body.font-scale-90 { --font-scale: 0.9; }
    body.font-scale-100 { --font-scale: 1.0; }
    body.font-scale-115 { --font-scale: 1.15; }
    body.font-scale-130 { --font-scale: 1.3; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--page-bg);
      color: var(--primary-dark);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 16px 12px;
      font-size: calc(var(--base-font-size) * var(--font-scale));
      line-height: 1.5;
    }

    .intro-screen, .category-screen, main, .summary-screen {
      animation: pageFadeIn 0.3s ease-in-out;
    }

    @keyframes pageFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    #app-container {
      width: 100%;
      max-width: 820px;
      background-color: var(--page-bg);
      display: flex;
      flex-direction: column;
      min-height: 88vh;
      position: relative;
    }

    /* 通用頂部導航按鈕 */
    .btn-back-nav {
      background-color: var(--primary-light);
      color: var(--primary-dark);
      border: 1.5px solid var(--primary-color);
      padding: 6px 16px;
      font-size: calc(15px * var(--font-scale));
      font-weight: 700;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      touch-action: manipulation;
    }

    .btn-back-nav:hover { background-color: #DCE8DA; }

    /* ================= 1. 第一層：等級選擇頁面 ================= */
    .intro-screen {
      padding: 12px 18px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      background-color: var(--page-bg);
      flex: 1;
    }

    .intro-top-bar {
      width: 100%;
      display: flex;
      justify-content: flex-start;
    }

    .intro-title-area {
      text-align: center;
      margin-top: 2px;
      margin-bottom: 0px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .intro-main-title {
      font-size: calc(32px * var(--font-scale));
      font-weight: 800;
      color: var(--primary-dark);
      letter-spacing: 2px;
      line-height: 1.2;
      margin: 0;
    }

    .intro-sub-tip {
      font-size: calc(17px * var(--font-scale));  
      font-weight: 600;
      color: #6E8075;      
      margin-top: 10px;    
      text-align: center;
      line-height: 1.4;
    }

    .level-cards-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .level-entry-card {
      background-color: #FFFFFF;
      border-radius: 20px;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      gap: 18px;
      box-shadow: var(--shadow);
      cursor: pointer;
      position: relative;
      user-select: none;
      touch-action: manipulation;
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }

    .level-entry-card:active {
      transform: scale(0.97);
    }

    @media (hover: hover) {
      .level-entry-card:hover {
        border-color: var(--primary-color);
        box-shadow: 0 6px 16px rgba(79, 112, 88, 0.15);
      }
    }

    .level-entry-card.level-locked {
      background-color: #F8FAF7 !important;
      border-color: #D8E0D7 !important;
      cursor: pointer;
      box-shadow: none !important;
    }

    .level-entry-card.level-locked:active {
      transform: none;
    }

    .level-entry-card.level-locked .level-num-box {
      background-color: #E2E8E1 !important;
      color: #8C9F90 !important;
      border: none !important;
    }

    .level-entry-card.level-locked .level-rank { color: #728575 !important; }
    .level-entry-card.level-locked .level-name { color: #839686 !important; }
    .level-entry-card.level-locked .level-desc { color: #8A9E8E !important; }

    @keyframes shakeCard {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    .level-entry-card.shake, .category-card.shake {
      animation: shakeCard 0.35s ease-in-out;
    }

    .level-num-box {
      width: 68px;
      height: 68px;
      min-width: 68px;
      border-radius: 16px;
      font-size: calc(34px * var(--font-scale));
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.04);
      pointer-events: none;
    }

    .level-card-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
      pointer-events: none;
    }

    .level-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .level-card-title {
      font-size: calc(21px * var(--font-scale));
      font-weight: 800;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .level-rank { color: var(--primary-dark); }
    .level-name { color: var(--primary-color); }

    .level-desc {
      font-size: calc(16px * var(--font-scale));
      color: var(--primary-dark);
      font-weight: 600;
      line-height: 1.4;
      margin: 2px 0 0 0;
    }

    .level-card-footer {
      display: flex;
      justify-content: flex-end;
      margin-top: 6px;
    }

    .btn-level-start {
      background-color: var(--primary-color);
      color: #FFFFFF;
      border: none;
      padding: 8px 22px;
      font-size: calc(15px * var(--font-scale));
      font-weight: 700;
      border-radius: 20px;
      display: inline-block;
      pointer-events: none;
    }

    .btn-level-locked {
      background-color: #E6EBE5;
      color: #35473C;
      border: 1.5px solid #BAC9BB;
      padding: 7px 18px;
      font-size: calc(14px * var(--font-scale));
      font-weight: 700;
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      pointer-events: none;
    }

    .locked-icon {
      width: 14px;
      height: 14px;
      flex: 0 0 14px;
      display: block;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .difficulty-tag {
      font-size: calc(14px * var(--font-scale));
      font-weight: bold;
      padding: 3px 12px;
      border-radius: 12px;
      white-space: nowrap;
    }

    .level-1-card { border: 2px solid var(--border-color); }
    .level-1-card .level-num-box {
      background-color: var(--primary-light);
      color: var(--primary-color);
      border: 1.5px solid #D2E0CE;
    }
    .tag-easy {
      background-color: var(--primary-light);
      color: var(--primary-color);
      border: 1px solid #C5D8C1;
    }

    .level-2-card { border: 2px solid #C0D0C1; }
    .level-2-card .level-num-box {
      background-color: #78947D;
      color: #FFFFFF;
    }
    .tag-medium {
      background-color: #D8E4D5;
      color: var(--primary-dark);
      border: 1px solid #A8C2A5;
    }

    .level-3-card { border: 2px solid var(--primary-color); }
    .level-3-card .level-num-box {
      background-color: var(--primary-dark);
      color: #FFFFFF;
    }
    .tag-hard {
      background-color: #D2E0D1;
      color: var(--primary-dark);
      border: 1px solid #9EB89D;
    }

    /* ================= 2. 第二層：主題選擇頁面 ================= */
    .category-screen {
      padding: 18px 16px;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      background-color: var(--page-bg);
      flex: 1;
    }

    .category-header-bar {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 14px;
      border-bottom: 2px solid var(--border-color);
      position: relative;
    }

    .category-header-top {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      min-height: 42px;
    }

    .btn-back-tier {
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      z-index: 2;
    }

    .selected-tier-title {
      font-size: calc(28px * var(--font-scale));
      font-weight: 800;
      color: var(--primary-color);
      margin: 0;
      text-align: center;
      line-height: 1.2;
    }

    .category-tip-text {
      font-size: calc(17px * var(--font-scale));
      font-weight: 600;
      color: var(--text-muted);
      text-align: center;
      margin-top: 10px;
      line-height: 1.4;
    }

    .category-cards-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    @media (max-width: 640px) {
      .category-cards-grid { grid-template-columns: 1fr; }
    }

    .category-card {
      background-color: #FFFFFF;
      border: 2px solid var(--border-color);
      border-radius: 20px;
      padding: 18px 20px;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 18px;
      box-shadow: var(--shadow);
      cursor: pointer;
      position: relative;
      user-select: none;
      touch-action: manipulation;
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }

    .category-card:active {
      transform: scale(0.97);
    }

    @media (hover: hover) {
      .category-card:hover {
        border-color: var(--primary-color);
        box-shadow: 0 6px 16px rgba(79, 112, 88, 0.15);
      }
    }

    .category-card.category-locked {
      background-color: #F8FAF7 !important;
      border-color: #D8E0D7 !important;
      cursor: pointer;
      box-shadow: none !important;
    }

    .category-card.category-locked:active {
      transform: none;
    }

    .category-card.category-locked .category-card-img,
    .category-card.category-locked .category-card-body {
      opacity: 0.65;
    }

    .category-card-img {
      width: 90px;
      height: 90px;
      min-width: 90px;
      object-fit: contain;
      background-color: #FFFFFF;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      padding: 8px;
      flex-shrink: 0;
      pointer-events: none;
    }

    .category-card-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      text-align: left;
      gap: 6px;
      pointer-events: none;
    }

    .category-card-title {
      font-size: calc(23px * var(--font-scale));
      font-weight: 800;
      color: var(--primary-dark);
      margin: 0;
      line-height: 1.2;
    }

    .category-card-desc {
      font-size: calc(16px * var(--font-scale));
      color: var(--text-muted);
      font-weight: 600;
      line-height: 1.4;
      margin: 0;
    }

    .btn-category-start {
      background-color: var(--primary-color);
      color: #FFFFFF;
      border: none;
      padding: 8px 20px;
      font-size: calc(15px * var(--font-scale));
      font-weight: 700;
      border-radius: 20px;
      margin-top: 4px;
      align-self: flex-start;
      display: inline-block;
      pointer-events: none;
    }

    .btn-category-start, .btn-level-locked {
      pointer-events: none;
    }

    /* ================= 3. 第三層：正式遊戲畫面 ================= */
    main {
      padding: 0 12px 18px 12px;
      flex: 1;
      display: none;
      flex-direction: column;
      gap: 16px;
      position: relative;
    }

    .game-header-banner {
      background-color: transparent;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 100%;
      margin: 0 auto;
    }

    .game-top-nav-row {
      width: 100%;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      margin-bottom: 2px;
    }

    .game-header-title {
      font-size: calc(24px * var(--font-scale));
      font-weight: 800;
      color: #4F7058;
      letter-spacing: 1px;
      margin: 0;
      text-align: center;
    }

    .level-nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    .level-nav-btn {
      flex: 1;
      min-width: 0;
      padding: 10px 8px;
      border-radius: 25px;
      font-size: calc(16px * var(--font-scale));
      font-weight: 700;
      border: none;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
      background-color: #EAF0E7;
      color: #4F7058;
      user-select: none;
      white-space: nowrap;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .level-nav-btn.active {
      background-color: #4F7058;
      color: #FFFFFF;
      box-shadow: 0 3px 8px rgba(79, 112, 88, 0.2);
    }

    .question-banner {
      width: 100%;
      background-color: #FFFFFF;
      border-left: none;
      padding: 14px 18px;
      border-radius: 16px;
      text-align: center;
    }

    .question-title {
      font-size: calc(20px * var(--font-scale));
      font-weight: 700;
      color: var(--primary-dark);
      margin-bottom: 0;
    }

    .cards-grid {
      display: grid;
      gap: 14px;
      margin-top: 4px;
      user-select: none;
      min-height: 140px;
      border: 2px dashed transparent;
      border-radius: 16px;
      padding: 6px;
      transition: border-color 0.2s ease, background-color 0.2s ease;
    }

    .cards-grid.drag-over-candidate {
      border-color: var(--primary-color);
      background-color: var(--primary-light);
    }

    .cards-grid.level-1 { grid-template-columns: repeat(4, 1fr); }
    .cards-grid.level-2 { grid-template-columns: repeat(3, 1fr); }
    .cards-grid.level-3 { grid-template-columns: repeat(4, 1fr); }

    @media (max-width: 640px) {
      .cards-grid.level-1 { grid-template-columns: repeat(2, 1fr); }
      .cards-grid.level-2 { grid-template-columns: repeat(2, 1fr); }
      .cards-grid.level-3 { grid-template-columns: repeat(2, 1fr); }
    }

    .item-card {
      background: var(--card-bg);
      border: 2px solid var(--border-color);
      border-radius: 16px;
      padding: 8px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: grab;
      position: relative;
      transition: border-color 0.12s ease, background-color 0.12s ease, box-shadow 0.12s ease;
      box-shadow: var(--shadow);
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-user-drag: none;
      overscroll-behavior: contain;
    }

    .item-card:active { cursor: grabbing; }

    /* 手機拖曳期間避免 LINE / iOS WebView 將手勢轉成整頁捲動。 */
    html.semantic-touch-drag-active,
    html.semantic-touch-drag-active body {
      overscroll-behavior: none !important;
    }
    html.semantic-touch-drag-active body {
      -webkit-user-select: none !important;
      user-select: none !important;
    }

    .item-card.drag-source,
    .folder-item-card.drag-source {
      opacity: 0.24 !important;
      transition: none !important;
    }

    .drag-ghost {
      position: fixed !important;
      pointer-events: none !important;
      z-index: 10001 !important;
      opacity: 0.94 !important;
      margin: 0 !important;
      transition: none !important;
      will-change: transform;
      contain: layout paint;
      box-shadow: 0 10px 24px rgba(0,0,0,0.22) !important;
    }

    .item-card img {
      width: 100%;
      height: 90px;
      object-fit: contain;
      border-radius: 8px;
      margin-bottom: 6px;
      background-color: transparent;
      padding: 0;
      pointer-events: none;
    }

    .item-card .item-label {
      font-size: calc(18px * var(--font-scale));
      font-weight: 800;
      color: var(--primary-dark);
      text-align: center;
      margin-top: 2px;
      pointer-events: none;
    }

    .item-card.selected {
      border: 3px solid var(--primary-color);
      background-color: var(--primary-light);
      transform: scale(1.02);
      box-shadow: 0 4px 12px rgba(79, 112, 88, 0.25);
    }

    .bucket-container {
      display: flex;
      justify-content: center;
      width: 100%;
      margin-top: 10px;
    }

    .bucket {
      width: 100%;
      padding: 16px;
      border-radius: 20px;
      border: 2.5px solid var(--primary-color);
      background-color: var(--primary-light);
      color: var(--primary-dark);
      min-height: 160px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: flex-start;
      gap: 12px;
      position: relative;
      box-shadow: var(--shadow);
      transition: all 0.2s ease;
      user-select: none;
      cursor: pointer;
    }

    .bucket.drag-over {
      border: 3px solid var(--primary-color) !important;
      background-color: #C8E6C9 !important;
      transform: scale(1.01);
      box-shadow: 0 6px 16px rgba(79, 112, 88, 0.3);
    }

    .bucket-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      padding-bottom: 8px;
      border-bottom: 2px dashed var(--border-color);
      pointer-events: none;
    }

    .bucket-title-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .bucket-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary-dark);
      width: 26px;
      height: 26px;
    }

    .bucket-icon svg {
      width: 24px;
      height: 24px;
      stroke: var(--primary-dark);
    }

    .bucket-title {
      font-size: calc(20px * var(--font-scale));
      font-weight: 800;
      color: var(--primary-dark);
    }

    .btn-undo {
      background-color: #FFFFFF;
      color: var(--primary-dark);
      border: 1.5px solid var(--primary-color);
      padding: 5px 14px;
      font-size: calc(14px * var(--font-scale));
      font-weight: 700;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-undo:hover:not(:disabled) {
      background-color: var(--primary-light);
    }

    .btn-undo:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      border-color: #C0CFC3;
      color: #728575;
    }

    .bucket-count-badge {
      font-size: calc(14px * var(--font-scale));
      font-weight: 700;
      color: var(--primary-dark);
      background: #FFFFFF;
      border: 1px solid var(--border-color);
      padding: 3px 12px;
      border-radius: 14px;
    }

    .bucket-content-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(85px, 1fr));
      gap: 10px;
      width: 100%;
      max-height: 200px;
      overflow-y: auto;
      padding: 4px;
      pointer-events: auto;
    }

    .bucket-empty-hint {
      width: 100%;
      grid-column: 1 / -1;
      min-height: 85px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px dashed #B8C9BA;
      border-radius: 14px;
      color: #6E8075;
      font-size: calc(15px * var(--font-scale));
      font-weight: 700;
      pointer-events: none;
    }

    .folder-item-card {
      background-color: #FFFFFF;
      border: 1.5px solid var(--border-color);
      border-radius: 12px;
      padding: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      cursor: grab;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-user-drag: none;
      overscroll-behavior: contain;
      transition: border-color 0.12s ease, background-color 0.12s ease, box-shadow 0.12s ease;
    }

    .folder-item-card:active { cursor: grabbing; }

    .folder-item-card img {
      width: 48px;
      height: 48px;
      object-fit: contain;
      margin-bottom: 4px;
      pointer-events: none;
    }

    .folder-item-card span {
      font-size: calc(13px * var(--font-scale));
      font-weight: 700;
      color: var(--primary-dark);
      text-align: center;
      width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none;
    }

    .bucket.active-hint {
      animation: pulse 1.2s infinite;
      border-color: var(--primary-dark);
    }

    @keyframes pulse {

<div id="app-container">

  <div class="category-screen" id="category-screen">

  </div>

  <main id="game-main">
    <div class="game-header-banner" id="game-header-banner">
      <div class="game-top-nav-row">
        <button type="button" class="btn-back-nav" id="btn-game-back-tier" onclick="goBackToTierSelect()">❮ 返回等級選擇</button>

        <button type="button" class="level-nav-btn" id="nav-btn-3" onclick="handleNavClick(3)">關卡三</button>
      </div>
    </div>

      <div class="question-title" id="question-title">載入中...</div>

              <span id="bucket-primary-text" class="bucket-title">收納籃</span>

        </div>
      </div>
    </div>

    <div class="feedback-toast" id="feedback-toast"></div>

  function initDisplaySettings() {

    var langAliases = { 'ko-KR': 'ko', 'ko_KR': 'ko', 'ja-JP': 'ja', 'ja_JP': 'ja', 'zh': 'zh-TW', 'zh-TW': 'zh-TW' };
    requestedLang = langAliases[requestedLang] || requestedLang;
    currentLang = i18nDict[requestedLang] ? requestedLang : 'zh-TW';
    currentFontScale = urlParams.get('fontScale') || localStorage.getItem('app_font_scale') || '100';
    document.documentElement.lang = currentLang;
    var localizedDocumentTitles = {

  function t(key, vars) {
    var dict = i18nDict[currentLang] || i18nDict['zh-TW'];
    var text = dict[key] || i18nDict['zh-TW'][key] || key;
    if (vars) {
      for (var k in vars) {
        text = text.replace(new RegExp('\\{' + k + '\\}', 'g'), vars[k]);
      }
    }
    return text;
  }

  // 只轉換畫面顯示文字；題庫原始中文名稱仍保留，確保比對、計分與抽題邏輯不變。
  function localizeGameText(value) {
    var text = String(value == null ? '' : value);
    var map = gameContentI18n[currentLang] || {};
    if (map[text]) return map[text];
    var foodQuestionMatch = text.match(/^哪些是(.+?)？$/);
    if (foodQuestionMatch) {
      var subject = map[foodQuestionMatch[1]] || foodQuestionMatch[1];
      if (currentLang === 'en') return 'Which items belong to the ' + subject + ' category?';
      if (currentLang === 'ko') return subject + '에 해당하는 것은 무엇일까요?';
      if (currentLang === 'ja') return subject + 'はどれですか？';
    }
    // 食物題目的收納籃名稱由分類名稱加上「籃」組成，補上各語言的通用轉換。
    if (text.endsWith('籃')) {
      var bucketBase = text.slice(0, -1);
      var localizedBase = map[bucketBase];
      if (localizedBase) {
        if (currentLang === 'en') return localizedBase.charAt(0).toUpperCase() + localizedBase.slice(1) + ' Basket';
        if (currentLang === 'ko') return localizedBase + ' 바구니';
        if (currentLang === 'ja') return localizedBase + 'かご';
      }
    }
    return text;
  }

  function playFlipSound() {
    try {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return;
      const ctx = new AudioContext();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      
      osc.type = 'sine';
      osc.frequency.setValueAtTime(320, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(120, ctx.currentTime + 0.08);
      
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
      
      osc.connect(gain);
      gain.connect(ctx.destination);
      
      osc.start();
      osc.stop(ctx.currentTime + 0.08);
    } catch(e) {}
  }

  function playMatchSound() {
    setTimeout(function() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(659.25, ctx.currentTime + 0.25);
        
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
        
        osc.connect(gain);
        gain.connect(ctx.destination);
        
        osc.start();
        osc.stop(ctx.currentTime + 0.25);
      } catch(e) {}
    }, 400);
  }

  function playSynthApplause() {
    try {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return;
      const ctx = new AudioContext();
      for (let i = 0; i < 25; i++) {
        setTimeout(function() {
          const bufferSize = ctx.sampleRate * 0.08;
          const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let j = 0; j < bufferSize; j++) data[j] = Math.random() * 2 - 1;
          const noise = ctx.createBufferSource();
          noise.buffer = buffer;
          const filter = ctx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.value = 1000 + Math.random() * 1200;
          const gain = ctx.createGain();
          gain.gain.setValueAtTime(0.4, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
          noise.connect(filter);
          filter.connect(gain);
          gain.connect(ctx.destination);
          noise.start();
        }, i * (60 + Math.random() * 80));
      }
    } catch(e) {}
  }

  function playPerfectApplauseSound() {
    try {
      applauseAudio.currentTime = 0;
      const playPromise = applauseAudio.play();
      if (playPromise !== undefined) {
        playPromise.catch(function() { playSynthApplause(); });
      }
    } catch (e) { playSynthApplause(); }
  }

// 1. Canvas 彩帶繪製動畫
function startConfetti() {
  stopConfetti();

  const canvas = document.getElementById('confetti-canvas');
  if (!canvas) return;

  const ctx = canvas.getContext('2d');
  if (!ctx) return;

  const container = canvas.parentElement;
  canvas.width = container ? container.clientWidth : window.innerWidth;
  canvas.height = container ? container.clientHeight : window.innerHeight;

  const count = 28;
  const particles = Array.from({ length: count }, function() {
    return {
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      color: ['#F94174', '#FFB703', '#36B9D8', '#55B96B', '#9B6AD6', '#F47C35'][Math.floor(Math.random() * 6)],
      width: Math.random() * 4 + 4,
      height: Math.random() * 7 + 6,
      speed: Math.random() * 1.2 + 0.7,
      drift: (Math.random() - 0.5) * 0.8,
      sway: Math.random() * 0.7 + 0.2,
      phase: Math.random() * Math.PI * 2,
      rotation: Math.random() * Math.PI * 2,
      rotationSpeed: (Math.random() - 0.5) * 0.1
    };
  });

  confettiInterval = setInterval(function() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(function(p) {
      p.y += p.speed;
      p.phase += 0.045;
      p.x += p.drift + Math.sin(p.phase) * p.sway;
      p.rotation += p.rotationSpeed;

      if (p.y > canvas.height + p.height) {
        p.y = -p.height;
        p.x = Math.random() * canvas.width;
      }
      if (p.x < -15) p.x = canvas.width + 10;
      if (p.x > canvas.width + 15) p.x = -10;

      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rotation);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.width / 2, -p.height / 2, p.width, p.height);
      ctx.restore();
    });
  }, 25);
}

function stopConfetti() {
  if (confettiInterval) {
    clearInterval(confettiInterval);
    confettiInterval = null;
  }
  const canvas = document.getElementById('confetti-canvas');
  if (canvas) {
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
}

function playPerfectApplauseSound(isManualClick) {
  if (applauseTimeoutTimer) {
    clearTimeout(applauseTimeoutTimer);
  }

  if (!applauseAudio) {
    applauseAudio = new Audio('https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3');
  }

  applauseAudio.currentTime = 0;
  const playPromise = applauseAudio.play();

  if (playPromise !== undefined) {
    playPromise.then(function() {
      applauseTimeoutTimer = setTimeout(function() {
        if (applauseAudio) {
          applauseAudio.pause();
          applauseAudio.currentTime = 0;
        }
      }, 3800);
    }).catch(function() {
      playSynthApplause();
    });
  } else {
    playSynthApplause();
  }

  // 滿分且手動點擊按鈕時，同步重發拍手動畫
  if (isManualClick) {
    const isPerfect = currentRunScores[0] === 100 && currentRunScores[1] === 100 && currentRunScores[2] === 100;

      triggerBreakdownClapAnimation();

  }
}

  let lockedNoticeTimer = null;

  // 取消尚未顯示的鎖定提醒，並清除卡片晃動狀態。
  function cancelPendingLockedNotice() {
    if (lockedNoticeTimer) {
      clearTimeout(lockedNoticeTimer);
      lockedNoticeTimer = null;
    }

    document.querySelectorAll('.level-entry-card.shake, .category-card.shake').forEach(function(card) {
      card.classList.remove('shake');
    });

    const lockedModal = document.getElementById('modal-locked');
    if (lockedModal) {
      lockedModal.classList.remove('is-visible');
      lockedModal.setAttribute('aria-hidden', 'true');
      lockedModal.style.removeProperty('display');
      lockedModal.style.display = 'none';
    }
  }

  // 卡片先晃動，再固定顯示未解鎖提醒；不依賴 animationend 事件。
  function shakeThenShowLockedNotice(card, tier, categoryKey) {
    const targetTier = Number(tier);
    if (!Number.isFinite(targetTier) || targetTier <= 1) return;

    if (lockedNoticeTimer) {
      clearTimeout(lockedNoticeTimer);
      lockedNoticeTimer = null;
    }

    if (card) {
      card.classList.remove('shake');
      void card.offsetWidth;
      card.classList.add('shake');
    }

    // CSS 晃動動畫為 0.35 秒，稍後顯示提示視窗。
    lockedNoticeTimer = setTimeout(function() {
      lockedNoticeTimer = null;
      if (card) card.classList.remove('shake');
      showLockedNotice(targetTier, categoryKey);
    }, 380);
  }

  function handleTierCardClick(tier, event) {
    const targetTier = Number(tier);
    // 等級一永遠開放，不應顯示鎖定提醒。
    if (targetTier === 1) {
      cancelPendingLockedNotice();
    } else if (!isTierUnlockedAny(targetTier)) {
      shakeThenShowLockedNotice(event && event.currentTarget ? event.currentTarget : null, targetTier, null);
      return;
    } else {
      cancelPendingLockedNotice();
    }

    currentTier = targetTier;
    renderCategoryCards();
    document.getElementById("intro-screen").style.display = "none";
    document.getElementById("category-screen").style.display = "flex";

    const tierNames = { 1: t('tier.1.rank'), 2: t('tier.2.rank'), 3: t('tier.3.rank') };
    document.getElementById("selected-tier-title").innerText = tierNames[targetTier];
  }

  function showLockedNotice(tier, categoryKey) {
    const targetTier = Number(tier);
    if (!Number.isFinite(targetTier) || targetTier <= 1) return;

    const modal = document.getElementById('modal-locked');
    const titleEl = document.getElementById('modal-locked-title');
    const descEl = document.getElementById('modal-locked-desc');
    if (!modal) return;

    // 提示內容固定使用指定文字，不再於動畫結束後重複判斷解鎖狀態。
    if (titleEl) titleEl.textContent = t('modal.locked_title');
    if (descEl) descEl.textContent = t('modal.locked_desc');

    // 將視窗放到 body 最外層，避免受到遊戲容器的堆疊層級或裁切影響。
    if (modal.parentElement !== document.body) {
      document.body.appendChild(modal);
    }

    modal.setAttribute('aria-hidden', 'false');
    modal.classList.add('is-visible');
    modal.style.setProperty('position', 'fixed', 'important');
    modal.style.setProperty('inset', '0', 'important');
    modal.style.setProperty('width', '100vw', 'important');
    modal.style.setProperty('height', '100vh', 'important');
    modal.style.setProperty('display', 'flex', 'important');
    modal.style.setProperty('visibility', 'visible', 'important');
    modal.style.setProperty('opacity', '1', 'important');
    modal.style.setProperty('pointer-events', 'auto', 'important');
    modal.style.setProperty('z-index', '2147483647', 'important');
  }

  // 2. 依據分數計算金星與灰星數量規格（0~59分保底1金2灰）
  function getStarRating(score) {
    if (score >= 100) return { gold: 3, grey: 0 };
    if (score >= 60)  return { gold: 2, grey: 1 };
    return { gold: 1, grey: 2 };
  }

  // 3. 生成固定 3 顆星星 HTML（0.1s, 0.25s, 0.4s 動畫延遲）
  function render3StarsHTML(score) {
    const rating = getStarRating(score);
    const delays = [0.1, 0.25, 0.4];
    let html = '';
    
    for (let i = 0; i < rating.gold; i++) {
      html += '<span class="star-icon gold" style="animation-delay: ' + delays[i] + 's;">★</span>';
    }
    for (let j = 0; j < rating.grey; j++) {
      const idx = rating.gold + j;
      html += '<span class="star-icon grey" style="animation-delay: ' + delays[idx] + 's;">★</span>';
    }
    return html;
  }

    // 單關結算不顯示「總結算」才有的兩顆導覽按鈕。
    // showSummary() 會把總結算按鈕列插在 #summary-card 外層；
    // 回到單關結算時，必須一併清除，避免它們殘留在畫面旁邊。
    summaryScreen.querySelectorAll(
      ":scope > .summary-action-group, :scope > .summary-actions-group"
    ).forEach(function(actionGroup) {
      actionGroup.remove();
    });
    summaryScreen.style.display = "flex";
  }

  // 防呆機制：若 summary-card 容器不存在則自動建立，防止 null 報錯。
  // 不重建整個 summary-screen，避免影響單關結算原本的 DOM 結構。
  let summaryCard = document.getElementById("summary-card");
  if (!summaryCard && summaryScreen) {
    summaryCard = document.createElement("div");
    summaryCard.id = "summary-card";
    summaryCard.className = "settlement-card";
    summaryScreen.appendChild(summaryCard);
  }

  // 取得原有的星星與獎牌資訊
  const medal = (typeof getMedalInfo === 'function') ? getMedalInfo(score) : { svg: '', scoreText: score + '分', comment: '表現不錯！' };
  const starsHtml = (typeof render3StarsHTML === 'function') ? render3StarsHTML(score) : (typeof renderStarsSVG === 'function' ? renderStarsSVG(score >= 90 ? 3 : score >= 60 ? 2 : 1) : '');

  // 判斷按鈕文字與跳轉：前兩關顯示「前往下一關」，第三關顯示「看總成績」
  const isLastSubLevel = subIdx >= 2;
  const nextBtnText = isLastSubLevel ? t('summary.to_final') : (subIdx === 0 ? t('summary.to_l2') : t('summary.to_l3'));
  const nextOnClick = isLastSubLevel ? 'showSummary()' : ('goToNextSubLevel(' + (subIdx + 1) + ')');

  // 還原您原本完整的單關結算內容 (包含星星、答對/答錯題數框)
  if (summaryCard) {
    summaryCard.innerHTML = 
      '<h2 class="settlement-title">' + t('summary.sublevel_complete', { level: t('sublevel.' + (subIdx + 1)) }) + '</h2>' +
      '<div class="settlement-stars">' + starsHtml + '</div>' +
      '<div class="settlement-score-pill">' + (medal.svg || '') + ' ' + t('summary.sub_score') + medal.scoreText + '</div>' +
      '<div class="sublevel-encouragement">' + medal.comment + '</div>' +
      '<div class="summary-breakdown-box" style="display:flex; flex-direction:column; gap:10px; width:100%; max-width:360px; margin:0 auto 18px auto;">' +
        '<div class="breakdown-card correct"><span>' + t('summary.correct_count_label') + '</span><span class="count">' + correctCount + ' ' + t('summary.unit_item') + '</span></div>' +
        '<div class="breakdown-card wrong"><span>' + t('summary.wrong_count_label') + '</span><span class="count">' + incorrectCount + ' ' + t('summary.unit_item') + '</span></div>' +
      '</div>' +
      '<div class="summary-actions-group">' +
        '<button type="button" class="summary-full-btn" onclick="' + nextOnClick + '">' + nextBtnText + '</button>' +
      '</div>';
  }
}

function goToNextSubLevel(nextSubIdx) {
  const summaryScreen = document.getElementById("summary-screen");
  if (summaryScreen) summaryScreen.style.display = "none";

  // 超過 3 關自動跳轉到總成績，否則載入下一關
  if (nextSubIdx >= 3) {
    showSummary();
  } else {
    loadSubLevel(nextSubIdx);
  }
}

// 總成績結算畫面（包含各關成績明細、掌聲音效與完整功能按鈕）
function showSummary() {
  const gameMain = document.getElementById("game-main");
  const gameHeader = document.getElementById("game-header-banner");
  const summaryScreen = document.getElementById("summary-screen");
  if (!gameMain || !gameHeader || !summaryScreen) return;

  // 只在總結算期間套用檔案二的頁首排版，不改動一般遊戲頁與單關結算。
  gameMain.classList.add("summary-mode");
  document.body.classList.add("summary-mode");
  gameMain.style.display = "flex";
  gameHeader.style.display = "flex";

  const qBanner = document.getElementById("question-banner");
  const gWorkspace = document.getElementById("game-workspace");
  const fToast = document.getElementById("feedback-toast");
  const aBar = document.getElementById("action-bar");
  if (qBanner) qBanner.style.display = "none";
  if (gWorkspace) gWorkspace.style.display = "none";
  if (fToast) fToast.style.display = "none";
  if (aBar) aBar.style.display = "none";

  // 與檔案二相同：總結算時隱藏返回列，只留下置中的成績結算頁籤。
  const navBar = gameMain.querySelector(".level-nav-bar");
  if (navBar) {
    navBar.innerHTML = '<button type="button" class="level-nav-btn active" style="width:100%;">' + t('summary.final_tab') + '</button>';
  }

  // 清除舊的結算 DOM，避免重玩後重複插入按鈕或保留舊動畫。
  const s1 = currentRunScores[0] || 0;
  const s2 = currentRunScores[1] || 0;
  const s3 = currentRunScores[2] || 0;
  const totalScore = currentRunScores.reduce(function(sum, score) {
    return sum + score;
  }, 0);
  const rawAvgScore = Math.round(totalScore / 3);
  const isAll100ThisRun = currentRunScores[0] === 100 && currentRunScores[1] === 100 && currentRunScores[2] === 100;

  const bFinal = getBadgeData(rawAvgScore);
  const b1 = getBadgeData(s1);
  const b2 = getBadgeData(s2);
  const b3 = getBadgeData(s3);
  const formatScore = function(score) {
    return score === 0 ? t('settle.zero_score') : score + t('summary.sub_score_unit');
  };

  // 彩帶數量、顏色、分布、延遲與動畫時間沿用檔案二。
  const confettiColors = ['#e91e63', '#4caf50', '#2196f3', '#ffeb3b', '#ff9800', '#9c27b0', '#00bcd4', '#ff5722'];
  let confettiHTML = '';
  for (let i = 0; i < 24; i++) {
    const left = Math.floor((i / 24) * 92 + 4 + (Math.random() * 3 - 1.5));
    const color = confettiColors[i % confettiColors.length];
    const delay = (Math.random() * 2.5).toFixed(2);
    const duration = (2.4 + Math.random() * 1.2).toFixed(2);
    const isCircle = i % 3 === 0;
    confettiHTML += '<span class="confetti-piece" style="left:' + left + '%; background:' + color + '; width:' + (isCircle ? '8px' : '7px') + '; height:' + (isCircle ? '13px' : '9px') + '; border-radius:' + (isCircle ? '50%' : '2px') + '; animation-delay:' + delay + 's; animation-duration:' + duration + 's;"></span>';
  }

  // 只有三關全滿分才顯示獎盃與兩側星光；位置在標題下、星星上，與檔案二相同。
  const decorStarsSVG =
    '<svg class="decor-stars" viewBox="0 0 40 40">' +
      '<path d="M20 2 L23 15 L36 18 L23 21 L20 34 L17 21 L4 18 L17 15 Z" fill="#FFB74D"/>' +
      '<path d="M32 24 L33.5 28.5 L38 29.5 L33.5 30.5 L32 35 L30.5 30.5 L26 29.5 L30.5 28.5 Z" fill="#FFE082"/>' +
      '<path d="M10 4 L11 7.5 L14.5 8.5 L11 9.5 L10 13 L9 9.5 L5.5 8.5 L9 7.5 Z" fill="#FFE082"/>' +
    '</svg>';

  const trophyGraphicHTML = isAll100ThisRun ?
    '<div class="perfect-graphic-group">' +
      '<div class="side-decor">' + decorStarsSVG + '</div>' +
      '<svg class="perfect-trophy-svg" viewBox="0 0 100 100">' +
        '<defs>' +
          '<linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#FFE082"/><stop offset="30%" stop-color="#FFD54F"/><stop offset="55%" stop-color="#FFB300"/><stop offset="85%" stop-color="#FF8F00"/><stop offset="100%" stop-color="#FF6F00"/></linearGradient>' +
          '<linearGradient id="base-grad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#8D6E63"/><stop offset="50%" stop-color="#5D4037"/><stop offset="100%" stop-color="#3E2723"/></linearGradient>' +
          '<linearGradient id="stem-grad" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#FFB300"/><stop offset="50%" stop-color="#FFE082"/><stop offset="100%" stop-color="#FF8F00"/></linearGradient>' +
        '</defs>' +
        '<path d="M 24 22 C 8 22, 8 46, 26 48 M 76 22 C 92 22, 92 46, 74 48" fill="none" stroke="url(#gold-grad)" stroke-width="5" stroke-linecap="round"/>' +
        '<path d="M 22 18 L 78 18 L 70 54 C 66 68, 34 68, 30 54 Z" fill="url(#gold-grad)"/>' +
        '<ellipse cx="50" cy="18" rx="28" ry="5" fill="#FFE082"/>' +
        '<path d="M 32 22 L 40 22 C 37 38, 38 48, 36 56 C 34 54, 33 40, 32 22 Z" fill="#FFFFFF" opacity="0.45"/>' +
        '<rect x="43" y="66" width="14" height="12" fill="url(#stem-grad)"/>' +
        '<ellipse cx="50" cy="66" rx="10" ry="3" fill="#FFA000"/>' +
        '<path d="M 28 78 L 72 78 L 76 92 L 24 92 Z" fill="url(#base-grad)"/>' +
        '<rect x="24" y="78" width="52" height="4" fill="#A1887F"/>' +
      '</svg>' +
      '<div class="side-decor">' + decorStarsSVG + '</div>' +
    '</div>' : '';

  // 按鈕保留檔案一原有功能；只沿用檔案二的三段式排列和按鈕外觀。
  const actionButtonsHTML =
    '<div class="summary-action-group">' +
      '<button type="button" class="btn-play-again" onclick="selectCategoryAndStart(selectedCategory)">' + t('summary.play_again') + '</button>' +
      '<div class="sub-nav-row">' +
        '<button type="button" class="btn-sub-nav" onclick="goBackToCategorySelect()">' + t('summary.select_other_theme') + '</button>' +
        '<button type="button" class="btn-sub-nav" onclick="goBackToTierSelect()">' + t('summary.back_tier') + '</button>' +
      '</div>' +
    '</div>';

  // DOM 順序完整比照檔案二：標題 → 獎盃 → 星星 → 平均分數 → 鼓勵文字 → 明細 → 音效按鈕 → 主/次按鈕。
  summaryScreen.innerHTML =
    '<div class="settlement-card" id="summary-card">' +
      '<div class="confetti-container">' + confettiHTML + '</div>' +
      '<h2 class="settlement-title">' + t(isAll100ThisRun ? 'summary.final_perfect_title' : 'summary.final_normal_title') + '</h2>' +
      trophyGraphicHTML +
      '<div class="settlement-stars">' + renderStarsSVG(bFinal.stars) + '</div>' +
      '<div class="settlement-score-pill">' + t('summary.avg_score') + formatScore(rawAvgScore) + '</div>' +
      '<div class="settlement-encouragement">' + (isAll100ThisRun ? t('summary.final_perfect_encouragement') : bFinal.comment) + '</div>' +
      '<div class="summary-breakdown-wrapper">' +
        '<div class="summary-breakdown-box ' + (isAll100ThisRun ? 'active-anim' : '') + '" id="summaryBreakdownBox">' +
          '<div class="clapping-hand-breakdown">👏</div>' +
          '<div class="summary-breakdown-row"><span>' + t('sublevel.1') + '：</span><span class="summary-breakdown-score">' + b1.svg + ' ' + formatScore(s1) + '</span></div>' +
          '<div class="summary-breakdown-row"><span>' + t('sublevel.2') + '：</span><span class="summary-breakdown-score">' + b2.svg + ' ' + formatScore(s2) + '</span></div>' +
          '<div class="summary-breakdown-row"><span>' + t('sublevel.3') + '：</span><span class="summary-breakdown-score">' + b3.svg + ' ' + formatScore(s3) + '</span></div>' +
        '</div>' +
      '</div>' +
      '<div><button type="button" class="btn-clap-sound" onclick="playPerfectApplauseSound(true)">' + t('summary.btn_replay') + '</button></div>' +
    '</div>' +
    actionButtonsHTML;

  summaryScreen.style.display = "flex";

  // 本主題目前等級的三關全部滿分，才解鎖下一等級並播放原有解鎖動畫。
  // 每個主題獨立計算；已解鎖的等級不重複跳出動畫。
  let newlyUnlockedTier = null;
  if (isAll100ThisRun && currentTier < 3 && categoryTierUnlockedMap[selectedCategory]) {
    const nextTier = currentTier + 1;
    if (!categoryTierUnlockedMap[selectedCategory][nextTier]) {
      categoryTierUnlockedMap[selectedCategory][nextTier] = true;
      saveCategoryTierUnlockMap();
      renderTierCards();
      newlyUnlockedTier = nextTier;
    }
  }

  // 保留檔案一原有掌聲音檔與函式名稱，不改動音效來源。
  if (typeof playPerfectApplauseSound === 'function') {
    playPerfectApplauseSound();
  }

  // 完成三關全滿分時顯示解鎖通知。是否首次解鎖只影響狀態寫入，
  // 不再讓已保存的解鎖狀態意外阻止動畫顯示（例如測試重跑或動畫曾被中斷）。
  if (isAll100ThisRun && currentTier < 3 && typeof triggerUnlockAnimation === 'function') {
    triggerUnlockAnimation(selectedCategory, currentTier + 1);
  }
}

  function handleNavClick(targetSubIdx) {
    const targetZeroIdx = targetSubIdx - 1;
    if (targetZeroIdx === currentSubLevelIndex) return;
    showModal('modal-step-by-step');
  }

  function renderStandardCardGrid() {
    const grid = document.getElementById("standard-cards-grid");
    grid.innerHTML = "";

    activeQuestion.items.forEach(function(item) {
      if (classifiedItems[item.id] && classifiedItems[item.id].inBasket) return;

      const card = document.createElement("div");
      card.className = "item-card";
      card.id = 'card-' + item.id;

      if (selectedItemId === item.id) card.classList.add("selected");

      card.innerHTML = '<img src="' + item.img + '" alt="' + localizeGameText(item.name) + '" onerror="this.onerror=null;this.src=\'https://via.placeholder.com/150/78947D/FFFFFF?text=\' + encodeURIComponent(this.alt) + \'\';">' +
        '<div class="item-label">' + localizeGameText(item.name) + '</div>';

      initCardDragAndClick(card, item);
      grid.appendChild(card);
    });
  }

  function selectCard(itemId) {
    if (typeof isSubLevelFinished !== 'undefined' && isSubLevelFinished) return;
    
    if (typeof selectedItemId !== 'undefined') {
      selectedItemId = (selectedItemId === itemId) ? null : itemId;
    }

    if (typeof renderStandardCardGrid === 'function') {
      renderStandardCardGrid();
    }
    if (typeof updateBucketHints === 'function') {
      updateBucketHints(selectedItemId !== null);
    }
  }

  function classifyItemIntoBasket(itemId) {
    if (isSubLevelFinished) return;
    if (!itemId) {
      showFeedback(t('toast.no_select'), "incorrect");
      return;
    }
    if (classifiedItems[itemId] && classifiedItems[itemId].inBasket) return;

    // 不論點擊收納區或拖曽物品，都必須遵守目前等級的選取上限。
    const selectionLimit = getTierSelectionLimit(currentTier);
    if (placementHistory.length >= selectionLimit) {
      showSelectionLimitNotice();
      return;
    }

    const item = activeQuestion.items.find(function(i) { return i.id === itemId; });
    if (!item) return;

    classifiedItems[itemId] = { inBasket: true };
    placementHistory.push(itemId);

    playMatchSound();
    selectedItemId = null;
    updateBucketHints(false);
    updateUndoButtonState();

    const basketName = activeQuestion ? activeQuestion.primaryBucket : "收納籃";
    showFeedback(t('toast.put_success', { item: localizeGameText(item.name), basket: localizeGameText(basketName) }), "correct");

    renderStandardCardGrid();
    renderFolderContents();
  }

  // 手機 / LINE 內建瀏覽器防整頁捲動鎖：只有手指或觸控筆按住可拖曳卡片時才啟用。
  // touchmove 使用非 passive + capture，補強部分 WebView 對 touch-action 的支援差異。
  let semanticTouchDragLockCount = 0;

  function acquireSemanticTouchDragLock() {
    semanticTouchDragLockCount += 1;
    if (document.documentElement) {
      document.documentElement.classList.add('semantic-touch-drag-active');
    }
  }

  function releaseSemanticTouchDragLock() {
    semanticTouchDragLockCount = Math.max(0, semanticTouchDragLockCount - 1);
    if (semanticTouchDragLockCount === 0 && document.documentElement) {
      document.documentElement.classList.remove('semantic-touch-drag-active');
    }
  }

  function preventSemanticPageScrollDuringDrag(e) {
    if (semanticTouchDragLockCount > 0 && e.cancelable) e.preventDefault();
  }

  if (!window.__semanticTouchScrollGuardInstalled) {
    document.addEventListener('touchmove', preventSemanticPageScrollDuringDrag, {
      passive: false,
      capture: true
    });
    window.__semanticTouchScrollGuardInstalled = true;
  }

  // 使用 Pointer Events 統一處理滑鼠、觸控筆與手機手指，避免 touch/mouse 相容事件重複觸發。
  // 拖曳預覽使用 transform: translate3d，避免每次移動都重新計算 left/top 造成手機掉幀。
  function createSmoothDragGhost(sourceEl, ghostId, startRect, offsetX, offsetY) {
    const ghost = sourceEl.cloneNode(true);
    ghost.removeAttribute('id');
    ghost.id = ghostId;
    ghost.classList.remove('drag-source');
    ghost.classList.add('drag-ghost');
    ghost.style.left = startRect.left + 'px';
    ghost.style.top = startRect.top + 'px';
    ghost.style.width = startRect.width + 'px';
    ghost.style.height = startRect.height + 'px';
    ghost.style.transform = 'translate3d(' + offsetX + 'px, ' + offsetY + 'px, 0)';
    document.body.appendChild(ghost);
    return ghost;
  }

  function initCardDragAndClick(card, item) {
    let activePointerId = null;
    let startX = 0;
    let startY = 0;
    let startRect = null;
    let isDragging = false;
    let ghostEl = null;
    let hasTouchDragLock = false;

    const removeTrackingListeners = function() {
      window.removeEventListener('pointermove', handlePointerMove);
      window.removeEventListener('pointerup', handlePointerUp);
      window.removeEventListener('pointercancel', handlePointerCancel);
    };

    const removeDragVisuals = function() {
      if (ghostEl && ghostEl.parentNode) ghostEl.parentNode.removeChild(ghostEl);
      ghostEl = null;
      card.classList.remove('drag-source');
      const bucket = document.getElementById('bucket-primary');
      if (bucket) bucket.classList.remove('drag-over');
    };

    const finishPointer = function(pointerId) {
      removeTrackingListeners();
      activePointerId = null;
      if (hasTouchDragLock) {
        hasTouchDragLock = false;
        releaseSemanticTouchDragLock();
      }
      try {
        if (card.hasPointerCapture && card.hasPointerCapture(pointerId)) {
          card.releasePointerCapture(pointerId);
        }
      } catch (err) {
        // 部分舊版瀏覽器可能不支援 pointer capture；window 事件監聽仍可完成拖曳。
      }
    };

    const handlePointerMove = function(e) {
      if (activePointerId === null || e.pointerId !== activePointerId || isSubLevelFinished) return;
      // 一開始移動就阻止頁面捲動，不等到拖曳超過啟動門檻。
      if (e.pointerType !== 'mouse' && e.cancelable) e.preventDefault();

      const currentX = e.clientX;
      const currentY = e.clientY;
      const offsetX = currentX - startX;
      const offsetY = currentY - startY;
      const distance = Math.hypot(offsetX, offsetY);

      if (!isDragging && distance > 6) {
        isDragging = true;

        // 重要：拖曳開始時只更新選取狀態，不呼叫 selectCard()。
        // selectCard() 會重建卡片 DOM，手機上容易讓正在拖曳的原卡片瞬間消失或尺寸歸零。
        selectedItemId = item.id;
        document.querySelectorAll('#standard-cards-grid .item-card.selected').forEach(function(el) {
          el.classList.remove('selected');
        });
        card.classList.add('selected', 'drag-source');
        updateBucketHints(true);

        // 使用 pointerdown 當下記錄的卡片尺寸與位置，不讀取已重繪或移動後的 offset。
        ghostEl = createSmoothDragGhost(card, 'drag-ghost', startRect, offsetX, offsetY);
      }

      if (!isDragging || !ghostEl) return;
      if (e.cancelable) e.preventDefault();

      // 只更新合成層 transform，避免頻繁觸發版面重新排版。
      ghostEl.style.transform = 'translate3d(' + offsetX + 'px, ' + offsetY + 'px, 0)';

      const elemBelow = document.elementFromPoint(currentX, currentY);
      const bucket = document.getElementById('bucket-primary');
      if (bucket) {
        const overBucket = !!(elemBelow && (bucket === elemBelow || bucket.contains(elemBelow)));
        bucket.classList.toggle('drag-over', overBucket);
      }
    };

    const handlePointerUp = function(e) {
      if (activePointerId === null || e.pointerId !== activePointerId) return;

      const wasDragging = isDragging;
      const endX = e.clientX;
      const endY = e.clientY;
      const bucket = document.getElementById('bucket-primary');
      const elemBelow = wasDragging ? document.elementFromPoint(endX, endY) : null;
      const droppedIntoBucket = !!(wasDragging && bucket && elemBelow && (bucket === elemBelow || bucket.contains(elemBelow)));
      const pointerId = activePointerId;

      removeDragVisuals();
      finishPointer(pointerId);

      if (wasDragging) {
        if (droppedIntoBucket) {
          classifyItemIntoBasket(item.id);
        } else {
          // 未放入收納籃時保留選取狀態，使用者可直接點收納籃完成放置。
          selectedItemId = item.id;
          card.classList.add('selected');
          updateBucketHints(true);
        }
      } else {
        // 純點擊仍沿用原本「點一下選取，再點一次取消」的操作方式。
        selectCard(item.id);
      }

      isDragging = false;
      startRect = null;
    };

    const handlePointerCancel = function(e) {
      if (activePointerId === null || e.pointerId !== activePointerId) return;
      const wasDragging = isDragging;
      const pointerId = activePointerId;
      removeDragVisuals();
      finishPointer(pointerId);
      isDragging = false;
      startRect = null;

      if (wasDragging) {
        selectedItemId = item.id;
        const currentCard = document.getElementById('card-' + item.id);
        if (currentCard) currentCard.classList.add('selected');
        updateBucketHints(true);
      }
    };

    const handlePointerDown = function(e) {
      if (isSubLevelFinished || activePointerId !== null) return;
      if (e.pointerType === 'mouse' && e.button !== 0) return;

      activePointerId = e.pointerId;
      startX = e.clientX;
      startY = e.clientY;
      startRect = card.getBoundingClientRect();
      isDragging = false;

      // 從按下卡片的瞬間鎖定整頁捲動，避免 LINE / iOS WebView 先帶動頁面。
      if (e.pointerType !== 'mouse') {
        acquireSemanticTouchDragLock();
        hasTouchDragLock = true;
        if (e.cancelable) e.preventDefault();
      }
      try {
        if (card.setPointerCapture) card.setPointerCapture(e.pointerId);
      } catch (err) {
        // window 事件監聽作為 pointer capture 的備援。
      }

      window.addEventListener('pointermove', handlePointerMove, { passive: false });
      window.addEventListener('pointerup', handlePointerUp);
      window.addEventListener('pointercancel', handlePointerCancel);
    };

    card.addEventListener('pointerdown', handlePointerDown, { passive: false });
  }

  function handleBucketClick(isPrimaryChosen) {
    if (isSubLevelFinished) return;
    if (isPrimaryChosen) classifyItemIntoBasket(selectedItemId);
  }

  function undoLastClassification(e) {
    if (e) e.stopPropagation();
    if (isSubLevelFinished || placementHistory.length === 0) return;

    const lastItemId = placementHistory.pop();
    const item = activeQuestion.items.find(function(i) { return i.id === lastItemId; });

    if (classifiedItems[lastItemId]) delete classifiedItems[lastItemId];

    updateUndoButtonState();
    renderStandardCardGrid();
    renderFolderContents();

    if (item) showFeedback(t('toast.undo_success', { item: localizeGameText(item.name) }), "correct");
  }

  function initFolderCardDragAndClick(card, item) {
    let activePointerId = null;
    let startX = 0;
    let startY = 0;
    let startRect = null;
    let isDragging = false;
    let ghostEl = null;
    let hasTouchDragLock = false;

    const removeTrackingListeners = function() {
      window.removeEventListener('pointermove', handlePointerMove);
      window.removeEventListener('pointerup', handlePointerUp);
      window.removeEventListener('pointercancel', handlePointerCancel);
    };

    const removeDragVisuals = function() {
      if (ghostEl && ghostEl.parentNode) ghostEl.parentNode.removeChild(ghostEl);
      ghostEl = null;
      card.classList.remove('drag-source');
      const grid = document.getElementById('standard-cards-grid');
      if (grid) grid.classList.remove('drag-over-candidate');
    };

    const finishPointer = function(pointerId) {
      removeTrackingListeners();
      activePointerId = null;
      if (hasTouchDragLock) {
        hasTouchDragLock = false;
        releaseSemanticTouchDragLock();
      }
      try {
        if (card.hasPointerCapture && card.hasPointerCapture(pointerId)) {
          card.releasePointerCapture(pointerId);
        }
      } catch (err) {
        // 舊版瀏覽器備援。
      }
    };

    const handlePointerMove = function(e) {
      if (activePointerId === null || e.pointerId !== activePointerId || isSubLevelFinished) return;
      // 一開始移動就阻止頁面捲動，不等到拖曳超過啟動門檻。
      if (e.pointerType !== 'mouse' && e.cancelable) e.preventDefault();

      const currentX = e.clientX;
      const currentY = e.clientY;
      const offsetX = currentX - startX;
      const offsetY = currentY - startY;
      const distance = Math.hypot(offsetX, offsetY);

      if (!isDragging && distance > 6) {
        isDragging = true;
        card.classList.add('drag-source');
        ghostEl = createSmoothDragGhost(card, 'drag-ghost-folder', startRect, offsetX, offsetY);
      }

      if (!isDragging || !ghostEl) return;
      if (e.cancelable) e.preventDefault();
      ghostEl.style.transform = 'translate3d(' + offsetX + 'px, ' + offsetY + 'px, 0)';

      const elemBelow = document.elementFromPoint(currentX, currentY);
      const grid = document.getElementById('standard-cards-grid');
      const overGrid = !!(grid && elemBelow && (grid === elemBelow || grid.contains(elemBelow)));
      if (grid) grid.classList.toggle('drag-over-candidate', overGrid);
    };

    const handlePointerUp = function(e) {
      if (activePointerId === null || e.pointerId !== activePointerId) return;

      const wasDragging = isDragging;
      const endX = e.clientX;
      const endY = e.clientY;
      const elemBelow = wasDragging ? document.elementFromPoint(endX, endY) : null;
      const candidateGrid = document.getElementById('standard-cards-grid');
      const bucket = document.getElementById('bucket-primary');
      const workspace = document.getElementById('game-workspace');
      const pointerIsInCandidateGrid = !!(candidateGrid && elemBelow && (
        candidateGrid === elemBelow || candidateGrid.contains(elemBelow)
      ));
      const pointerIsInWorkspace = !!(workspace && elemBelow && workspace.contains(elemBelow));
      const pointerIsInBucket = !!(bucket && elemBelow && (
        bucket === elemBelow || bucket.contains(elemBelow)
      ));
      const droppedBackToGrid = !!(wasDragging && (
        pointerIsInCandidateGrid || (pointerIsInWorkspace && !pointerIsInBucket)
      ));
      const pointerId = activePointerId;

      removeDragVisuals();
      finishPointer(pointerId);

      if (droppedBackToGrid) {
        delete classifiedItems[item.id];
        placementHistory = placementHistory.filter(function(id) { return id !== item.id; });
        updateUndoButtonState();
        renderStandardCardGrid();
        renderFolderContents();
        showFeedback(t('toast.return_success', { item: localizeGameText(item.name) }), 'correct');
      }

      isDragging = false;
      startRect = null;
    };

    const handlePointerCancel = function(e) {
      if (activePointerId === null || e.pointerId !== activePointerId) return;
      const pointerId = activePointerId;
      removeDragVisuals();
      finishPointer(pointerId);
      isDragging = false;
      startRect = null;
    };

    const handlePointerDown = function(e) {
      if (isSubLevelFinished || activePointerId !== null) return;
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      e.stopPropagation();
      if (e.cancelable) e.preventDefault();

      activePointerId = e.pointerId;
      startX = e.clientX;
      startY = e.clientY;
      startRect = card.getBoundingClientRect();
      isDragging = false;

      // 從按下卡片的瞬間鎖定整頁捲動，避免 LINE / iOS WebView 先帶動頁面。
      if (e.pointerType !== 'mouse') {
        acquireSemanticTouchDragLock();
        hasTouchDragLock = true;
        if (e.cancelable) e.preventDefault();
      }

      try {
        if (card.setPointerCapture) card.setPointerCapture(e.pointerId);
      } catch (err) {
        // window 事件監聽作為備援。
      }

      window.addEventListener('pointermove', handlePointerMove, { passive: false });
      window.addEventListener('pointerup', handlePointerUp);
      window.addEventListener('pointercancel', handlePointerCancel);
    };

    card.addEventListener('pointerdown', handlePointerDown, { passive: false });
    // 防止點擊收納籃內的小卡時，事件冒泡觸發「點收納籃放入已選物品」。
    card.addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();
    });
  }

  function updateUndoButtonState() {
    const undoBtn = document.getElementById("btn-undo");
    if (!undoBtn) return;
    undoBtn.disabled = placementHistory.length === 0 || isSubLevelFinished;
  }

  function finishSubLevelClassification() {
    isSubLevelFinished = true;
    updateUndoButtonState();

    let correctCount = 0;
    let incorrectCount = 0;

    activeQuestion.items.forEach(function(item) {
      if (classifiedItems[item.id] && classifiedItems[item.id].inBasket) {
        if (item.isCorrect) correctCount++;
        else incorrectCount++;
      }
    });

    // 分數依每個正確物品的固定配分累加；錯誤選項不加分，且會占用可選名額。
    let score = 0;
    let correctItemIndex = 0;
    activeQuestion.items.forEach(function(item) {
      if (classifiedItems[item.id] && classifiedItems[item.id].inBasket && item.isCorrect) {
        const assignedWeight = Number(item.scoreValue);
        score += Number.isFinite(assignedWeight)
          ? assignedWeight
          : getTierScoreWeight(currentTier, correctItemIndex);
        correctItemIndex++;
      }
    });
    score = Math.max(0, Math.min(100, Math.round(score)));

    currentRunScores[currentSubLevelIndex] = score;
    showSubLevelSummary(currentSubLevelIndex, score, correctCount, incorrectCount);
  }

  function renderFolderContents() {
    const primaryContainer = document.getElementById("bucket-primary-content");
    if (!primaryContainer) return;

    primaryContainer.innerHTML = "";
    let primaryCount = 0;

    activeQuestion.items.forEach(function(item) {
      const record = classifiedItems[item.id];
      if (record && record.inBasket) {
        const itemCard = document.createElement("div");
        itemCard.className = "folder-item-card";
        itemCard.innerHTML = '<img src="' + item.img + '" alt="' + localizeGameText(item.name) + '">' +
          '<span>' + localizeGameText(item.name) + '</span>';
        initFolderCardDragAndClick(itemCard, item);
        primaryContainer.appendChild(itemCard);
        primaryCount++;
      }
    });

    if (primaryCount === 0) {
      primaryContainer.innerHTML = '<div class="bucket-empty-hint">' + t('bucket.empty_hint') + '</div>';
    }

    const pCountEl = document.getElementById("bucket-primary-count");
    if (pCountEl) pCountEl.innerText = t('bucket.stored') + primaryCount + t('bucket.unit');

    const finishBtn = document.getElementById("btn-finish-level");
    if (finishBtn) {
      finishBtn.disabled = (primaryCount === 0);
    }
  }

  function updateBucketHints(isActive) {
    const primaryContainer = document.getElementById("bucket-primary-content");
    if (!primaryContainer) return;
    
    const hintEl = primaryContainer.querySelector(".bucket-empty-hint");
    if (hintEl) {
      hintEl.style.borderColor = isActive ? "#4F7058" : "#B8C9BA";
    }
  }

  function showFeedback(msg, type) {
    const fb = document.getElementById("feedback-toast");
    fb.innerText = msg;
    fb.className = 'feedback-toast ' + type;
  }

  function nextSubLevel() {
    stopConfetti();
    if (currentSubLevelIndex < 2) {
      loadSubLevel(currentSubLevelIndex + 1);
    } else {
      showSummary();
    }
  }

  function replayCurrentTier() {
    stopConfetti();
    selectCategoryAndStart(selectedCategory);
  }

  function showModal(modalId) {
    const modal = document.getElementById(modalId);
    if (modal) modal.style.display = 'flex';
  }

  function closeModal(modalId) {
    const modal = document.getElementById(modalId);
    if (modal) {
      modal.classList.remove('is-visible');
      modal.setAttribute('aria-hidden', 'true');
      modal.style.removeProperty('display');
      modal.style.display = 'none';
      modal.style.removeProperty('position');
      modal.style.removeProperty('inset');
      modal.style.removeProperty('width');
      modal.style.removeProperty('height');
      modal.style.removeProperty('visibility');
      modal.style.removeProperty('opacity');
      modal.style.removeProperty('pointer-events');
      modal.style.removeProperty('z-index');
    }
  }

  var unlockAnimationTimer = null;

  function triggerUnlockAnimation(categoryKey, unlockedTier) {
    const modal = document.getElementById("modal-unlock-anim");
    const pillEl = document.getElementById("unlock-modal-pill");
    const titleEl = document.getElementById("lbl-unlock-anim-title");
    if (!modal || !pillEl) return;

    const romanNums = { 2: "二", 3: "三" };
    const tierDisplay = currentLang === 'zh-TW' ? (romanNums[unlockedTier] || String(unlockedTier)) : String(unlockedTier);
    pillEl.textContent = t('unlock.pill_text', {
      cat: getCategoryFullName(categoryKey),
      tier: tierDisplay
    });
    if (titleEl) titleEl.textContent = t('modal.unlock_title');

    if (unlockAnimationTimer) {
      clearTimeout(unlockAnimationTimer);
      unlockAnimationTimer = null;
    }

    // 先顯示視窗，再逐一重啟動畫，避免隱藏狀態下重設動畫造成偶發不播放。
    modal.style.display = "flex";
    const animatedElements = modal.querySelectorAll(
      '.unlock-modal-card, .unlock-glow-circle, .shackle-path, .sparkle-star, .unlock-anim-pill-box'
    );
    animatedElements.forEach(function(element) {
      element.style.animation = 'none';
      void element.offsetWidth;
      element.style.animation = '';
    });

    // 文字必須確實顯示；不依賴延遲動畫是否成功啟動。
    const pillBox = modal.querySelector('.unlock-anim-pill-box');
    if (pillBox) {
      pillBox.style.opacity = '1';
      pillBox.style.transform = 'translateY(0)';
      pillBox.style.animationDelay = '0s';
    }

    void modal.offsetWidth;
    unlockAnimationTimer = setTimeout(function() {
      modal.style.display = "none";
      unlockAnimationTimer = null;
      if (pillBox) {
        pillBox.style.opacity = '';
        pillBox.style.transform = '';
        pillBox.style.animationDelay = '';
      }
    }, 3200);
  }
</script>
