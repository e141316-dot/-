<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <base target="_self">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>畫畫看連連看 - 認知訓練 App</title>
  <style>
    /* ==========================================
       1. 全域樣式與奶油白柔和綠色系主題
       ========================================== */
    :root {
      --bg-page: #FCFBF7;         /* 頁面整體背景 */
      --primary-sage: #4F7058;    /* 主標題、主要按鈕、重點文字 */
      --text-main: #35473C;       /* 一般內文說明文字 */
      --bg-subtle: #EAF0E7;       /* 說明區塊、得分膠囊背景 */
      --border-radius: 16px;
      --font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-scale: 1;
      --base-font-size: 16px;
    }

    body.font-scale-90 { --font-scale: 0.9; }
    body.font-scale-100 { --font-scale: 1.0; }
    body.font-scale-115 { --font-scale: 1.15; }
    body.font-scale-130 { --font-scale: 1.3; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-family);
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      margin: 0;
      padding: 0;
      background-color: var(--bg-page);
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding-bottom: 24px;
      overflow-x: hidden;
      overflow-y: auto;
      font-size: calc(var(--base-font-size) * var(--font-scale));
      line-height: 1.5;
    }

    header, main, .settlement-card, .modal-overlay {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    header {
      width: 100%;
      background-color: var(--bg-page);
      color: var(--primary-sage);
      padding: 24px 16px 0 16px;
      text-align: center;
      box-shadow: none;
      margin: 0;
    }

    header h1 {
      font-size: calc(26px * var(--font-scale));
      font-weight: 700;
      color: var(--primary-sage);
      margin-bottom: 24px;
      line-height: 1.25;
      text-align: center;
      width: 100%;
      word-break: break-word;
    }

    /* 繪圖頁版頭固定採「返回鍵 → 遊戲標題 → 關卡導覽」順序。
       以 flex order 明確指定，避免實際遊戲頁仍將返回鍵排在關卡導覽下方。 */
    header#header-nav:not(.hidden) {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header#header-nav > .drawing-back-wrap {
      order: 0;
      align-self: stretch;
      width: 92%;
      max-width: 800px;
      margin: 0 auto 8px;
      padding-top: 0;
    }

    header#header-nav > #lbl-app-header-title {
      order: 1;
    }

    header#header-nav > #nav-bar {
      order: 2;
    }

    .nav-bar {
      display: flex;
      justify-content: center;
      align-items: stretch;
      gap: 12px;
      width: 92%;
      max-width: 800px;
      margin: 0 auto;
    }

    /* 最終總結算時，隱藏四個關卡按鈕，只顯示中央「總成績」膠囊。 */
    .nav-bar.total-summary-nav { justify-content: center; }
    .nav-bar.total-summary-nav > .nav-item { display: none; }
    .nav-bar .total-nav-item {
      display: flex;
      flex: 0 0 auto;
      width: min(220px, 52vw);
      min-height: 56px;
      box-sizing: border-box;
      align-items: center;
      justify-content: center;
      background-color: var(--primary-sage, #4F7058);
      color: #FFFFFF;
      border-radius: 28px;
      font-size: calc(16px * var(--font-scale));
      font-weight: bold;
      padding: 6px 18px;
    }

    /* 依照「看時間回答遊戲」的導覽樣式：上方關卡、下方任務名稱。 */
    .nav-item {
      flex: 1 1 0px;
      min-width: 0;
      min-height: 72px;
      background-color: #ECEFEA;
      color: #AEB7B0;
      padding: 8px 5px;
      border-radius: 30px;
      font-size: calc(16px * var(--font-scale));
      font-weight: bold;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      cursor: pointer;
      transition: background-color 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
      text-align: center;
      white-space: normal;
      line-height: 1.25;
      border: none;
    }

    .nav-stage-label {
      display: block;
      font-size: calc(16px * var(--font-scale));
      font-weight: 800;
      line-height: 1.25;
    }

    .nav-stage-desc {
      display: block;
      font-size: calc(14px * var(--font-scale));
      font-weight: 700;
      line-height: 1.25;
      opacity: 0.9;
    }

    .nav-item.active {
      background-color: var(--primary-sage);
      color: #FFFFFF;
      border: none;
      box-shadow: 0 5px 12px rgba(53, 71, 60, 0.18);
    }

    .nav-item.completed:not(.active) {
      background-color: #DCE6D8;
      color: var(--primary-sage);
      border: 1px solid #C7D5C6;
      box-shadow: none;
    }

    @media (max-width: 480px) {
      .nav-bar {
        width: 100%;
        gap: 6px;
      }
      .nav-item {
        min-height: 66px;
        padding: 7px 2px;
      }
      .nav-stage-label {
        font-size: calc(13px * var(--font-scale));
      }
      .nav-stage-desc {
        font-size: calc(11px * var(--font-scale));
      }
    }

    main {
      width: 92%;
      max-width: 800px;
      background: var(--bg-page);
      border-radius: var(--border-radius);
      box-shadow: none;
      margin: 20px auto 0 auto;
      padding: 0;
    }

    #intro-view {
      background-color: var(--bg-page);
    }

    .intro-back-wrap {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      width: 100%;
      margin-bottom: 14px;
      padding-top: 2px;
    }

    .btn-back-category {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: var(--bg-subtle);
      border: none;
      color: var(--primary-sage);
      font-size: calc(16px * var(--font-scale));
      font-weight: 700;
      text-decoration: none;
      min-height: 44px;
      padding: 0 18px;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: none;
      transition: background-color 0.2s ease, opacity 0.2s ease;
    }

    .btn-back-category:active {
      opacity: 0.8;
      background-color: #dce6d8;
    }

    .btn-back-category svg {
      width: 19px;
      height: 19px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .intro-header-title {
      color: var(--primary-sage);
      font-size: calc(28px * var(--font-scale));
      font-weight: 700;
      text-align: center;
      margin-bottom: 16px;
      word-break: break-word;
    }

    .intro-notice {
      background-color: var(--bg-subtle);
      border-radius: 12px;
      border: none;
      padding: 12px 16px;
      text-align: center;
      color: var(--text-main);
      font-size: calc(17px * var(--font-scale));
      font-weight: 600;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    /* 四關說明合併為單一白色大框，列與列之間以淡灰綠虛線分隔。 */
    .intro-list {
      display: flex;
      flex-direction: column;
      gap: 0;
      margin-bottom: 24px;
      background: #FFFFFF;
      border: 1.5px solid #E4E9DF;
      border-radius: 16px;
      overflow: hidden;
    }

    .intro-card {
      background: transparent;
      border: 0;
      border-radius: 0;
      padding: 18px 20px;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 16px;
      box-shadow: none;
      height: auto;
    }

    .intro-card:not(:last-child) {
      border-bottom: 1.5px dashed #E4E9DF;
    }

    @media (max-width: 480px) {
      .intro-card {
        padding: 16px 14px;
        gap: 12px;
      }
    }

    .intro-svg-box {
      width: 90px;
      height: 90px;
      min-width: 90px;
      min-height: 90px;
      background-color: var(--bg-subtle);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border: none;
    }

    .intro-svg-box svg {
      width: 58px;
      height: 58px;
    }

    .intro-card-text {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .intro-card-title {
      font-size: calc(20px * var(--font-scale));
      font-weight: 700;
      color: var(--primary-sage);
      margin-bottom: 6px;
    }

    .intro-card-desc {
      font-size: calc(16px * var(--font-scale));
      font-weight: 400;
      line-height: 1.5;
      color: var(--text-main);
      word-break: break-word;
    }

    .intro-btn-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      margin-top: 8px;
    }

    .intro-start-btn {
      width: 100%;
      max-width: 360px;
      min-height: 52px;
      background-color: var(--primary-sage);
      color: #ffffff;
      font-size: calc(19px * var(--font-scale));
      font-weight: 700;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: background-color 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .intro-start-btn:active {
      background-color: #35473C;
    }

    /* 首頁高度最佳化：平板與一般螢幕高度較矮時，減少裝飾性留白，
       優先讓四關說明與「開始遊戲」按鈕完整出現在同一個畫面。 */
    @media screen and (min-width: 481px) and (max-height: 900px) {
      main {
        margin-top: 12px;
      }

      .intro-back-wrap {
        margin-bottom: 8px;
        padding-top: 0;
      }

      .intro-header-title {
        font-size: calc(26px * var(--font-scale));
        margin-bottom: 10px;
      }

      .intro-notice {
        padding: 9px 14px;
        margin-bottom: 14px;
        line-height: 1.4;
      }

      .intro-list {
        margin-bottom: 12px;
      }

      .intro-card {
        padding: 12px 18px;
        gap: 14px;
      }

      .intro-svg-box {
        width: 76px;
        height: 76px;
        min-width: 76px;
        min-height: 76px;
      }

      .intro-svg-box svg {
        width: 52px;
        height: 52px;
      }

      .intro-card-title {
        font-size: calc(19px * var(--font-scale));
        margin-bottom: 3px;
      }

      .intro-card-desc {
        font-size: calc(16px * var(--font-scale));
        line-height: 1.35;
      }

      .intro-btn-wrap {
        margin-top: 4px;
      }

      .intro-start-btn {
        min-height: 50px;
      }

      body {
        padding-bottom: 10px;
      }
    }

    /* 較矮的手機視窗：進一步收緊列高，但保留長輩易讀的文字尺寸。 */
    @media screen and (max-width: 480px) and (max-height: 760px) {
      main {
        margin-top: 8px;
      }

      .intro-back-wrap {
        margin-bottom: 6px;
        padding-top: 0;
      }

      .btn-back-category {
        min-height: 40px;
        padding: 0 14px;
        font-size: calc(15px * var(--font-scale));
      }

      .intro-header-title {
        font-size: calc(24px * var(--font-scale));
        margin-bottom: 8px;
      }

      .intro-notice {
        padding: 7px 12px;
        font-size: calc(16px * var(--font-scale));
        line-height: 1.35;
        margin-bottom: 10px;
      }

      .intro-list {
        margin-bottom: 10px;
      }

      .intro-card {
        padding: 10px 12px;
        gap: 10px;
      }

      .intro-svg-box {
        width: 64px;
        height: 64px;
        min-width: 64px;
        min-height: 64px;
      }

      .intro-svg-box svg {
        width: 46px;
        height: 46px;
      }

      .intro-card-title {
        font-size: calc(18px * var(--font-scale));
        margin-bottom: 2px;
      }

      .intro-card-desc {
        font-size: calc(16px * var(--font-scale));
        line-height: 1.3;
      }

      .intro-btn-wrap {
        margin-top: 4px;
      }

      .intro-start-btn {
        min-height: 48px;
        font-size: calc(18px * var(--font-scale));
      }

      body {
        padding-bottom: 8px;
      }
    }

    .question-box {
      width: 100%;
      background-color: #FFFFFF;
      border-radius: 16px;
      border: none;
      padding: 14px 18px;
      margin-bottom: 24px;
      text-align: center;
    }

    .stage-box-title {
      /* 保留 DOM 供原有關卡程式更新，但題目區不再顯示「第一關｜畫圓圈」等標題。 */
      display: none !important;
    }

    .question-text {
      white-space: pre-line;
      font-size: calc(20px * var(--font-scale));
      font-weight: 700;
      color: var(--text-main);
      text-align: center;
      line-height: 1.45;
    }

    .target-time-badge {
      display: inline-block;
      background-color: var(--primary-sage);
      color: #ffffff;
      font-size: calc(18px * var(--font-scale));
      font-weight: bold;
      padding: 6px 18px;
      border-radius: 20px;
      margin-top: 10px;
    }

    .tools {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-bottom: 26px;
    }

    .btn-tool {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: calc(16px * var(--font-scale));
      font-weight: bold;
      border: 1.5px solid var(--primary-sage);
      border-radius: 25px;
      padding: 8px 18px;
      min-height: 44px;
      background: #ffffff;
      color: var(--primary-sage);
      cursor: pointer;
    }

    /* 工具按鈕使用自行繪製的 SVG 線條圖示，不使用 Emoji 或文字符號。 */
    .btn-tool .tool-icon {
      display: block;
      width: 20px;
      height: 20px;
      flex: 0 0 20px;
      color: currentColor;
      pointer-events: none;
    }

    .btn-tool .tool-label {
      display: inline-block;
      white-space: nowrap;
    }

    .btn-tool.selected {
      background: var(--primary-sage);
      color: #ffffff;
    }

    .canvas-wrap {
      position: relative;
      isolation: isolate;
      touch-action: none !important;
      overscroll-behavior: contain !important;
      -webkit-user-select: none !important;
      user-select: none !important;
      width: 520px;
      height: 520px;
      aspect-ratio: 1 / 1;
      max-width: 100%;
      margin: 0 auto;
      border: 3px solid var(--primary-sage);
      border-radius: 16px;
      overflow: hidden;
      background: #ffffff;
      touch-action: none !important;
      -ms-touch-action: none !important;
      overscroll-behavior: none !important;
      -webkit-user-select: none !important;
      user-select: none !important;
      -webkit-touch-callout: none !important;
    }

    canvas {
      position: relative;
      z-index: 1;
      pointer-events: auto;
      width: 100% !important;
      height: 100% !important;
      display: block;
      touch-action: none !important;
      overscroll-behavior: none !important;
      -webkit-user-select: none !important;
      user-select: none !important;
      -webkit-touch-callout: none !important;
    }

    .action-bar {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 16px;
    }

    .btn-submit {
      width: 100%;
      max-width: 420px;
      height: 52px;
      background-color: var(--primary-sage);
      color: #ffffff;
      font-size: calc(19px * var(--font-scale));
      font-weight: 800;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .disclaimer-box {
      margin-top: 18px;
      padding: 12px 16px;
      background-color: var(--bg-subtle);
      color: var(--text-main);
      border-radius: 12px;
      font-size: calc(15px * var(--font-scale));
      font-weight: 500;
      text-align: center;
      line-height: 1.5;
      word-break: break-word;
    }

    .settlement-card {
      position: relative;
      background: var(--bg-page);
      border: none;
      border-radius: 20px;
      padding: 24px 16px;
      margin-bottom: 12px;
      text-align: center;
      overflow: hidden;
    }

    .settlement-card > *:not(.confetti-container):not(.clapping-popup-overlay) {
      position: relative;
      z-index: 2;
    }

    .settlement-title {
      color: var(--primary-sage);
      font-size: calc(24px * var(--font-scale));
      font-weight: 800;
      margin: 0 auto 12px auto;
      text-align: center;
      width: 100%;
      box-sizing: border-box;
      padding: 0 8px;
      word-break: break-word;
    }

    .trophy-star-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      margin: 6px 0 10px 0;
    }

    .trophy-icon {
      font-size: 3.5rem;
      line-height: 1;
      display: inline-block;
      filter: drop-shadow(0 4px 10px rgba(255, 193, 7, 0.5));
      animation: trophyGlow 2.5s ease-in-out infinite alternate;
    }

    @keyframes trophyGlow {
      0% { transform: scale(1); }
      100% { transform: scale(1.06); }
    }

    .four-point-star-svg {
      width: 32px;
      height: 32px;
      display: inline-block;
      animation: starPulse 2.2s ease-in-out infinite alternate;
    }

    .four-point-star-svg.star-right {
      animation-delay: 0.8s;
    }

    @keyframes starPulse {
      0% { transform: scale(0.92) rotate(-6deg); opacity: 0.82; }
      100% { transform: scale(1.12) rotate(6deg); opacity: 1; }
    }

    .settlement-stars {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      margin: 10px 0 16px 0;
    }

    /* 總成績星星：依總平均顯示金星與灰星，門檻比照語意聯想。 */
    .total-settlement-stars {
      gap: 12px;
      margin: 6px 0 10px 0;
    }
    .total-settlement-star {
      display: inline-block;
      opacity: 0;
      transform: translateY(-28px) scale(0.6);
      animation: totalSettlementStarDrop 0.65s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }
    .total-settlement-star .total-star-svg {
      width: clamp(40px, 9.5vw, 50px);
      height: clamp(40px, 9.5vw, 50px);
      display: block;
    }
    .total-settlement-star.gold .total-star-svg {
      filter: drop-shadow(0 3px 6px rgba(245, 158, 11, 0.45));
    }
    .total-settlement-star.grey .total-star-svg {
      filter: none;
    }
    .total-settlement-star.star-1 { animation-delay: 0.1s; }
    .total-settlement-star.star-2 { animation-delay: 0.25s; }
    .total-settlement-star.star-3 { animation-delay: 0.4s; }
    @keyframes totalSettlementStarDrop {
      0% { opacity: 0; transform: translateY(-50px) scale(0.6); }
      70% { opacity: 1; transform: translateY(5px) scale(1.12); }
      85% { transform: translateY(-2px) scale(0.98); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* 總成績獎牌與平均分數置中排列。 */
    .total-settlement-score-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* 總成績滿分獎盃，使用語意聯想相同的 SVG 獎盃與兩側星光。 */
    .total-perfect-graphic-group {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin: 2px 0;
      position: relative;
    }
    .total-perfect-side-decor {
      position: relative;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .total-perfect-decor-stars {
      position: absolute;
      width: 36px;
      height: 36px;
      opacity: 0;
      transform: scale(0);
      animation: totalPerfectDecorFadeIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.2s forwards;
      filter: drop-shadow(0 2px 4px rgba(255, 179, 0, 0.4));
    }
    .total-perfect-trophy-svg {
      width: clamp(58px, 16vw, 76px);
      height: clamp(58px, 16vw, 76px);
      filter: drop-shadow(0 4px 10px rgba(255, 179, 0, 0.45));
      animation: totalPerfectTrophyPopIn 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards,
                 totalPerfectTrophyFloat 3s ease-in-out 0.7s infinite alternate;
    }
    @keyframes totalPerfectDecorFadeIn {
      0% { opacity: 0; transform: scale(0) rotate(-20deg); }
      70% { opacity: 1; transform: scale(1.2) rotate(10deg); }
      100% { opacity: 1; transform: scale(1) rotate(0deg); }
    }
    @keyframes totalPerfectTrophyPopIn {
      0% { transform: translateY(-30px) scale(0.2); opacity: 0; }
      60% { transform: translateY(4px) scale(1.15); opacity: 1; }
      80% { transform: translateY(-2px) scale(0.95); }
      100% { transform: translateY(0) scale(1); opacity: 1; }

      0% { transform: translateY(0) rotate(0deg); }

    .star-wrapper {
      position: relative;
      display: inline-flex;
      justify-content: center;
      align-items: center;

    .five-point-star-icon {
      width: 42px;
      height: 42px;
      fill: #FFB300;
      display: inline-block;
      opacity: 0;
      transform-origin: center center;
      filter: drop-shadow(0 2px 6px rgba(255, 179, 0, 0.45));
      animation: starPopIn 0.55s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards,
                 starGlowPulse 2.2s ease-in-out infinite 0.6s;
    }

    .star-wrapper.star-1 .five-point-star-icon { animation-delay: 0.15s, 0.7s; }
    .star-wrapper.star-2 .five-point-star-icon { animation-delay: 0.35s, 0.9s; }
    .star-wrapper.star-3 .five-point-star-icon { animation-delay: 0.55s, 1.1s; }

    @keyframes starPopIn {
      0% { opacity: 0; transform: scale(0) rotate(-25deg); }
      70% { opacity: 1; transform: scale(1.25) rotate(8deg); }
      100% { opacity: 1; transform: scale(1); }

    @keyframes starGlowPulse {
      0%, 100% { filter: drop-shadow(0 2px 6px rgba(255, 179, 0, 0.5)); }
      50% { filter: drop-shadow(0 0 12px rgba(255, 215, 0, 0.95)) drop-shadow(0 0 20px rgba(255, 193, 7, 0.7)); }

      position: absolute;

      opacity: 0;

      animation: sparkleFlash 1.6s ease-in-out forwards;

    .star-wrapper.star-1 .sparkle-bottom { animation-delay: 0.65s; }
    .star-wrapper.star-2 .sparkle-top { animation-delay: 0.7s; }
    .star-wrapper.star-2 .sparkle-bottom { animation-delay: 0.85s; }
    .star-wrapper.star-3 .sparkle-top { animation-delay: 0.9s; }
    .star-wrapper.star-3 .sparkle-bottom { animation-delay: 1.05s; }

    @keyframes sparkleFlash {
      0% { opacity: 0; transform: scale(0) rotate(0deg); }
      40% { opacity: 1; transform: scale(1.4) rotate(45deg); }

  var currentLang = 'zh-TW';

  function initDisplaySettings() {
    var urlParams = new URLSearchParams(window.location.search);
    currentLang = urlParams.get('lang') || localStorage.getItem('app_lang') || 'zh-TW';
    currentFontScale = urlParams.get('fontScale') || localStorage.getItem('app_font_scale') || '100';

    localStorage.setItem('app_lang', currentLang);
    localStorage.setItem('app_font_scale', currentFontScale);

    document.body.classList.remove('font-scale-90', 'font-scale-100', 'font-scale-115', 'font-scale-130');
    document.body.classList.add('font-scale-' + currentFontScale);
  }

  function t(key, vars) {
    var dict = i18nDict[currentLang] || i18nDict['zh-TW'];
    var text = dict[key] || i18nDict['zh-TW'][key] || key;
    if (vars) {
      for (var k in vars) {
        text = text.replace(new RegExp('\\{' + k + '\\}', 'g'), vars[k]);
      }
    }
    return text;
  }

  function applyStaticI18n() {
    const setT = function(id, k) {
      const el = document.getElementById(id);
      if (el) {
        // 工具按鈕只更新文字節點，保留前方的 SVG 線條圖示。
        const label = el.querySelector('.tool-label');
        (label || el).textContent = t(k);
      }
    };

    setT('lbl-app-header-title', 'game.title');
    setT('lbl-btn-back-cat', 'nav.back_category');
    setT('lbl-btn-back-intro', 'nav.back_intro');
    setT('lbl-intro-main-title', 'game.title');
    setT('lbl-intro-notice', 'intro.notice');

    setT('lbl-card-1-title', 'stage.1.title'); setT('lbl-card-1-desc', 'stage.1.desc');
    setT('lbl-card-2-title', 'stage.2.title'); setT('lbl-card-2-desc', 'stage.2.desc');
    setT('lbl-card-3-title', 'stage.3.title'); setT('lbl-card-3-desc', 'stage.3.desc');
    setT('lbl-card-4-title', 'stage.4.title'); setT('lbl-card-4-desc', 'stage.4.desc');

    setT('intro-start-btn', 'btn.start');
    setT('pen', 'tool.pen');
    setT('eraser', 'tool.eraser');
    setT('undo', 'tool.undo');
    setT('clear', 'tool.clear');
    setT('next', 'btn.submit');
    setT('disclaimer-box', 'disclaimer');

    for (let i = 0; i < 4; i++) {
      setT('nav-label-' + i, 'nav.sublevel.' + (i + 1));
      setT('nav-desc-' + i, 'nav.stage_desc.' + (i + 1));

  // 保留使用者目前選擇的語言與字體大小，並直接進行單次跳轉。
  function navigateToStaticPage(fileName) {
    var targetUrl = new URL(fileName, window.location.href);
    targetUrl.searchParams.set('lang', currentLang || 'zh-TW');
    targetUrl.searchParams.set('fontScale', currentFontScale || '100');
    window.location.assign(targetUrl.toString());
  }

    function makeRandomTime() {
      const hour = Math.floor(Math.random() * 12) + 1;
      const minute = Math.floor(Math.random() * 12) * 5;
      return String(hour).padStart(2, '0') + ':' + String(minute).padStart(2, '0');
    }

    // 僅轉換畫面顯示格式；targetTime 原始 HH:MM 值仍保留供評分使用。
    function formatTargetTimeForDisplay(timeValue) {
      const parts = String(timeValue || '').split(':');
      if (parts.length !== 2) return String(timeValue || '');

      const hour = Number.parseInt(parts[0], 10);
      const minute = Number.parseInt(parts[1], 10);
      if (!Number.isFinite(hour) || !Number.isFinite(minute)) return String(timeValue);

      if (currentLang === 'en') {
        return hour + ':' + String(minute).padStart(2, '0');
      }
      if (currentLang === 'ja') {
        return minute === 0 ? hour + '時ちょうど' : hour + '時' + minute + '分';
      }
      if (currentLang === 'ko') {
        return minute === 0 ? hour + '시 정각' : hour + '시 ' + minute + '분';
      }
      return minute === 0 ? hour + ' 點整' : hour + ' 點 ' + minute + ' 分';
    }

    function setTool(tName) {
      tool = tName;

    function drawArrowLine(x1, y1, x2, y2, color, lineWidth, headLen) {
      const angle = Math.atan2(y2 - y1, x2 - x1);
      ctx.save();
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = lineWidth;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(x2, y2);
      ctx.lineTo(x2 - headLen * Math.cos(angle - Math.PI / 6), y2 - headLen * Math.sin(angle - Math.PI / 6));
      ctx.lineTo(x2 - headLen * Math.cos(angle + Math.PI / 6), y2 - headLen * Math.sin(angle + Math.PI / 6));
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function drawTemplate() {
      if (stage === 1 || stage === 2) { 
        ctx.save();
        ctx.strokeStyle = '#b9c7bd';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(300, 300, 220, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      if (stage === 2) {
        ctx.save();
        ctx.fillStyle = '#87958b';
        ctx.font = 'bold 31px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        for (let n = 1; n <= 12; n++) {
          const a = n * Math.PI / 6 - Math.PI / 2;
          ctx.fillText(String(n), 300 + 177 * Math.cos(a), 300 + 177 * Math.sin(a));
        }
        ctx.restore();
      }
    }

    function drawClockHands(historyHands) {
      if (stage !== 2 && stage !== 3) return;
      const cx = 300, cy = 300;
      let hands = [...historyHands];

      if (isDraggingHand && previewHand) {
        if (hands.length >= 2) hands[1] = previewHand;
        else hands.push(previewHand);
      }

      if (hands.length === 0) {
        if (stage === 2 || stage === 3) {
          ctx.save();
          ctx.fillStyle = '#4F7058';
          ctx.beginPath();
          ctx.arc(cx, cy, 3.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
        return;
      }

      if (hands.length === 1) {
        const h = hands[0];
        const hLen = h.length || 130;
        drawArrowLine(cx, cy, cx + hLen * Math.cos(h.angle), cy + hLen * Math.sin(h.angle), '#d32f2f', 8, 18);
      } else if (hands.length >= 2) {
        let shortHand = hands[0];
        let longHand = hands[1];
        if (hands[1].length < hands[0].length) {
          shortHand = hands[1];
          longHand = hands[0];
        }
        drawArrowLine(cx, cy, cx + shortHand.length * Math.cos(shortHand.angle), cy + shortHand.length * Math.sin(shortHand.angle), '#d32f2f', 8, 18);
        drawArrowLine(cx, cy, cx + longHand.length * Math.cos(longHand.angle), cy + longHand.length * Math.sin(longHand.angle), '#1976d2', 6, 18);
      }

      ctx.save();
      ctx.fillStyle = '#4F7058';
      ctx.beginPath();
      ctx.arc(cx, cy, 3.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawStrokeToContext(targetCtx, s) {
      if (!s || !s.points || !s.points.length) return;
      targetCtx.save();
      targetCtx.lineCap = 'round';
      targetCtx.lineJoin = 'round';

      if (s.tool === 'eraser') {
        targetCtx.lineWidth = 28;
        targetCtx.globalCompositeOperation = 'destination-out';
        targetCtx.strokeStyle = 'rgba(0,0,0,1)';
      } else {
        targetCtx.lineWidth = 5;
        targetCtx.globalCompositeOperation = 'source-over';
        targetCtx.strokeStyle = '#172f25';
      }

      // 以相鄰座標中點作為曲線終點，使用二次貝茲曲線平滑連接筆跡。
      // 原始 points 仍完整保留，撤銷、重畫及作答資料結構不變。
      const points = s.points;
      targetCtx.beginPath();
      targetCtx.moveTo(points[0].x, points[0].y);

      if (points.length === 1) {
        targetCtx.lineTo(points[0].x + 0.1, points[0].y + 0.1);
      } else if (points.length === 2) {
        targetCtx.lineTo(points[1].x, points[1].y);
      } else {
        for (let i = 1; i < points.length - 1; i++) {
          const midX = (points[i].x + points[i + 1].x) / 2;
          const midY = (points[i].y + points[i + 1].y) / 2;
          targetCtx.quadraticCurveTo(points[i].x, points[i].y, midX, midY);
        }
        const lastPoint = points[points.length - 1];
        targetCtx.lineTo(lastPoint.x, lastPoint.y);
      }

      targetCtx.stroke();
      targetCtx.restore();
    }

    function redraw() {
      ctx.clearRect(0, 0, 600, 600);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, 600, 600);
      drawTemplate();

      userCtx.clearRect(0, 0, 600, 600);

      const currentStageHistory = actionHistory[stage] || [];
      const handsToDraw = [];
      currentStageHistory.forEach(function(item) {
        if (item.type === 'stroke') drawStrokeToContext(userCtx, item.data);
        else if (item.type === 'hand') handsToDraw.push(item.data);
      });
      if (current && current.type === 'stroke') drawStrokeToContext(userCtx, current.data);

      // 重要：userCanvas 的 backing store 是 600×DPR，必須縮回 600×600 邏輯座標。
      // 若省略目的寬高，DPR=2 時筆跡會被放大並裁切，造成看似無法繪圖。
      ctx.drawImage(userCanvas, 0, 0, 600, 600);
      drawClockHands(handsToDraw);

      if (isDraggingHand) {
        ctx.save();
        ctx.fillStyle = 'rgba(120, 148, 125, 0.20)';
        ctx.strokeStyle = 'rgba(79, 112, 88, 0.55)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(300, 300, 40, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }

      if (drawing && current && current.data && current.data.tool === 'eraser' && activeInputPoint) {
        ctx.save();
        ctx.fillStyle = 'rgba(120, 148, 125, 0.12)';
        ctx.strokeStyle = 'rgba(79, 112, 88, 0.65)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(activeInputPoint.x, activeInputPoint.y, 28, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }
    }

    window.restartGame = function() {

      finished = false;
      targetTime = makeRandomTime();
      isDraggingHand = false;
      previewHand = null;

      setTool('pen');
      showDrawingView();
    };

    function goToStage(targetStage) {
      if (targetStage < stage) {
        showCustomModal(t('modal.step_current_title'), t('modal.step_current_desc'));
        return;
      }
      if (targetStage === stage) return;
      for (let i = 0; i < targetStage; i++) {
        if (!results[i]) {
          showCustomModal(t('modal.step_wait_title'), t('modal.step_wait_desc'));
          return;
        }
      }
      stage = targetStage;
      if (results[targetStage]) showStageSettlement(targetStage);
      else showDrawingView();
    }

    for (let i = 0; i < 4; i++) {
      const navEl = $('nav-' + i);
      if (navEl) navEl.addEventListener('click', (function(idx) {
        return function() { goToStage(idx); };
      })(i));
    }

    // 統一滑鼠、觸控與觸控筆的座標換算，確保不同螢幕尺寸下都能準確落筆。
    function point(e) {
      const r = canvas.getBoundingClientRect();
      let clientX = e.clientX;
      let clientY = e.clientY;

      if ((!Number.isFinite(clientX) || !Number.isFinite(clientY)) && e.touches && e.touches.length > 0) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
      } else if ((!Number.isFinite(clientX) || !Number.isFinite(clientY)) && e.changedTouches && e.changedTouches.length > 0) {
        clientX = e.changedTouches[0].clientX;
        clientY = e.changedTouches[0].clientY;
      }

      const scaleX = (r.width > 0) ? (600 / r.width) : 1;
      const scaleY = (r.height > 0) ? (600 / r.height) : 1;

      return {
        x: (clientX - r.left) * scaleX,
        y: (clientY - r.top) * scaleY
      };
    }

    let activePointerId = null;

    canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); e.stopPropagation(); });
    canvas.addEventListener('selectstart', function (e) { e.preventDefault(); });
    canvas.addEventListener('dragstart', function (e) { e.preventDefault(); });

    function handlePointerDown(e) {
      if (finished) return;
      if (e.isPrimary === false) return;
      // 觸控裝置統一交由 Touch Events 處理，避免部分 iOS / App 內建瀏覽器
      // 雖宣告支援 Pointer Events，實際觸控追蹤卻中斷的情況。
      if (e.pointerType === 'touch') return;
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      // 忽略第二根手指，避免同時觸控造成筆跡跳動或中斷。
      if (activePointerId !== null) return;

      if (e.preventDefault) e.preventDefault();
      if (e.stopPropagation) e.stopPropagation();
      activePointerId = (e.pointerId !== undefined && e.pointerId !== null) ? e.pointerId : 'touch-fallback';

      if (e.pointerId !== undefined && canvas.setPointerCapture) {
        try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
      }

      const pt = point(e);
      const cx = 300, cy = 300;
      const distFromCenter = Math.hypot(pt.x - cx, pt.y - cy);

      const isHandDragStart = (stage === 2 || stage === 3) && distFromCenter <= 40;
      activeInputPoint = pt;
      if (stage === 2 && !isHandDragStart) {
        if (e.pointerId !== undefined && canvas.releasePointerCapture) {
          try { if (canvas.hasPointerCapture && canvas.hasPointerCapture(e.pointerId)) canvas.releasePointerCapture(e.pointerId); } catch (_) {}
        }
        activePointerId = null;
        activeInputPoint = null;
        return;
      }

      if (isHandDragStart) {
        isDraggingHand = true;
        const angle = Math.atan2(pt.y - cy, pt.x - cx);
        const len = Math.max(distFromCenter, 40);
        previewHand = { angle: angle, length: len };
        redraw();
        return;
      }

      drawing = true;
      current = {
        type: 'stroke',
        data: { tool: (tool === 'eraser' ? 'eraser' : 'pen'), points: [pt] }
      };
      redraw();
    }

    function handlePointerMove(e) {
      if (e.pointerType === 'touch') return;
      if (e.isPrimary === false) return;
      if (activePointerId === null) return;
      if (e.pointerId !== undefined && e.pointerId !== activePointerId) return;
      if (!isDraggingHand && !drawing) return;

      if (e.preventDefault) e.preventDefault();
      if (e.stopPropagation) e.stopPropagation();

      if (isDraggingHand && previewHand) {
        const pt = point(e);
        activeInputPoint = pt;
        const cx = 300, cy = 300;
        const distFromCenter = Math.hypot(pt.x - cx, pt.y - cy);
        const angle = Math.atan2(pt.y - cy, pt.x - cx);
        const len = distFromCenter < 30 ? 130 : Math.min(Math.max(distFromCenter, 40), 220);
        previewHand.angle = angle;
        previewHand.length = len;
        redraw();
        return;
      }

      if (drawing && current && current.type === 'stroke') {
        let events = [e];
        if (e.getCoalescedEvents && typeof e.getCoalescedEvents === 'function') {
          try {
            const cEvents = e.getCoalescedEvents();
            if (cEvents && cEvents.length > 0) events = cEvents;
          } catch (_) {}
        }

        for (let i = 0; i < events.length; i++) {
          const eventPoint = point(events[i]);
          if (Number.isFinite(eventPoint.x) && Number.isFinite(eventPoint.y)) {
            current.data.points.push(eventPoint);
            activeInputPoint = eventPoint;
          }
        }
        redraw();
      }
    }

    function stopDraw(e) {
      if (e && e.pointerId !== undefined && activePointerId !== null && e.pointerId !== activePointerId) return;
      if (activePointerId === null && !drawing && !isDraggingHand) return;

      if (e && e.pointerId !== undefined && canvas.hasPointerCapture) {
        try {
          if (canvas.hasPointerCapture(e.pointerId)) canvas.releasePointerCapture(e.pointerId);
        } catch (_) {}
      }
      activePointerId = null;

      if (isDraggingHand) {
        if (previewHand) {
          const currentStageHistory = actionHistory[stage] || [];
          let handCount = 0;
          let lastHandIndex = -1;
          for (let i = 0; i < currentStageHistory.length; i++) {
            if (currentStageHistory[i].type === 'hand') {
              handCount++;
              lastHandIndex = i;
            }
          }
          if (handCount >= 2 && lastHandIndex !== -1) {
            currentStageHistory[lastHandIndex] = { type: 'hand', data: { angle: previewHand.angle, length: previewHand.length } };
          } else {
            currentStageHistory.push({ type: 'hand', data: { angle: previewHand.angle, length: previewHand.length } });
          }
        }
        isDraggingHand = false;
        previewHand = null;
        activeInputPoint = null;
        redraw();
        return;
      }

      if (!drawing) { activeInputPoint = null; redraw(); return; }
      drawing = false;
      if (current && current.type === 'stroke') {
        const pts = current.data && current.data.points;
        if (pts && pts.length > 1 && (stage === 0 || stage === 3)) {
          const first = pts[0];
          const last = pts[pts.length - 1];
          if (Math.hypot(last.x - first.x, last.y - first.y) <= 30) {
            pts.push({ x: first.x, y: first.y });
          }
        }
        if (pts && pts.length > 0) actionHistory[stage].push(current);
      }
      current = null;
      activeInputPoint = null;
      redraw();
    }

    // 在 document capture 階段接收畫布範圍內的起筆事件。
    // 若 iPad / 內嵌瀏覽器上方有透明覆蓋層攔截事件，直接綁在 canvas
    // 會導致畫布上半部無法起筆；capture 可在事件到達覆蓋層前先接收。
    function isInsideCanvasBounds(e) {
      const r = canvas.getBoundingClientRect();
      const x = e && Number.isFinite(e.clientX) ? e.clientX : null;
      const y = e && Number.isFinite(e.clientY) ? e.clientY : null;
      return x !== null && y !== null &&
        x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
    }

    document.addEventListener('pointerdown', function(e) {
      // 確認／提示視窗開啟時，按鈕可能覆蓋在畫布範圍上方。
      // document capture 會比按鈕先收到事件，因此必須先排除彈窗，
      // 避免 Apple Pencil 點擊「提交確認」被誤判成畫布起筆。
      if (document.getElementById('custom-modal-overlay')) return;
      if (!isInsideCanvasBounds(e)) return;
      handlePointerDown(e);
    }, { passive: false, capture: true });
    canvas.addEventListener('pointermove', handlePointerMove, { passive: false });
    canvas.addEventListener('pointerup', stopDraw);
    canvas.addEventListener('pointercancel', stopDraw);
    // 不使用 pointerleave 結束筆跡：手指靠近畫布邊緣時，瀏覽器仍可能送出 leave，
    // 會造成數字尚未寫完就被截斷。以 pointerup / pointercancel / lostpointercapture 結束即可。
    canvas.addEventListener('lostpointercapture', function(e) {
      if (activePointerId === e.pointerId) stopDraw(e);
    });
    window.addEventListener('pointerup', function(e) {
      if (activePointerId === e.pointerId) stopDraw(e);
    }, false);

    // 手指使用原生 Touch Events；滑鼠與觸控筆使用 Pointer Events。
    // 兩條輸入路徑分開處理，避免 iOS 將同一次手指操作同時派送成
    // pointer/touch 事件而互相搶占 activePointerId。
    let activeTouchIdentifier = null;

    function getTrackedTouch(list, identifier) {
      if (!list) return null;
      for (let i = 0; i < list.length; i++) {
        if (list[i].identifier === identifier) return list[i];
      }
      return null;
    }

    function startNativeTouch(touch) {
      if (finished || activePointerId !== null || activeTouchIdentifier !== null) return;
      activeTouchIdentifier = touch.identifier;
      const pt = point(touch);
      const cx = 300, cy = 300;
      const distFromCenter = Math.hypot(pt.x - cx, pt.y - cy);
      const isHandDragStart = (stage === 2 || stage === 3) && distFromCenter <= 40;
      activeInputPoint = pt;
      if (stage === 2 && !isHandDragStart) {
        activeTouchIdentifier = null;
        activeInputPoint = null;
        return;
      }

      if (isHandDragStart) {
        isDraggingHand = true;
        const angle = Math.atan2(pt.y - cy, pt.x - cx);
        const len = Math.max(distFromCenter, 40);
        previewHand = { angle: angle, length: len };
      } else {
        drawing = true;
        current = {
          type: 'stroke',
          data: { tool: (tool === 'eraser' ? 'eraser' : 'pen'), points: [pt] }
        };
      }
      redraw();
    }

    function moveNativeTouch(touch) {
      if (activeTouchIdentifier === null || !touch) return;
      const pt = point(touch);
      activeInputPoint = pt;

      if (isDraggingHand && previewHand) {
        const cx = 300, cy = 300;
        const distFromCenter = Math.hypot(pt.x - cx, pt.y - cy);
        previewHand.angle = Math.atan2(pt.y - cy, pt.x - cx);
        previewHand.length = distFromCenter < 30 ? 130 : Math.min(Math.max(distFromCenter, 40), 220);
        redraw();
        return;
      }

      if (drawing && current && current.type === 'stroke') {
        const pts = current.data.points;
        const last = pts[pts.length - 1];
        // 過近的連續觸控座標不重複加入，降低無效筆跡點，但保留細小移動。
        if (!last || Math.hypot(pt.x - last.x, pt.y - last.y) >= 0.6) {
          pts.push(pt);
          redraw();
        }
      }
    }

    function endNativeTouch() {
      if (activeTouchIdentifier === null) return;
      if (isDraggingHand) {
        if (previewHand) {
          const history = actionHistory[stage] || [];
          let count = 0, lastIndex = -1;
          for (let i = 0; i < history.length; i++) {
            if (history[i].type === 'hand') { count++; lastIndex = i; }
          }
          const handData = { angle: previewHand.angle, length: previewHand.length };
          if (count >= 2 && lastIndex !== -1) history[lastIndex] = { type: 'hand', data: handData };
          else history.push({ type: 'hand', data: handData });
        }
        isDraggingHand = false;
        previewHand = null;
      } else if (drawing) {
        drawing = false;
        if (current && current.type === 'stroke' && current.data.points.length) {
          const pts = current.data.points;
          if (pts.length > 1 && (stage === 0 || stage === 3)) {
            const first = pts[0];
            const last = pts[pts.length - 1];
            if (Math.hypot(last.x - first.x, last.y - first.y) <= 30) {
              pts.push({ x: first.x, y: first.y });
            }
          }
          actionHistory[stage].push(current);
        }
        current = null;
      }
      activeTouchIdentifier = null;
      activeInputPoint = null;
      redraw();
    }

    document.addEventListener('touchstart', function(e) {
      // 彈窗按鈕不屬於繪圖操作；不可讓按鈕觸控被轉成畫布筆跡。
      // 此判斷需放在 preventDefault() 之前，確保按鈕仍可正常觸發 click。
      if (document.getElementById('custom-modal-overlay')) return;
      if (!e.changedTouches || !e.changedTouches.length) return;
      const touch = e.changedTouches[0];
      // 只接收畫布可視範圍內的觸控，並在 capture 階段先處理，
      // 避免上方透明元素或 iOS 內嵌頁面攔截 11、12、1 點鐘位置的起筆。
      if (!isInsideCanvasBounds(touch)) return;
      if (e.cancelable) e.preventDefault();
      if (activeTouchIdentifier === null && activePointerId === null) {
        startNativeTouch(touch);
      }
    }, { passive: false, capture: true });

    window.addEventListener('touchmove', function(e) {
      if (activeTouchIdentifier === null) return;
      if (e.cancelable) e.preventDefault();
      const touch = getTrackedTouch(e.touches, activeTouchIdentifier) ||
                    getTrackedTouch(e.changedTouches, activeTouchIdentifier);
      if (touch) moveNativeTouch(touch);
    }, { passive: false, capture: true });

    function finishNativeTouch(e) {
      if (activeTouchIdentifier === null) return;
      const ended = getTrackedTouch(e.changedTouches, activeTouchIdentifier);
      if (!ended) return;
      if (e.cancelable) e.preventDefault();
      endNativeTouch();
    }
    window.addEventListener('touchend', finishNativeTouch, { passive: false, capture: true });
    window.addEventListener('touchcancel', finishNativeTouch, { passive: false, capture: true });

    // 僅在完全不支援 Pointer Events 的舊瀏覽器，補上滑鼠事件。
    if (typeof window.PointerEvent !== 'function') {
      canvas.addEventListener('mousedown', function(e) {
        handlePointerDown({
          pointerId: 'mouse-fallback', pointerType: 'mouse', button: e.button,
          clientX: e.clientX, clientY: e.clientY,
          preventDefault: function() { e.preventDefault(); },
          stopPropagation: function() { e.stopPropagation(); }
        });
      });
      window.addEventListener('mousemove', function(e) {
        if (activePointerId !== 'mouse-fallback') return;
        handlePointerMove({
          pointerId: 'mouse-fallback', clientX: e.clientX, clientY: e.clientY,
          preventDefault: function() { e.preventDefault(); },
          stopPropagation: function() { e.stopPropagation(); }
        });
      });
      window.addEventListener('mouseup', function() {
        if (activePointerId === 'mouse-fallback') stopDraw({ pointerId: 'mouse-fallback' });
      });
    }

    $('pen').addEventListener('click', function() { if (!finished) setTool('pen'); });
    $('eraser').addEventListener('click', function() { if (!finished) setTool('eraser'); });
    $('undo').addEventListener('click', function() {
      if (finished) return;
      if (drawing || isDraggingHand) stopDraw();
      isDraggingHand = false;
      previewHand = null;
      actionHistory[stage].pop();
      redraw();
    });

    $('clear').addEventListener('click', function() {
      if (finished) return;
      showConfirmModal(t('modal.restart_title'), t('modal.restart_desc'), function() {
        actionHistory[stage] = [];
        current = null;
        drawing = false;
        isDraggingHand = false;
        previewHand = null;
        redraw();
      });
    });

    $('intro-start-btn').addEventListener('click', startGame);
    $('drawing-back-btn').addEventListener('click', showIntroView);


    function getHandsFromHistory(stg) {
      const currentStageHistory = actionHistory[stg] || [];
      const hands = [];

      currentStageHistory.forEach(function(item) {
        if (item.type === 'hand' && item.data) {
          hands.push(item.data);
        }
      });

      if (hands.length === 0) {
        const cx = 300, cy = 300;
        currentStageHistory.forEach(function(item) {
          if (item.type === 'stroke' && item.data && item.data.points && item.data.points.length >= 2) {
            const pts = item.data.points;
            const startPt = pts[0];
            const endPt = pts[pts.length - 1];
            const startDist = Math.hypot(startPt.x - cx, startPt.y - cy);
            const endDist = Math.hypot(endPt.x - cx, endPt.y - cy);

            if (startDist <= 120 || endDist <= 120) {
              let outerPt = startDist > endDist ? startPt : endPt;
              const angle = Math.atan2(outerPt.y - cy, outerPt.x - cx);
              const len = Math.hypot(outerPt.x - cx, outerPt.y - cy);
              if (len >= 30) {
                hands.push({ angle: angle, length: len });
              }
            }
          }
        });
      }
      return hands;
    }

    function scoreCurrentStage() {
      if (drawing || isDraggingHand) stopDraw();

      const currentStageHistory = actionHistory[stage] || [];
      const strokeCount = currentStageHistory.filter(function(i) { return i.type === 'stroke'; }).length;
      const handCount = currentStageHistory.filter(function(i) { return i.type === 'hand'; }).length;

      if (stage === 2) {
        if (handCount === 0) {
          showCustomModal(t('modal.no_hand_title'), t('modal.no_hand_desc'));
          return;
        }
      } else if (stage === 3) {
        if (strokeCount === 0 && handCount === 0) {
          showCustomModal(t('modal.empty_draw_title'), t('modal.empty_draw_desc'));
          return;
        }
        if (handCount === 0 && getHandsFromHistory(stage).length === 0) {
          showCustomModal(t('modal.no_hand_title'), t('modal.no_hand_desc'));
          return;
        }
      } else {
        if (strokeCount === 0) {
          showCustomModal(t('modal.empty_draw_title'), t('modal.empty_draw_desc'));
          return;
        }
      }

      showSubmitConfirmModal(function() { executeSubmission(); });
    }

    function executeSubmission() {
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = 600;
      tempCanvas.height = 600;
      const tempCtx = tempCanvas.getContext('2d');
      tempCtx.fillStyle = '#ffffff';
      tempCtx.fillRect(0, 0, 600, 600);
      // 將高解析度主畫布完整縮放回評分使用的 600×600 圖片，避免只截取左上角。
      tempCtx.drawImage(canvas, 0, 0, 600, 600);

      const dataUrl = tempCanvas.toDataURL('image/png');
      const nextBtn = $('next');
      if (nextBtn.disabled) return;
      nextBtn.disabled = true;
      nextBtn.textContent = t('btn.scoring');

      const hands = getHandsFromHistory(stage);
      const handDataJson = JSON.stringify(hands);

      if (!(window.google && google.script && google.script.run)) {
        alert('目前不是從 Apps Script 網頁應用程式開啟，無法呼叫 AI 評分。');
        nextBtn.disabled = false;
        nextBtn.textContent = t('btn.submit');
        return;
      }

      google.script.run
        .withSuccessHandler(function(data) {
          nextBtn.disabled = false;
          nextBtn.textContent = t('btn.submit');
          results[stage] = data;
          const navEl = $('nav-' + stage);
          if (navEl) navEl.classList.add('completed');
          showStageSettlement(stage);
        })
        .withFailureHandler(function(err) {
          nextBtn.disabled = false;
          nextBtn.textContent = t('btn.submit');
          showCustomModal('評分發生錯誤', (err && err.message ? err.message : String(err)));
        })
        .scoreClock(dataUrl, stage + 1, targetTime, handDataJson, currentLang);
    }

    $('next').addEventListener('click', scoreCurrentStage);

    window.addEventListener('DOMContentLoaded', function() {
      initDisplaySettings();
      applyStaticI18n();
      showIntroView();
    });
  })();
</script>
</body>
</html>
