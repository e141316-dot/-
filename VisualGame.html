<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>視覺建構｜畫畫看連連看 - 認知訓練 App</title>
  <style>
    /* ==========================================
       1. 全域樣式與配色變數
       ========================================== */
    :root {
      --bg-page: #FCFBF7;         /* 頁面整體背景 */
      --primary-sage: #4F7058;    /* 主標題、主要按鈕、重點文字 */
      --text-main: #35473C;       /* 一般內文說明文字 */
      --bg-subtle: #EAF0E7;       /* 說明區塊、得分膠囊背景 */
      --border-radius: 16px;
      --font-family: system-ui, "Microsoft JhengHei", "PingFang TC", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-family) !important;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      margin: 0;
      padding: 0;
      background-color: var(--bg-page);
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding-bottom: 24px;
      overflow-x: hidden;
      overflow-y: auto;
    }

    header, main, .settlement-card, .modal-overlay {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    header {
      width: 100%;
      background-color: var(--bg-page);
      color: var(--primary-sage);
      padding: 24px 16px 0 16px;
      text-align: center;
      box-shadow: none;
      margin: 0;
    }

    header h1 {
      font-size: clamp(22px, 5.5vw, 32px);
      font-weight: 700;
      color: var(--primary-sage);
      margin-bottom: 24px;
      line-height: 1.25;
      text-align: center;
      width: 100%;
      word-break: break-word;
    }

    .nav-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      width: 92%;
      max-width: 800px;
      margin: 0 auto;
    }

    .nav-item {
      flex: 1 1 0px;
      height: 48px;
      background-color: var(--bg-subtle);
      color: var(--primary-sage);
      padding: 0 4px;
      border-radius: 30px;
      font-size: clamp(0.9rem, 3.2vw, 1.15rem);
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
      white-space: nowrap;
      border: none;
    }

    .nav-item.active {
      background-color: #FFFFFF;
      color: var(--primary-sage);
      border: 2px solid var(--primary-sage);
    }

    .nav-item.completed {
      border: 2px solid var(--primary-sage);
    }

    main {
      width: 92%;
      max-width: 800px;
      background: var(--bg-page);
      border-radius: var(--border-radius);
      box-shadow: none;
      margin: 20px auto 0 auto;
      padding: 0;
    }

    #intro-view {
      background-color: var(--bg-page);
    }

    .intro-back-wrap {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      width: 100%;
      margin-bottom: 14px;
      padding-top: 2px;
    }

    .btn-back-category {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: var(--bg-subtle);
      border: none;
      color: var(--primary-sage);
      font-size: 17px;
      font-weight: 500;
      text-decoration: none;
      min-height: 44px;
      padding: 0 18px;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: none;
      transition: background-color 0.2s ease, opacity 0.2s ease;
    }

    .btn-back-category:active {
      opacity: 0.8;
      background-color: #dce6d8;
    }

    .btn-back-category svg {
      width: 19px;
      height: 19px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .intro-header-title {
      color: var(--primary-sage);
      font-size: clamp(22px, 5.5vw, 32px);
      font-weight: 700;
      text-align: center;
      margin-bottom: 16px;
      word-break: break-word;
    }

    .intro-notice {
      background-color: var(--bg-subtle);
      border-radius: 12px;
      border: none;
      padding: 12px 16px;
      text-align: center;
      color: var(--text-main);
      font-size: 18px;
      font-weight: 400;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .intro-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 24px;
    }

    .intro-card {
      background: var(--bg-page);
      border-radius: 16px;
      border: 1.5px solid #EAF0E7;
      padding: 16px 20px;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 16px;
      box-shadow: none;
      height: auto;
    }

    .intro-svg-box {
      width: 90px;
      height: 90px;
      min-width: 90px;
      min-height: 90px;
      background-color: var(--bg-subtle);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border: none;
    }

    .intro-svg-box svg {
      width: 58px;
      height: 58px;
    }

    .intro-card-text {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .intro-card-title {
      font-size: 21px;
      font-weight: 700;
      color: var(--primary-sage);
      margin-bottom: 6px;
    }

    .intro-card-desc {
      font-size: 18px;
      font-weight: 400;
      line-height: 1.5;
      color: var(--text-main);
      word-break: break-word;
    }

    .intro-btn-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      margin-top: 8px;
    }

    .intro-start-btn {
      width: 100%;
      max-width: 360px;
      min-height: 52px;
      background-color: var(--primary-sage);
      color: #ffffff;
      font-size: 20px;
      font-weight: 700;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: background-color 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .intro-start-btn:active {
      background-color: #35473C;
    }

    .question-box {
      background-color: var(--bg-subtle);
      border-radius: 16px;
      border: none;
      padding: 22px 20px;
      margin-bottom: 24px;
      text-align: center;
    }

    .stage-box-title {
      font-size: 23px;
      font-weight: 700;
      color: var(--primary-sage);
      text-align: center;
      margin-bottom: 10px;
      line-height: 1.3;
    }

    .question-text {
      font-size: 21px;
      font-weight: 400;
      color: var(--text-main);
      text-align: center;
      line-height: 1.5;
    }

    .target-time-badge {
      display: inline-block;
      background-color: var(--primary-sage);
      color: #ffffff;
      font-size: 20px;
      font-weight: bold;
      padding: 6px 18px;
      border-radius: 20px;
      margin-top: 10px;
    }

    .tools {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
      margin-bottom: 26px;
    }

    .btn-tool {
      font-size: 18px;
      font-weight: bold;
      border: 1.5px solid var(--primary-sage);
      border-radius: 25px;
      padding: 8px 18px;
      min-height: 44px;
      background: #ffffff;
      color: var(--primary-sage);
      cursor: pointer;
    }

    .btn-tool.selected {
      background: var(--primary-sage);
      color: #ffffff;
    }

    .canvas-wrap {
      width: 520px;
      height: 520px;
      aspect-ratio: 1 / 1;
      max-width: 100%;
      margin: 0 auto;
      border: 3px solid var(--primary-sage);
      border-radius: 16px;
      overflow: hidden;
      background: #ffffff;
      touch-action: none !important;
      overscroll-behavior: none !important;
      -webkit-user-select: none !important;
      -moz-user-select: none !important;
      -ms-user-select: none !important;
      user-select: none !important;
      -webkit-touch-callout: none !important;
      -webkit-tap-highlight-color: transparent !important;
    }

    canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
      touch-action: none !important;
      overscroll-behavior: none !important;
      -webkit-user-select: none !important;
      -moz-user-select: none !important;
      -ms-user-select: none !important;
      user-select: none !important;
      -webkit-touch-callout: none !important;
      -webkit-tap-highlight-color: transparent !important;
    }

    .status-text {
      text-align: center;
      font-size: 1rem;
      font-weight: bold;
      color: var(--text-main);
      margin-top: 12px;
      min-height: 24px;
    }

    .action-bar {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 16px;
    }

    .btn-submit {
      width: 100%;
      max-width: 420px;
      height: 52px;
      background-color: var(--primary-sage);
      color: #ffffff;
      font-size: 20px;
      font-weight: 800;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .disclaimer-box {
      margin-top: 18px;
      padding: 12px 16px;
      background-color: var(--bg-subtle);
      color: var(--text-main);
      border-radius: 12px;
      font-size: 17px;
      font-weight: 500;
      text-align: center;
      line-height: 1.5;
      word-break: break-word;
    }

    .settlement-card {
      position: relative;
      background: var(--bg-page);
      border: none;
      border-radius: 20px;
      padding: 24px 16px;
      margin-bottom: 12px;
      text-align: center;
      overflow: hidden;
    }
    .settlement-card > *:not(.confetti-container):not(.clapping-popup-overlay) {
      position: relative;
      z-index: 2;
    }

    .settlement-title {
      color: var(--primary-sage);
      font-size: clamp(1.3rem, 4.2vw, 1.75rem);
      font-weight: 800;
      margin: 0 auto 12px auto;
      text-align: center;
      width: 100%;
      box-sizing: border-box;
      padding: 0 8px;
      word-break: break-word;
    }

    .trophy-star-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      margin: 6px 0 10px 0;
    }

    .trophy-icon {
      font-size: clamp(2.8rem, 8vw, 3.8rem);
      line-height: 1;
      display: inline-block;
      filter: drop-shadow(0 4px 10px rgba(255, 193, 7, 0.5));
      animation: trophyGlow 2.5s ease-in-out infinite alternate;
    }
    @keyframes trophyGlow {
      0% { transform: scale(1); }
      100% { transform: scale(1.06); }
    }

    .four-point-star-svg {
      width: clamp(28px, 6vw, 38px);
      height: clamp(28px, 6vw, 38px);
      display: inline-block;
      animation: starPulse 2.2s ease-in-out infinite alternate;
    }
    .four-point-star-svg.star-right {
      animation-delay: 0.8s;
    }
    @keyframes starPulse {
      0% { transform: scale(0.92) rotate(-6deg); opacity: 0.82; }
      100% { transform: scale(1.12) rotate(6deg); opacity: 1; }
    }

    .settlement-stars {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      margin: 10px 0 16px 0;
    }

    .star-wrapper {
      position: relative;
      display: inline-flex;
      justify-content: center;
      align-items: center;
    }

    .five-point-star-icon {
      width: clamp(38px, 8vw, 48px);
      height: clamp(38px, 8vw, 48px);
      fill: #FFB300;
      display: inline-block;
      opacity: 0;
      transform-origin: center center;
      filter: drop-shadow(0 2px 6px rgba(255, 179, 0, 0.45));
      animation: starPopIn 0.55s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards,
                 starGlowPulse 2.2s ease-in-out infinite 0.6s;
    }

    .star-wrapper.star-1 .five-point-star-icon { animation-delay: 0.15s, 0.7s; }
    .star-wrapper.star-2 .five-point-star-icon { animation-delay: 0.35s, 0.9s; }
    .star-wrapper.star-3 .five-point-star-icon { animation-delay: 0.55s, 1.1s; }

    @keyframes starPopIn {
      0% {
        opacity: 0;
        transform: scale(0) rotate(-25deg);
      }
      70% {
        opacity: 1;
        transform: scale(1.25) rotate(8deg);
      }
      100% {
        opacity: 1;
        transform: scale(0deg);
      }
    }

    @keyframes starGlowPulse {
      0%, 100% {
        filter: drop-shadow(0 2px 6px rgba(255, 179, 0, 0.5));
      }
      50% {
        filter: drop-shadow(0 0 12px rgba(255, 215, 0, 0.95)) drop-shadow(0 0 20px rgba(255, 193, 7, 0.7));
      }
    }

    .sparkle-icon {
      position: absolute;
      pointer-events: none;
      opacity: 0;
      transform-origin: center center;
      animation: sparkleFlash 1.6s ease-in-out forwards;
    }

    .sparkle-top {
      top: -8px;
      right: -8px;
      width: 16px;
      height: 16px;
    }

    .sparkle-bottom {
      bottom: -6px;
      left: -6px;
      width: 12px;
      height: 12px;
    }

    .star-wrapper.star-1 .sparkle-top { animation-delay: 0.5s; }
    .star-wrapper.star-1 .sparkle-bottom { animation-delay: 0.65s; }
    .star-wrapper.star-2 .sparkle-top { animation-delay: 0.7s; }
    .star-wrapper.star-2 .sparkle-bottom { animation-delay: 0.85s; }
    .star-wrapper.star-3 .sparkle-top { animation-delay: 0.9s; }
    .star-wrapper.star-3 .sparkle-bottom { animation-delay: 1.05s; }

    @keyframes sparkleFlash {
      0% {
        opacity: 0;
        transform: scale(0) rotate(0deg);
      }
      40% {
        opacity: 1;
        transform: scale(1.4) rotate(45deg);
      }
      70% {
        opacity: 0.85;
        transform: scale(1) rotate(90deg);
      }
      100% {
        opacity: 0;
        transform: scale(0) rotate(135deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .five-point-star-icon {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
        filter: drop-shadow(0 2px 6px rgba(255, 179, 0, 0.5));
      }
      .sparkle-icon {
        display: none !important;
      }
      .trophy-icon, .four-point-star-svg, .confetti-piece, .clapping-popup-overlay {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
      }
    }

    .settlement-score-pill {
      background-color: var(--bg-subtle);
      border: 1.5px solid var(--bg-subtle);
      color: var(--text-main);
      padding: 8px 24px;
      border-radius: 30px;
      display: inline-block;
      font-size: clamp(1.05rem, 3.5vw, 1.25rem);
      font-weight: bold;
      margin: 4px 0 0 0;
    }

    .settlement-encouragement-text {
      color: var(--primary-sage);
      font-size: 19px;
      font-weight: 700;
      line-height: 1.5;
      text-align: center;
      margin-top: 14px;
      margin-bottom: 18px;
      background: none !important;
      border: none !important;
      padding: 0 !important;
      box-shadow: none !important;
    }

    .stage-detail-card {
      background-color: var(--bg-page);
      border: 1.5px solid var(--bg-subtle);
      border-radius: 14px;
      padding: 16px 18px;
      text-align: left;
      margin-bottom: 16px;
    }

    .stage-detail-p {
      font-size: 1.05rem;
      line-height: 1.55;
      margin-top: 0;
      color: var(--text-main);
    }

    .stage-detail-p + .stage-detail-p {
      margin-top: 10px;
    }

    .summary-breakdown-box {
      background-color: var(--bg-subtle);
      border-radius: 14px;
      padding: 12px 18px;
      margin-bottom: 16px;
      text-align: left;
    }
    .summary-breakdown-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: clamp(0.98rem, 3.2vw, 1.12rem);
      font-weight: bold;
      color: var(--text-main);
      padding: 8px 0;
      border-bottom: 1px dashed #c8d6c9;
    }
    .summary-breakdown-row:last-child {
      border-bottom: none;
    }
    .summary-breakdown-score {
      color: var(--primary-sage);
      font-weight: 800;
    }

    .btn-clap-sound {
      background-color: #ffffff;
      border: 2px solid var(--primary-sage);
      color: var(--primary-sage);
      padding: 8px 22px;
      border-radius: 25px;
      font-size: clamp(0.95rem, 3vw, 1.05rem);
      font-weight: bold;
      cursor: pointer;
      margin: 8px 0 14px 0;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .settlement-nav-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      margin-top: 14px;
      width: 100%;
      max-width: 420px;
      margin-left: auto;
      margin-right: auto;
    }

    .btn-settlement-nav {
      flex: 1;
      min-height: 48px;
      background-color: var(--bg-subtle);
      color: var(--primary-sage);
      border: none;
      border-radius: 30px;
      font-size: 17px;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: none;
      transition: background-color 0.2s ease, opacity 0.2s ease;
    }

    .btn-settlement-nav:active {
      opacity: 0.8;
      background-color: #dce6d8;
    }

    .btn-settlement-nav svg {
      width: 19px;
      height: 19px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    @media (max-width: 480px) {
      .settlement-nav-wrap {
        flex-direction: column;
        gap: 10px;
      }
      .btn-settlement-nav {
        width: 100%;
      }
    }

    .clapping-popup-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: clamp(4rem, 15vw, 6rem);
      z-index: 10;
      pointer-events: none;
      animation: clapPopFade 1.8s ease-out forwards;
    }
    @keyframes clapPopFade {
      0% { transform: translate(-50%, -50%) scale(0.3); opacity: 0; }
      30% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
      70% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      100% { transform: translate(-50%, -60%) scale(0.9); opacity: 0; }
    }

    .confetti-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
    }
    .confetti-piece {
      position: absolute;
      top: -20px;
      opacity: 0;
      animation: confettiFall 2.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) infinite;
    }
    @keyframes confettiFall {
      0% { transform: translateY(0) rotate(0deg) scaleX(1); opacity: 0.95; }
      75% { opacity: 0.85; }
      100% { transform: translateY(420px) rotate(720deg) scaleX(0.5); opacity: 0; }
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.45);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 20px;
      z-index: 9999;
    }
    .modal-card {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10000;
      background-color: #ffffff;
      border: 2px solid var(--primary-sage);
      border-radius: 20px;
      padding: 20px 18px 18px 18px;
      max-width: 420px;
      width: calc(100% - 32px);
      text-align: center;
    }
    .modal-title {
      color: var(--primary-sage);
      font-size: clamp(1.25rem, 3.8vw, 1.5rem);
      font-weight: 800;
      margin-bottom: 8px;
    }
    .modal-content {
      color: var(--text-main);
      font-size: clamp(1rem, 3.4vw, 1.15rem);
      line-height: 1.5;
      margin-bottom: 18px;
    }
    .btn-modal-close {
      background-color: var(--primary-sage);
      color: #ffffff;
      border: none;
      padding: 10px 32px;
      font-size: clamp(1rem, 3.4vw, 1.15rem);
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
    }
    .btn-modal-cancel {
      background-color: #ffffff;
      color: var(--text-main);
      border: 1.5px solid #b0bec5;
      padding: 10px 24px;
      font-size: clamp(0.95rem, 3.2vw, 1.1rem);
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
    }
    .btn-modal-confirm {
      background-color: #d32f2f;
      color: #ffffff;
      border: none;
      padding: 10px 24px;
      font-size: clamp(0.95rem, 3.2vw, 1.1rem);
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
    }
    .btn-modal-submit-primary {
      background-color: var(--primary-sage);
      color: #ffffff;
      border: none;
      padding: 10px 24px;
      font-size: clamp(0.95rem, 3.2vw, 1.1rem);
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
    }

    @media (max-width: 600px) {
      .intro-notice { font-size: 17px; padding: 10px 14px; }

<script>
(function () {

  let stage = 0;
  let tool = 'pen';

  let actionHistory = [[], [], [], []];

  const FOUR_POINT_STAR_SVG = `

  function showCustomModal(title, content) {
    let existing = $('custom-modal-overlay');

  function showConfirmModal(title, content, onConfirm) {
    let existing = $('custom-modal-overlay');
    if (existing) existing.remove();
    const overlay = document.createElement('div');
    overlay.id = 'custom-modal-overlay';

    $('modal-btn-cancel').onclick = closeCustomModal;
    $('modal-btn-confirm').onclick = function() {

  function showSubmitConfirmModal(onConfirm) {

    if (existing) existing.remove();

    overlay.id = 'custom-modal-overlay';
    overlay.className = 'modal-overlay';

        <div style="display: flex; justify-content: center; gap: 14px; margin-top: 14px;">

          <button class="btn-modal-submit-primary" id="modal-btn-submit-confirm">確定提交</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    $('modal-btn-check-again').onclick = closeCustomModal;
    $('modal-btn-submit-confirm').onclick = function() {
      closeCustomModal();
      if (typeof onConfirm === 'function') onConfirm();
    };
  }

  window.closeCustomModal = function() {
    const overlay = $('custom-modal-overlay');
    if (overlay) overlay.remove();
  };

  let cheerAudioInstance = null;
  const CHEER_SOURCES = [
    "https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3",
    "https://cdn.freesound.org/previews/391/391539_5121236-lq.mp3"
  ];

  window.playCheerSound = function() {
    let currentTotal = 0;
    results.forEach(res => {
      if (res) currentTotal += (Number(res.stageScore) || 0);
    });

    if (currentTotal < 80) return;

    try {
      if (!cheerAudioInstance) {
        cheerAudioInstance = new Audio();
        cheerAudioInstance.crossOrigin = "anonymous";
        cheerAudioInstance.src = CHEER_SOURCES[0];
      }
      cheerAudioInstance.pause();
      cheerAudioInstance.currentTime = 0;
      cheerAudioInstance.play().catch(() => {
        cheerAudioInstance.src = CHEER_SOURCES[1];
        cheerAudioInstance.play().catch(e => console.log("Audio play error:", e));
      });
    } catch (e) {
      console.log("Audio play error:", e);
    }
  };

  function makeRandomTime() {
    const hour = Math.floor(Math.random() * 12) + 1;
    const minute = Math.floor(Math.random() * 12) * 5;
    return String(hour).padStart(2, '0') + ':' + String(minute).padStart(2, '0');
  }

  function setTool(t) {
    tool = t;
    $('pen').classList.toggle('selected', tool === 'pen');
    $('eraser').classList.toggle('selected', tool === 'eraser');
  }

  function drawArrowLine(x1, y1, x2, y2, color, lineWidth, headLen) {
    const angle = Math.atan2(y2 - y1, x2 - x1);
    ctx.save();
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = lineWidth;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(x2, y2);
    ctx.lineTo(x2 - headLen * Math.cos(angle - Math.PI / 6), y2 - headLen * Math.sin(angle - Math.PI / 6));
    ctx.lineTo(x2 - headLen * Math.cos(angle + Math.PI / 6), y2 - headLen * Math.sin(angle + Math.PI / 6));
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawTemplate() {
    if (stage === 1 || stage === 2) { 
      ctx.save();
      ctx.strokeStyle = '#b9c7bd';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(300, 300, 220, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    if (stage === 2) {
      ctx.save();
      ctx.fillStyle = '#87958b';
      ctx.font = 'bold 31px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      for (let n = 1; n <= 12; n++) {
        const a = n * Math.PI / 6 - Math.PI / 2;
        ctx.fillText(String(n), 300 + 177 * Math.cos(a), 300 + 177 * Math.sin(a));
      }
      ctx.restore();
    }
  }

  function drawClockHands(historyHands) {
    if (stage !== 2 && stage !== 3) return;
    const cx = 300, cy = 300;
    let hands = [...historyHands];

    if (isDraggingHand && previewHand) {
      if (hands.length >= 2) hands[1] = previewHand;
      else hands.push(previewHand);
    }

    if (hands.length === 0) {
      if (stage === 2 || stage === 3) {
        ctx.save();
        ctx.fillStyle = '#4F7058';
        ctx.beginPath();
        ctx.arc(cx, cy, 3.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      return;
    }

    if (hands.length === 1) {
      const h = hands[0];
      const hLen = h.length || 130;
      drawArrowLine(cx, cy, cx + hLen * Math.cos(h.angle), cy + hLen * Math.sin(h.angle), '#d32f2f', 8, 18);
    } else if (hands.length >= 2) {
      let shortHand = hands[0];
      let longHand = hands[1];
      if (hands[1].length < hands[0].length) {
        shortHand = hands[1];
        longHand = hands[0];
      }
      drawArrowLine(cx, cy, cx + shortHand.length * Math.cos(shortHand.angle), cy + shortHand.length * Math.sin(shortHand.angle), '#d32f2f', 8, 18);
      drawArrowLine(cx, cy, cx + longHand.length * Math.cos(longHand.angle), cy + longHand.length * Math.sin(longHand.angle), '#1976d2', 6, 18);
    }

    ctx.save();
    ctx.fillStyle = '#4F7058';
    ctx.beginPath();
    ctx.arc(cx, cy, 3.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawStrokeToContext(targetCtx, s) {
    if (!s || !s.points || !s.points.length) return;
    targetCtx.save();
    targetCtx.lineCap = 'round';
    targetCtx.lineJoin = 'round';

    if (s.tool === 'eraser') {
      targetCtx.lineWidth = 28;
      targetCtx.globalCompositeOperation = 'destination-out';
      targetCtx.strokeStyle = 'rgba(0,0,0,1)';
    } else {
      targetCtx.lineWidth = 7;
      targetCtx.globalCompositeOperation = 'source-over';
      targetCtx.strokeStyle = '#172f25';
    }

    targetCtx.beginPath();
    targetCtx.moveTo(s.points[0].x, s.points[0].y);
    if (s.points.length === 1) {
      targetCtx.lineTo(s.points[0].x + 0.1, s.points[0].y + 0.1);
    } else {
      for (let i = 1; i < s.points.length; i++) targetCtx.lineTo(s.points[i].x, s.points[i].y);
    }
    targetCtx.stroke();
    targetCtx.restore();
  }

  function redraw() {
    ctx.clearRect(0, 0, 600, 600);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, 600, 600);
    drawTemplate();

    userCtx.clearRect(0, 0, 600, 600);

    const currentStageHistory = actionHistory[stage] || [];
    const handsToDraw = [];
    currentStageHistory.forEach(item => {
      if (item.type === 'stroke') drawStrokeToContext(userCtx, item.data);
      else if (item.type === 'hand') handsToDraw.push(item.data);
    });
    if (current && current.type === 'stroke') drawStrokeToContext(userCtx, current.data);

    ctx.drawImage(userCanvas, 0, 0);
    drawClockHands(handsToDraw);
  }

  function showIntroView() {
    $('header-nav').classList.add('hidden');
    $('drawing-view').classList.add('hidden');
    $('stage-settlement-view').classList.add('hidden');
    $('total-settlement-view').classList.add('hidden');
    $('disclaimer-box').classList.add('hidden');
    $('intro-view').classList.remove('hidden');

  function startGame() {
    $('intro-view').classList.add('hidden');
    $('header-nav').classList.remove('hidden');
    showDrawingView();
  }

  function showDrawingView() {
    $('stage-settlement-view').classList.add('hidden');
    $('total-settlement-view').classList.add('hidden');
    $('intro-view').classList.add('hidden');
    $('header-nav').classList.remove('hidden');
    $('disclaimer-box').classList.add('hidden');
    $('drawing-view').classList.remove('hidden');
    render();
  }

  function render() {
    $('title').textContent = titles[stage];
    $('instruction').textContent = instructions[stage];
    $('target').textContent = '目標時間：' + targetTime;
    $('target').classList.toggle('hidden', stage !== 2 && stage !== 3);
    $('next').textContent = '完成作答';
    $('status').textContent = '請完成本關，再按「完成作答」查看本關分數。';

    $('draw-tools').classList.remove('hidden');
    setTool(tool);
    
    for (let i = 0; i < 4; i++) {
      const el = $('nav-' + i);
      if (el) {
        el.classList.toggle('active', i === stage);
        el.classList.toggle('completed', results[i] !== null && i !== stage);
      }
    }
    redraw();
  }

  function showStageSettlement(stg) {
    const data = results[stg];
    if (!data) return;

    const cat = categories[stg];
    const item = data[cat.key] || {};
    const score = Number(item.score) || 0;

    const starCount = (stg === 0) ? 1 : (stg === 1) ? 2 : 3;
    const starsHTML = renderFivePointStars(starCount);

    const encouragementText = getStageEncouragement(stg, score, item);

    const nextBtnText = stg === 3 ? '完成遊戲，查看總成績' : `前往第${['二','三','四'][stg]}階段`;
    const nextAction = stg === 3 ? 'window.showTotalSettlement()' : 'window.goToNextStage()';

    const view = $('stage-settlement-view');
    view.innerHTML = `
      <div class="settlement-card">
        <h2 class="settlement-title">${cat.title}</h2>
        ${starsHTML}

        <div class="settlement-score-pill">本階段得分：<strong>${score}</strong> / 25 分</div>
        
        <div class="settlement-encouragement-text">${encouragementText}</div>

        <div class="stage-detail-card">
          <p class="stage-detail-p"><strong>評分理由：</strong>${item.reason || '表現良好，已完成本階段作答。'}</p>
          ${item.advice ? `<p class="stage-detail-p"><strong>練習建議：</strong>${item.advice}</p>` : ''}
        </div>

        <div class="action-bar" style="margin-top: 14px;">
          <button type="button" class="btn-submit" onclick="${nextAction}">${nextBtnText}</button>
        </div>
      </div>
    `;

    $('drawing-view').classList.add('hidden');
    $('total-settlement-view').classList.add('hidden');
    $('disclaimer-box').classList.remove('hidden');
    view.classList.remove('hidden');

    for (let i = 0; i < 4; i++) {
      const el = $('nav-' + i);
      if (el) {
        el.classList.toggle('active', i === stg);
        el.classList.toggle('completed', results[i] !== null);
      }
    }
  }

  window.goToNextStage = function() {
    if (stage < 3) {
      stage++;
      showDrawingView();
    }
  };

  window.showTotalSettlement = function() {
    let total = 0;
    results.forEach(res => {
      if (res) total += (Number(res.stageScore) || 0);
    });

    const canPlayApplause = (total >= 80);

    if (canPlayApplause) {
      playCheerSound();
    }

    let titleText = "太棒了！完成所有挑戰！";
    let showTrophy = false;
    let show4PointStars = false;
    let showConfetti = true; 
    let encouragementText = "做得好！再接再厲，持續練習會越來越順手喔！";

    if (total >= 100) {
      titleText = "太棒了！三關滿分！";
      showTrophy = true;
      show4PointStars = true;
      encouragementText = "太了不起了！四個項目皆獲得滿分，表現完美！";
    } else if (total >= 80) {
      titleText = "視覺建構｜畫畫看連連看，表現優異！";
      showTrophy = true;
      show4PointStars = true;
      encouragementText = "太棒了！表現非常優異，繼續保持這份專注力！";
    } else {
      titleText = "太棒了！完成所有挑戰！";
      showTrophy = false;
      show4PointStars = false;
      encouragementText = "做得好！再接再厲，持續練習會越來越順手喔！";
    }

    let confettiHTML = '';
    if (showConfetti) {
      const confettiColors = ['#ff7043', '#4caf50', '#42a5f5', '#fbc02d', '#ab47bc', '#26a69a', '#ff4081', '#ffb300'];
      for (let i = 0; i < 22; i++) {
        const left = Math.floor((i / 22) * 92 + 4);
        const color = confettiColors[i % confettiColors.length];
        const delay = (Math.random() * 2.2).toFixed(2);
        const duration = (2.4 + Math.random() * 1.2).toFixed(2);
        confettiHTML += `<span class="confetti-piece" style="left:${left}%; background:${color}; width:8px; height:12px; border-radius:2px; animation-delay:${delay}s; animation-duration:${duration}s;"></span>`;
      }
    }

    let trophyStarHTML = '';
    if (showTrophy) {
      trophyStarHTML = `
        <div class="trophy-star-wrap">
          ${show4PointStars ? FOUR_POINT_STAR_SVG.replace('class="four-point-star-svg"', 'class="four-point-star-svg star-left"') : ''}
          <span class="trophy-icon">🏆</span>
          ${show4PointStars ? FOUR_POINT_STAR_SVG.replace('class="four-point-star-svg"', 'class="four-point-star-svg star-right"') : ''}
        </div>
      `;
    }

    let clapPopupHTML = canPlayApplause ? '<div class="clapping-popup-overlay">👏</div>' : '';
    let clapButtonHTML = canPlayApplause ? `
      <div>
        <button class="btn-clap-sound" onclick="playCheerSound()">🎉 重新播放鼓掌聲</button>
      </div>
    ` : '';

    const view = $('total-settlement-view');
    view.innerHTML = `
      <div class="settlement-card">
        ${confettiHTML ? `<div class="confetti-container">${confettiHTML}</div>` : ''}
        ${clapPopupHTML}
        
        <h2 class="settlement-title">${titleText}</h2>
        ${trophyStarHTML}
        ${renderFivePointStars(3)}
        
        <div class="settlement-score-pill">總成績分數：<strong>${total}</strong> / 100 分</div>
        
        <div class="settlement-encouragement-text">
          ${encouragementText}
        </div>

        <div class="summary-breakdown-box">
          <div class="summary-breakdown-row">
            <span>第一階段（畫圓圈）：</span>
            <span class="summary-breakdown-score">${results[0] ? results[0].stageScore : 0} / 25 分</span>
          </div>
          <div class="summary-breakdown-row">
            <span>第二階段（寫數字）：</span>
            <span class="summary-breakdown-score">${results[1] ? results[1].stageScore : 0} / 25 分</span>
          </div>
          <div class="summary-breakdown-row">
            <span>第三階段（畫指針）：</span>
            <span class="summary-breakdown-score">${results[2] ? results[2].stageScore : 0} / 25 分</span>
          </div>
          <div class="summary-breakdown-row">
            <span>第四階段（綜合評分）：</span>
            <span class="summary-breakdown-score">${results[3] ? results[3].stageScore : 0} / 25 分</span>
          </div>
        </div>

        ${clapButtonHTML}

        <div class="action-bar" style="margin-top: 14px;">
          <button type="button" class="btn-submit" onclick="window.restartGame()">再玩一次</button>
        </div>

        <div class="settlement-nav-wrap">
          <button type="button" onclick="goToHome()" class="btn-settlement-nav">
            <svg viewBox="0 0 24 24">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
              <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            <span>回首頁</span>
          </button>
          <button type="button" onclick="goToLevelSelect()" class="btn-settlement-nav">
            <svg viewBox="0 0 24 24">
              <line x1="19" y1="12" x2="5" y2="12"></line>
              <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            <span>回遊戲分類</span>
          </button>
        </div>
      </div>
    `;

    $('intro-view').classList.add('hidden');
    $('drawing-view').classList.add('hidden');
    $('stage-settlement-view').classList.add('hidden');
    $('header-nav').classList.remove('hidden');
    $('disclaimer-box').classList.remove('hidden');
    view.classList.remove('hidden');
    finished = true;
  };

  window.restartGame = function() {
    stage = 0;
    tool = 'pen';
    drawing = false;
    current = null;
    actionHistory = [[], [], [], []];
    results = [null, null, null, null];
    finished = false;
    targetTime = makeRandomTime();
    isDraggingHand = false;
    previewHand = null;

    setTool('pen');
    showDrawingView();
  };

  function goToStage(targetStage) {
    if (targetStage < stage) {
      showCustomModal('先完成當前關卡喔！', '您已經完成之前的關卡，請繼續往前挑戰喔！');
      return;
    }
    if (targetStage === stage) return;
    for (let i = 0; i < targetStage; i++) {
      if (!results[i]) {
        showCustomModal('一步一步來！', '請先完成上一關，再繼續挑戰喔！');
        return;
      }
    }
    stage = targetStage;
    if (results[targetStage]) showStageSettlement(targetStage);
    else showDrawingView();
  }

  for (let i = 0; i < 4; i++) {
    const navEl = $('nav-' + i);
    if (navEl) navEl.addEventListener('click', () => goToStage(i));
  }

  function point(e) {
    const r = canvas.getBoundingClientRect();
    let clientX = e.clientX;
    let clientY = e.clientY;

    if ((clientX === undefined || clientY === undefined) && e.touches && e.touches.length > 0) {
      clientX = e.touches[0].clientX;
      clientY = e.touches[0].clientY;
    } else if ((clientX === undefined || clientY === undefined) && e.changedTouches && e.changedTouches.length > 0) {
      clientX = e.changedTouches[0].clientX;
      clientY = e.changedTouches[0].clientY;
    }

    const scaleX = (r.width > 0) ? (canvas.width / r.width) : 1;
    const scaleY = (r.height > 0) ? (canvas.height / r.height) : 1;

    return { 
      x: (clientX - r.left) * scaleX, 
      y: (clientY - r.top) * scaleY 
    };
  }

  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); e.stopPropagation(); });
  canvas.addEventListener('selectstart', function (e) { e.preventDefault(); });
  canvas.addEventListener('dragstart', function (e) { e.preventDefault(); });

  canvas.addEventListener('pointerdown', function (e) {
    if (finished) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;

    e.preventDefault();
    e.stopPropagation();

    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}

    const pt = point(e);
    const cx = 300, cy = 300;
    const distFromCenter = Math.hypot(pt.x - cx, pt.y - cy);

    const isHandDragStart = (stage === 2) || (stage === 3 && distFromCenter <= 100);

    if (isHandDragStart) {
      isDraggingHand = true;
      const angle = Math.atan2(pt.y - cy, pt.x - cx);
      const len = distFromCenter < 30 ? 130 : Math.min(Math.max(distFromCenter, 40), 220);

      previewHand = { angle: angle, length: len };
      redraw();
      return;
    }

    drawing = true;
    current = {
      type: 'stroke',
      data: { tool: (tool === 'eraser' ? 'eraser' : 'pen'), points: [pt] }
    };
    redraw();
  }, { passive: false });

  canvas.addEventListener('pointermove', function (e) {
    if (!isDraggingHand && !drawing) return;

    e.preventDefault();
    e.stopPropagation();

    if (isDraggingHand && previewHand) {
      const pt = point(e);
      const cx = 300, cy = 300;
      const distFromCenter = Math.hypot(pt.x - cx, pt.y - cy);
      const angle = Math.atan2(pt.y - cy, pt.x - cx);
      const len = distFromCenter < 30 ? 130 : Math.min(Math.max(distFromCenter, 40), 220);
      previewHand.angle = angle;
      previewHand.length = len;
      redraw();
      return;
    }

    if (drawing && current && current.type === 'stroke') {
      let events = [e];
      if (e.getCoalescedEvents && typeof e.getCoalescedEvents === 'function') {
        try {
          const cEvents = e.getCoalescedEvents();
          if (cEvents && cEvents.length > 0) {
            events = cEvents;
          }
        } catch (_) {}
      }

      for (let i = 0; i < events.length; i++) {
        current.data.points.push(point(events[i]));
      }
      redraw();
    }
  }, { passive: false });

  function stopDraw(e) {
    if (e && e.pointerId) {
      try {
        if (canvas.hasPointerCapture && canvas.hasPointerCapture(e.pointerId)) {
          canvas.releasePointerCapture(e.pointerId);
        }
      } catch (_) {}
    }

    if (isDraggingHand) {
      if (previewHand) {
        const currentStageHistory = actionHistory[stage] || [];
        let handCount = 0;
        let lastHandIndex = -1;
        for (let i = 0; i < currentStageHistory.length; i++) {
          if (currentStageHistory[i].type === 'hand') {
            handCount++;
            lastHandIndex = i;
          }
        }
        if (handCount >= 2 && lastHandIndex !== -1) {
          currentStageHistory[lastHandIndex] = { type: 'hand', data: { angle: previewHand.angle, length: previewHand.length } };
        } else {
          currentStageHistory.push({ type: 'hand', data: { angle: previewHand.angle, length: previewHand.length } });
        }
      }
      isDraggingHand = false;
      previewHand = null;
      redraw();
      return;
    }

    if (!drawing) return;
    drawing = false;
    if (current && current.type === 'stroke') {
      if (current.data && current.data.points && current.data.points.length > 0) {
        actionHistory[stage].push(current);
      }
    }
    current = null;
    redraw();
  }

  canvas.addEventListener('pointerup', stopDraw);
  canvas.addEventListener('pointercancel', stopDraw);
  canvas.addEventListener('pointerleave', stopDraw);

  $('pen').addEventListener('click', () => { if (!finished) setTool('pen'); });
  $('eraser').addEventListener('click', () => { if (!finished) setTool('eraser'); });
  $('undo').addEventListener('click', () => {
    if (finished) return;
    if (drawing || isDraggingHand) stopDraw();
    isDraggingHand = false;
    previewHand = null;
    actionHistory[stage].pop();
    redraw();
  });

  $('clear').addEventListener('click', () => {
    if (finished) return;
    showConfirmModal('確定要重新作答嗎？', '確定要清除本關所有作答嗎？', function() {
      actionHistory[stage] = [];
      current = null;
      drawing = false;
      isDraggingHand = false;
      previewHand = null;
      redraw();
    });
  });

  $('intro-start-btn').addEventListener('click', startGame);

  function getHandsFromHistory(stg) {
    const currentStageHistory = actionHistory[stg] || [];
    const hands = [];

    currentStageHistory.forEach(item => {
      if (item.type === 'hand' && item.data) {
        hands.push(item.data);
      }
    });

    if (hands.length === 0) {
      const cx = 300, cy = 300;
      currentStageHistory.forEach(item => {
        if (item.type === 'stroke' && item.data && item.data.points && item.data.points.length >= 2) {
          const pts = item.data.points;
          const startPt = pts[0];
          const endPt = pts[pts.length - 1];
          const startDist = Math.hypot(startPt.x - cx, startPt.y - cy);
          const endDist = Math.hypot(endPt.x - cx, endPt.y - cy);

          if (startDist <= 120 || endDist <= 120) {
            let outerPt = startDist > endDist ? startPt : endPt;
            const angle = Math.atan2(outerPt.y - cy, outerPt.x - cx);
            const len = Math.hypot(outerPt.x - cx, outerPt.y - cy);
            if (len >= 30) {
              hands.push({ angle: angle, length: len });
            }
          }
        }
      });
    }
    return hands;
  }

  function scoreCurrentStage() {
    if (drawing || isDraggingHand) stopDraw();

    const currentStageHistory = actionHistory[stage] || [];
    const strokeCount = currentStageHistory.filter(i => i.type === 'stroke').length;
    const handCount = currentStageHistory.filter(i => i.type === 'hand').length;

    if (stage === 2) {
      if (handCount === 0) {
        showCustomModal('指針還沒設定喔！', '請先在畫布上從中心點向外拖曳畫出指針，再查看結果。');
        return;
      }
    } else if (stage === 3) {
      if (strokeCount === 0 && handCount === 0) {
        showCustomModal('我們先畫一畫喔！', '請先在畫布上完成手繪圓圈、寫數字與拖曳指針，再查看結果。');
        return;
      }
      if (handCount === 0 && getHandsFromHistory(stage).length === 0) {
        showCustomModal('指針還沒設定喔！', '請先從中心點向外拖曳畫出指針，再查看結果。');
        return;
      }
    } else {
      if (strokeCount === 0) {
        showCustomModal('我們先畫一畫喔！', '請先在畫布上完成作答，再查看結果。');
        return;
      }
    }

    showSubmitConfirmModal(function() { executeSubmission(); });
  }

  function executeSubmission() {
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = 600;
    tempCanvas.height = 600;
    const tempCtx = tempCanvas.getContext('2d');
    tempCtx.fillStyle = '#ffffff';
    tempCtx.fillRect(0, 0, 600, 600);
    tempCtx.drawImage(canvas, 0, 0);

    const dataUrl = tempCanvas.toDataURL('image/png');
    const nextBtn = $('next');
    if (nextBtn.disabled) return;
    nextBtn.disabled = true;
    nextBtn.textContent = '評分進行中...';

    const hands = getHandsFromHistory(stage);
    const handDataJson = JSON.stringify(hands);

    if (!(window.google && google.script && google.script.run)) {
      alert('目前不是從 Apps Script 網頁應用程式開啟，無法呼叫 AI 評分。');
      nextBtn.disabled = false;
      nextBtn.textContent = '完成作答';
      return;
    }

    google.script.run
      .withSuccessHandler(data => {
        nextBtn.disabled = false;
        nextBtn.textContent = '完成作答';
        results[stage] = data;
        const navEl = $('nav-' + stage);
        if (navEl) navEl.classList.add('completed');
        showStageSettlement(stage);
      })
      .withFailureHandler(err => {
        nextBtn.disabled = false;
        nextBtn.textContent = '完成作答';
        showCustomModal('評分發生錯誤', (err && err.message ? err.message : String(err)));
      })
      .scoreClock(dataUrl, stage + 1, targetTime, handDataJson);
  }

  $('next').addEventListener('click', scoreCurrentStage);

  showIntroView();
})();
</script>
</body>
</html>
