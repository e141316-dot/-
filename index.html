<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>高齡駕照輔助平台</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --font-scale: 1;
    }

    body.font-scale-90 { --font-scale: 0.9; }
    body.font-scale-100 { --font-scale: 1.0; }
    body.font-scale-115 { --font-scale: 1.15; }
    body.font-scale-130 { --font-scale: 1.3; }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      -webkit-tap-highlight-color: transparent; 
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #FCFBF7; 
      color: #35473C;
      font-family: "Noto Sans TC", -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
      min-height: 100vh; 
      display: flex; 
      flex-direction: column; 
      align-items: center;
      justify-content: flex-start; 
      padding: 20px 16px 40px; 
      overflow-x: hidden; 
      line-height: 1.5;
    }

    .top-controls-bar {
      width: 100%;
      max-width: 680px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .setting-dropdown-wrap {
      position: relative;
    }

    .setting-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: #EAF0E7;
      color: #4F7058;
      border: 1.5px solid #4F7058;
      border-radius: 24px;
      padding: 8px 14px;
      font-size: calc(15px * var(--font-scale));
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s ease, border-color 0.2s ease;
      min-height: 44px;
      box-shadow: none;
    }

    .setting-btn:hover, .setting-btn:active {
      background-color: #FFFFFF;
    }

    .setting-icon {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      color: #4F7058;
    }

    .font-aaa-icon {
      width: 38px;
      height: 20px;
    }

    .arrow-icon {
      width: 14px;
      height: 14px;
      margin-left: 2px;
      color: #4F7058;
      transition: transform 0.2s ease;
    }

    .setting-dropdown-wrap.open .arrow-icon {
      transform: rotate(180deg);
    }

    .setting-menu {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      background-color: #FFFFFF;
      border: 2px solid #4F7058;
      border-radius: 16px;
      box-shadow: 0 6px 20px rgba(79, 112, 88, 0.15);
      min-width: 140px;
      overflow: hidden;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      padding: 6px 0;
    }

    .setting-menu.hidden {
      display: none !important;
    }

    .setting-option {
      padding: 10px 18px;
      font-size: calc(16px * var(--font-scale));
      font-weight: 600;
      color: #35473C;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease;
      text-align: left;
      white-space: nowrap;
    }

    .setting-option:hover {
      background-color: #EAF0E7;
      color: #4F7058;
    }

    .setting-option.selected {
      background-color: #4F7058;
      color: #FFFFFF;
      font-weight: 800;
    }

    .main-container { 
      width: 100%; 
      max-width: 680px; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      text-align: center; 
    }

    .badge-capsule { 
      display: inline-flex; 
      align-items: center; 
      gap: 8px; 
      background-color: #EAF0E7; 
      color: #4F7058; 
      font-size: calc(16px * var(--font-scale)); 
      font-weight: 700; 
      padding: 8px 22px; 
      border-radius: 9999px; 
      margin-bottom: 24px; 
    }

    .badge-icon { 
      width: 16px; 
      height: 16px; 
      stroke: #4F7058; 
      stroke-width: 3; 
      fill: none; 
      stroke-linecap: round; 
      stroke-linejoin: round; 
    }

    .header-section { margin-bottom: 28px; }

    .main-title { 
      font-size: calc(38px * var(--font-scale)); 
      font-weight: 800; 
      color: #35473C; 
      letter-spacing: 1px; 
      margin-bottom: 16px; 
      line-height: 1.25; 
    }

    .subtitle-primary { 
      font-size: calc(20px * var(--font-scale)); 
      font-weight: 700; 
      color: #35473C; 
      margin-bottom: 8px; 
    }

    .subtitle-secondary { 
      font-size: calc(16px * var(--font-scale)); 
      font-weight: 500; 
      color: #6E8075; 
    }

    .slogan-box { 
      width: 100%; 
      max-width: 560px; 
      background-color: #FFFDF9; 
      border: 1.5px solid #F8D7C4; 
      border-radius: 9999px; 
      padding: 14px 28px; 
      margin-bottom: 32px; 
      box-shadow: 0 2px 8px rgba(217, 99, 40, 0.04); 
    }

    .slogan-text { 
      color: #D96328; 
      font-size: calc(19px * var(--font-scale)); 
      font-weight: 700; 
      letter-spacing: 1px; 
    }

    .action-section { margin-bottom: 36px; }

    .start-btn {
      display: inline-flex; 
      align-items: center; 
      justify-content: center;
      background-color: #4F7058; 
      color: #FFFFFF; 
      font-size: calc(22px * var(--font-scale)); 
      font-weight: 700;
      padding: 16px 64px; 
      border-radius: 9999px; 
      text-decoration: none; 
      border: none;
      cursor: pointer; 
      box-shadow: 0 8px 20px rgba(79, 112, 88, 0.28);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); 
      outline: none; 
      min-width: 220px;
    }

    .start-btn:hover { 
      background-color: #43604B; 
      transform: translateY(-2px); 
      box-shadow: 0 10px 24px rgba(79, 112, 88, 0.35); 
    }

    .illustration-box { 
      width: 100%; 
      max-width: 480px; 
      margin: 0 auto; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
    }

    .illustration-img { 
      width: 100%; 
      height: auto; 
      max-width: 100%; 
      display: block; 
      object-fit: contain; 
    }

    @media (max-width: 600px) {
      body { padding: 16px 16px 32px; }
      .badge-capsule { font-size: calc(14px * var(--font-scale)); padding: 6px 16px; margin-bottom: 20px; }
      .main-title { font-size: calc(28px * var(--font-scale)); margin-bottom: 12px; }
      .subtitle-primary { font-size: calc(17px * var(--font-scale)); }
      .subtitle-secondary { font-size: calc(14px * var(--font-scale)); }
      .slogan-box { padding: 12px 18px; margin-bottom: 28px; border-radius: 28px; }
      .slogan-text { font-size: calc(16px * var(--font-scale)); }
      .start-btn { font-size: calc(20px * var(--font-scale)); padding: 14px 48px; width: 85%; max-width: 280px; }
      .illustration-box { max-width: 360px; }
    }
  </style>
</head>
<body>

  <div class="top-controls-bar">
    <div class="setting-dropdown-wrap" id="lang-dropdown-wrap">
      <button type="button" class="setting-btn" id="lang-btn" aria-haspopup="true" aria-expanded="false" onclick="toggleDropdown('lang')">
        <svg class="setting-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="2" y1="12" x2="22" y2="12"></line>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
        </svg>
        <span id="currentLangText">繁體中文</span>
        <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </button>
      <div class="setting-menu hidden" id="lang-menu" role="menu">
        <div class="setting-option" data-lang="zh-TW" onclick="selectLanguage('zh-TW')" role="menuitem">繁體中文</div>
        <div class="setting-option" data-lang="en" onclick="selectLanguage('en')" role="menuitem">English</div>
        <div class="setting-option" data-lang="ja" onclick="selectLanguage('ja')" role="menuitem">日本語</div>
        <div class="setting-option" data-lang="ko" onclick="selectLanguage('ko')" role="menuitem">한국어</div>
      </div>
    </div>

    <div class="setting-dropdown-wrap" id="font-dropdown-wrap">
      <button type="button" class="setting-btn" id="font-btn" aria-haspopup="true" aria-expanded="false" onclick="toggleDropdown('font')" title="調整字體大小">
        <svg class="setting-icon font-aaa-icon" viewBox="0 0 38 20" fill="currentColor" aria-hidden="true">
          <text x="1" y="15" font-size="10" font-weight="800" font-family="sans-serif">A</text>
          <text x="12" y="16" font-size="14" font-weight="800" font-family="sans-serif">A</text>
          <text x="25" y="17" font-size="18" font-weight="800" font-family="sans-serif">A</text>
        </svg>
        <span id="currentFontText">標準</span>
        <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </button>
      <div class="setting-menu hidden" id="font-menu" role="menu">
        <div class="setting-option" data-font="90" onclick="selectFontScale('90')" role="menuitem" id="opt-font-90">小</div>
        <div class="setting-option" data-font="100" onclick="selectFontScale('100')" role="menuitem" id="opt-font-100">標準</div>
        <div class="setting-option" data-font="115" onclick="selectFontScale('115')" role="menuitem" id="opt-font-115">大</div>
        <div class="setting-option" data-font="130" onclick="selectFontScale('130')" role="menuitem" id="opt-font-130">特大</div>
      </div>
    </div>
  </div>

  <div class="main-container">
    <div class="badge-capsule">
      <svg class="badge-icon" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
      <span data-i18n="home.badge">認知練習・安心出行</span>
    </div>

    <div class="header-section">
      <h1 class="main-title" data-i18n="home.mainTitle">高齡駕照輔助平台</h1>
      <p class="subtitle-primary" data-i18n="home.subtitlePrimary">本平台依據 MMSE 認知功能架構設計</p>
      <p class="subtitle-secondary" data-i18n="home.subtitleSecondary">多種生活化小遊戲，輕鬆鍛鍊六大腦力</p>
    </div>

    <div class="slogan-box">
      <span class="slogan-text" data-i18n="home.slogan">動動腦、練認知，安心每一天</span>
    </div>

    <div class="action-section">
      <a href="./LevelSelect.html" target="_self" id="startBtn" class="start-btn" onclick="handleStartClick(event)" data-i18n="home.startBtn">
        開始練習
      </a>
    </div>

    window.appDisplay = {
      lang: 'zh-TW',
      fontScale: '100',
      init: function() {
        var urlParams = new URLSearchParams(window.location.search);
        this.lang = urlParams.get('lang') || localStorage.getItem('app_lang') || 'zh-TW';
        this.fontScale = urlParams.get('fontScale') || localStorage.getItem('app_font_scale') || '100';

        localStorage.setItem('app_lang', this.lang);
        localStorage.setItem('app_font_scale', this.fontScale);

        this.applyFontScale(this.fontScale);
        this.applyLanguage(this.lang);
      },
      t: function(key) {
        return (i18nDict[this.lang] && i18nDict[this.lang][key]) || (i18nDict['zh-TW'][key]) || key;
      },
      setLanguage: function(lang) {
        this.lang = lang;
        localStorage.setItem('app_lang', lang);
        this.applyLanguage(lang);
        this.updateUrlParams();
      },
      applyLanguage: function(lang) {
        var elements = document.querySelectorAll('[data-i18n]');
        for (var i = 0; i < elements.length; i++) {
          var el = elements[i];
          var key = el.getAttribute('data-i18n');
          var val = this.t(key);
          if (el.tagName === 'INPUT' && (el.type === 'button' || el.type === 'submit')) {
            el.value = val;
          } else {
            el.innerHTML = val;
          }
        }

        var langNames = {
          'zh-TW': '繁體中文', 'en': 'English', 'ja': '日本語', 'ko': '한국어'
        };
        var langTextEl = document.getElementById('currentLangText');
        if (langTextEl) langTextEl.textContent = langNames[this.lang] || '繁體中文';

        var langOpts = document.querySelectorAll('#lang-menu .setting-option');
        for (var j = 0; j < langOpts.length; j++) {
          var opt = langOpts[j];
          opt.classList.toggle('selected', opt.getAttribute('data-lang') === this.lang);
        }

        var opt90 = document.getElementById('opt-font-90');
        var opt100 = document.getElementById('opt-font-100');
        var opt115 = document.getElementById('opt-font-115');
        var opt130 = document.getElementById('opt-font-130');
        if (opt90) opt90.textContent = this.t('font.opt.90');
        if (opt100) opt100.textContent = this.t('font.opt.100');
        if (opt115) opt115.textContent = this.t('font.opt.115');
        if (opt130) opt130.textContent = this.t('font.opt.130');

        this.applyFontScale(this.fontScale);
      },
      setFontScale: function(scale) {
        this.fontScale = scale;
        localStorage.setItem('app_font_scale', scale);
        this.applyFontScale(scale);
        this.updateUrlParams();
      },
      applyFontScale: function(scale) {
        document.body.classList.remove('font-scale-90', 'font-scale-100', 'font-scale-115', 'font-scale-130');
        document.body.classList.add('font-scale-' + scale);

        var fontTextEl = document.getElementById('currentFontText');
        if (fontTextEl) fontTextEl.textContent = this.t('font.opt.' + scale);

        var fontOpts = document.querySelectorAll('#font-menu .setting-option');
        for (var k = 0; k < fontOpts.length; k++) {
          var opt = fontOpts[k];
          opt.classList.toggle('selected', opt.getAttribute('data-font') === scale);
        }
      },
      updateUrlParams: function() {
        try {
          var url = new URL(window.location.href);
          url.searchParams.set('lang', this.lang);
          url.searchParams.set('fontScale', this.fontScale);
          window.history.replaceState({}, '', url.toString());
        } catch(e) {}
      }
    };

    // GitHub Pages 靜態頁面導覽：不再使用 Apps Script 的 page 參數或表單提交。
    function navigateTo(pageTarget) {
      var pageFiles = {
        'home': 'index.html',
        'level_select': 'LevelSelect.html',
        'time_game': 'TimeGame.html',
        'festival_game': 'FestivalGame.html',
        'situation_game': 'SituationGame.html',
        'semantic_game': 'SemanticGame.html',
        'visual_game': 'VisualGame.html',
        'attention_game': 'AttentionGame.html',
        'final_exam': 'FinalExam.html'
      };
      var targetFile = pageFiles[pageTarget];
      if (!targetFile) {
        console.error('找不到對應的頁面：', pageTarget);
        return;
      }

      // 使用同一個 GitHub Pages 專案目錄中的 HTML 檔案，不再走 Apps Script page 參數。
      var targetUrl = new URL(targetFile, window.location.href);
      targetUrl.searchParams.delete('page');
      targetUrl.searchParams.set('lang', window.appDisplay.lang || 'zh-TW');
      targetUrl.searchParams.set('fontScale', window.appDisplay.fontScale || '100');

      window.location.assign(targetUrl.toString());
    }

    window.navigateTo = navigateTo;
    window.navigateToPage = navigateTo;

    function toggleDropdown(type) {
      var langWrap = document.getElementById('lang-dropdown-wrap');
      var fontWrap = document.getElementById('font-dropdown-wrap');
      var langMenu = document.getElementById('lang-menu');
      var fontMenu = document.getElementById('font-menu');

      if (type === 'lang') {
        var isHiddenLang = langMenu.classList.contains('hidden');
        fontMenu.classList.add('hidden');
        fontWrap.classList.remove('open');
        if (isHiddenLang) {
          langMenu.classList.remove('hidden');
          langWrap.classList.add('open');
        } else {
          langMenu.classList.add('hidden');
          langWrap.classList.remove('open');
        }
      } else if (type === 'font') {
        var isHiddenFont = fontMenu.classList.contains('hidden');
        langMenu.classList.add('hidden');
        langWrap.classList.remove('open');
        if (isHiddenFont) {
          fontMenu.classList.remove('hidden');
          fontWrap.classList.add('open');
        } else {
          fontMenu.classList.add('hidden');
          fontWrap.classList.remove('open');
        }
      }
    }

    function selectLanguage(lang) {
      window.appDisplay.setLanguage(lang);
      toggleDropdown('lang');
    }

    function selectFontScale(scale) {
      window.appDisplay.setFontScale(scale);
      toggleDropdown('font');
    }

    document.addEventListener('click', function(e) {
      var langWrap = document.getElementById('lang-dropdown-wrap');
      var fontWrap = document.getElementById('font-dropdown-wrap');
      if (langWrap && !langWrap.contains(e.target)) {
        document.getElementById('lang-menu').classList.add('hidden');
        langWrap.classList.remove('open');
      }
      if (fontWrap && !fontWrap.contains(e.target)) {
        document.getElementById('font-menu').classList.add('hidden');
        fontWrap.classList.remove('open');
      }
    });

    function handleStartClick(e) {
      // 使用一般超連結作為導頁主體；此函式只負責附帶偏好設定。
      // 即使 JavaScript 未執行，href="./LevelSelect.html" 仍可直接開啟分類頁。
      if (!e || !e.currentTarget) return true;

      var targetUrl = new URL('./LevelSelect.html', document.baseURI);
      var currentLang = (window.appDisplay && window.appDisplay.lang) ||
        localStorage.getItem('app_lang') || 'zh-TW';
      var currentFontScale = (window.appDisplay && window.appDisplay.fontScale) ||
        localStorage.getItem('app_font_scale') || '100';

      targetUrl.searchParams.set('lang', currentLang);
      targetUrl.searchParams.set('fontScale', currentFontScale);
      e.currentTarget.href = targetUrl.toString();

      // 不呼叫 preventDefault，讓瀏覽器執行 a 標籤原生導頁。
      return true;
    }

    document.addEventListener('DOMContentLoaded', function() {
      window.appDisplay.init();
    });
  </script>
</body>
</html>
