<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <base target="_self">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>看時間回答遊戲 - 高齡駕照輔助平台</title>
  <style>
    /* ==========================================
       1. 全局樣式與奶油白 & 鼠尾草綠視覺主題
       ========================================== */
    :root {
      --font-scale: 1;
      --primary-color: #4F7058;
      --primary-dark: #2B3D30;
      --primary-light: #EAF0E7;
      --accent-color: #5C6E62;
      --bg-color: #FCFBF7;
      --card-bg: #FFFFFF;
      --text-main: #000000;
      --text-muted: #000000;
      --border-color: #D6DEC8;
      --border-radius: 16px;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Microsoft JhengHei", sans-serif;
    }

    body.font-scale-90 { --font-scale: 0.9; }
    body.font-scale-100 { --font-scale: 1.0; }
    body.font-scale-115 { --font-scale: 1.15; }
    body.font-scale-130 { --font-scale: 1.3; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-family);
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding-bottom: calc(32px + env(safe-area-inset-bottom, 0px));
      overflow-x: hidden;
      width: 100%;
      font-size: calc(16px * var(--font-scale));
    }

    header {
      position: relative;
      width: 100%;
      background-color: #FCFBF7;
      color: var(--primary-color);
      padding: 0 16px 6px 16px;
      text-align: center;
      overflow: hidden;
    }

    header h1, #main-header h1, .home-main-title {
      margin-top: 14px !important;
      font-size: calc(36px * var(--font-scale)) !important;
      font-weight: 900 !important;
      color: #2E4032 !important;
      line-height: 1.25 !important;
      text-align: center !important;
      margin-bottom: 6px !important;
      position: relative;
      z-index: 2;
      -webkit-font-smoothing: antialiased;
    }

    .nav-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      width: 92%;
      max-width: 800px;
      margin: 0 auto;
      position: relative;
      z-index: 2;
    }

    .nav-item {
      flex: 1 1 0px;
      min-height: 56px;
      background-color: #8A9E90;
      color: #ffffff;
      padding: 6px 4px;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
      white-space: nowrap;
      border: 2px solid transparent;
      touch-action: manipulation;
      line-height: 1.25;
    }
    .nav-title-main {
      font-size: calc(17px * var(--font-scale));
      font-weight: 800;
    }
    .nav-title-sub {
      font-size: calc(14px * var(--font-scale));
      font-weight: 700;
      margin-top: 2px;
      opacity: 0.92;
    }

    .nav-item.locked {
      background-color: #EEF1EB !important;
      color: #66756A !important;
      border: 2px solid transparent !important;
      cursor: not-allowed !important;
      opacity: 1;
      pointer-events: none;
    }
    .nav-item.locked .nav-title-main,
    .nav-item.locked .nav-title-sub {
      color: #66756A !important;
    }

    .nav-item.active {
      background-color: var(--primary-dark) !important;
      color: #ffffff !important;
      border: 2.5px solid var(--primary-dark) !important;
      box-shadow: 0 4px 12px rgba(43, 61, 48, 0.25) !important;
    }
    .nav-item.active .nav-title-main,
    .nav-item.active .nav-title-sub {
      color: #ffffff !important;
    }

    .nav-item.completed {
      background-color: #EAF0E7 !important;
      color: var(--primary-dark) !important;
      border: 2px solid #8A9E90 !important;
      cursor: pointer;
    }
    .nav-item.completed .nav-title-main,
    .nav-item.completed .nav-title-sub {
      color: var(--primary-dark) !important;
    }

    main {
      width: 92%;
      max-width: 800px;
      background: transparent;
      border-radius: 0;
      border: none;
      box-shadow: none;
      margin-top: 8px;
      padding: clamp(8px, 2.5vw, 16px);
    }

    .question-box {
      background-color: var(--primary-light);
      border-left: 6px solid var(--primary-color);
      padding: 14px 18px;
      border-radius: 14px;
      margin-bottom: 14px;
      text-align: center;
    }
    .question-text {
      font-size: calc(24px * var(--font-scale));
      font-weight: 800;
      color: #000000;
      line-height: 1.4;
      letter-spacing: 0.3px;
    }
    .question-line {
      display: block;
    }
    .question-line + .question-line {
      margin-top: 2px;
    }
    .hint-text {
      font-size: calc(18px * var(--font-scale));
      color: #000000;
      font-weight: 800;
      margin-top: 8px;
      line-height: 1.45;
    }

    .clock-question-box .question-text {
      color: #35473C;
    }
    .clock-question-box .hint-text {
      color: #35473C;
      font-weight: 700;
      line-height: 1.5;
    }

    .home-wrapper {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 4px 0;
    }
    .intro-back-wrap {
      display: flex;
      justify-content: flex-start;
      margin-bottom: 2px;
    }
    .home-header {
      text-align: center;
      margin-bottom: 4px;
    }
    .home-subtitle {
      font-size: calc(18px * var(--font-scale));
      color: #35473C;
      font-weight: 800;
    }
    .home-card {
      background-color: var(--primary-light);
      border: 1.5px solid var(--border-color);
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .home-icon-box {
      width: 64px;
      height: 64px;
      min-width: 64px;
      background: #ffffff;
      border: 1.5px solid var(--border-color);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
    }
    .home-icon-svg {
      width: 100%;
      height: 100%;
    }
    .home-card-content {
      display: flex;
      flex: 1 1 0%;
      min-width: 0;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
    }
    .home-badge {
      background-color: var(--primary-color);
      color: #ffffff;
      font-size: calc(14px * var(--font-scale));
      font-weight: 800;
      padding: 3px 12px;
      border-radius: 12px;
      display: inline-block;
    }

    .home-card {
      position: relative;
      background-color: var(--primary-light);
      border: 1.5px solid var(--border-color);
      border-radius: 16px;
      padding: 16px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }

    .home-card-title {
      font-size: calc(22px * var(--font-scale)) !important;
      color: #1E3326 !important;
      font-weight: 800;
    }
    .home-card-desc {
      font-size: calc(19px * var(--font-scale)) !important;
      color: #1E3326 !important;
      line-height: 1.5;
      font-weight: 700;
      word-break: normal;
      overflow-wrap: break-word;
      text-wrap: pretty;
    }

    .btn-start-game, .btn-settlement-next, .btn-play-again {
      width: 100%;
      max-width: 420px;
      min-height: 54px;
      padding: 12px 24px;
      background-color: var(--primary-color);
      color: #ffffff;
      font-size: calc(20px * var(--font-scale));
      font-weight: 800;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(79, 112, 88, 0.28);
      transition: all 0.18s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      touch-action: manipulation;
    }
    .btn-start-game:hover, .btn-settlement-next:hover, .btn-play-again:hover {
      background-color: var(--primary-dark);
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(79, 112, 88, 0.38);
    }
    .btn-start-game:active, .btn-settlement-next:active, .btn-play-again:active {
      transform: scale(0.98);
    }

    .clock-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      touch-action: none;
    }
    .clock-svg {
      width: min(260px, 62vw);
      height: min(260px, 62vw);
      user-select: none;
      touch-action: none;
      cursor: pointer;
      transition: transform 0.1s ease;
    }
    @keyframes clockSnapBounce {
      0% { transform: scale(1); }
      40% { transform: scale(1.03); }
      75% { transform: scale(0.98); }
      100% { transform: scale(1); }
    }
    .clock-snap-anim {
      animation: clockSnapBounce 0.22s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .clock-face {
      fill: #ffffff;
      stroke: var(--primary-color);
      stroke-width: 8;
    }
    .clock-number {
      font-size: 21px;
      font-weight: bold;
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      cursor: pointer;
    }
    .hand-hour {
      stroke: #C85A5A;
      stroke-width: 8;
      stroke-linecap: round;
      transition: transform 0.05s ease-out;
    }
    .hand-minute {
      stroke: #4A7A96;
      stroke-width: 5;
      stroke-linecap: round;
      transition: transform 0.05s ease-out;
    }
    .hand-select-group {
      display: flex;
      gap: 12px;
      margin-top: 12px;
      width: 100%;
      max-width: 440px;
      justify-content: center;
    }

    .btn-hand {
      font-size: calc(17px * var(--font-scale)) !important;
      font-weight: 800 !important;
      border-width: 2.5px !important;
      transition: all 0.2s ease;
    }
    .btn-hand.active {
      background-color: var(--primary-dark) !important;
      color: #ffffff !important;
      border-color: var(--primary-dark) !important;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15) !important;
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: clamp(8px, 2vw, 14px);
      margin: 10px 0 6px 0;
    }
    .option-card {
      border: 2.5px solid var(--border-color);
      border-radius: var(--border-radius);
      padding: clamp(8px, 1.6vw, 12px);
      text-align: center;
      cursor: pointer;
      background: #ffffff;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      position: relative;
      height: 100%;
      touch-action: manipulation;
      user-select: none;
    }
    .option-card:hover {
      border-color: var(--primary-color);
      transform: translateY(-2px);
    }
    .option-card.selected {
      border-color: var(--primary-color);
      background-color: var(--primary-light);
      box-shadow: 0 0 0 3px var(--primary-color);
    }
    .option-img-container, 
    .option-img-container img, 
    .option-img-container svg, 
    .option-label {
      pointer-events: none;
    }
    .option-img-container {
      width: 100%;
      height: clamp(88px, 20vw, 135px);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 6px;
      overflow: hidden;
      border-radius: 8px;
      background-color: #F8FAF7;
    }
    .option-img-container img, .option-img-container svg {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .option-label {
      font-size: calc(18px * var(--font-scale));
      font-weight: 800;
      color: #000000;
      margin-top: 4px;
      word-break: break-word;
    }

    .btn {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 10px 24px;
      font-size: calc(18px * var(--font-scale));
      font-weight: 800;
      border-radius: 30px;
      cursor: pointer;
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.2s, transform 0.1s;
      box-shadow: 0 3px 8px rgba(0,0,0,0.12);
      touch-action: manipulation;
    }
    .btn:hover { background-color: var(--primary-dark); }
    .btn:active { transform: scale(0.98); }

    .action-bar {
      display: flex !important;
      justify-content: center !important;
      width: 100% !important;
      margin-top: 16px !important;
    }
    .clock-action-bar {
      margin-bottom: calc(20px + env(safe-area-inset-bottom, 0px)) !important;
    }
    .btn-submit {
      width: 100% !important;
      max-width: 420px !important;
      min-height: 54px !important;
      font-size: calc(20px * var(--font-scale)) !important;
      font-weight: 800 !important;
      margin: 0 auto !important;
    }

    .settlement-card {
      position: relative;
      background: transparent;
      border: none;
      border-radius: 0;
      padding: 0;
      margin-bottom: 6px;
      text-align: center;
      box-shadow: none;
      overflow: visible;
    }
    .settlement-card > *:not(.confetti-container) {
      position: relative;
      z-index: 2;
    }
    .settlement-title {
      color: var(--primary-dark);
      font-size: calc(26px * var(--font-scale));
      font-weight: 800;
      margin-bottom: 6px;
      line-height: 1.25;
    }

    .perfect-graphic-group {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin: 2px 0;
      position: relative;
    }
    .side-decor {
      position: relative;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .decor-stars {
      position: absolute;
      width: 36px;
      height: 36px;
      opacity: 0;
      transform: scale(0);
      animation: decorStarsFadeIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.2s forwards;
      filter: drop-shadow(0 2px 4px rgba(255, 179, 0, 0.4));
    }
    @keyframes decorStarsFadeIn {
      0% { opacity: 0; transform: scale(0) rotate(-20deg); }
      70% { opacity: 1; transform: scale(1.2) rotate(10deg); }
      100% { opacity: 1; transform: scale(1) rotate(0deg); }
    }
    .perfect-trophy-svg {
      width: clamp(58px, 16vw, 76px);
      height: clamp(58px, 16vw, 76px);
      filter: drop-shadow(0 4px 10px rgba(255, 179, 0, 0.45));
      animation: trophyPopIn 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards, trophyFloat 3s ease-in-out 0.7s infinite alternate;
    }
    @keyframes trophyPopIn {
      0% { transform: translateY(-30px) scale(0.2); opacity: 0; }
      60% { transform: translateY(4px) scale(1.15); opacity: 1; }
      80% { transform: translateY(-2px) scale(0.95); }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }
    @keyframes trophyFloat {
      0% { transform: translateY(0) rotate(0deg); }
      100% { transform: translateY(-5px) rotate(3deg); }
    }

    .settlement-stars {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin: 6px 0 10px 0;
    }
    .star-svg-icon {
      width: clamp(40px, 9.5vw, 50px);
      height: clamp(40px, 9.5vw, 50px);
      display: block;
      filter: drop-shadow(0 3px 6px rgba(245, 158, 11, 0.35));
    }
    .star-item {
      display: inline-block;
      opacity: 0;
      transform: translateY(-50px) scale(0.6);
      animation: starDrop 0.65s cubic-bezier(0.25, 1, 0.5, 1) forwards, starSparkle 2.6s ease-in-out 0.65s infinite alternate;
    }
    .star-1 { animation-delay: 0.1s, 0.8s; }
    .star-2 { animation-delay: 0.25s, 1.0s; }
    .star-3 { animation-delay: 0.4s, 1.2s; }
    @keyframes starDrop {
      0% { opacity: 0; transform: translateY(-50px) scale(0.6); }
      70% { opacity: 1; transform: translateY(5px) scale(1.12); }
      85% { transform: translateY(-2px) scale(0.98); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes starSparkle {
      0% { filter: drop-shadow(0 3px 6px rgba(245, 158, 11, 0.35)); transform: scale(1); }
      50% { filter: drop-shadow(0 0 12px rgba(245, 158, 11, 0.8)) drop-shadow(0 0 20px rgba(251, 191, 36, 0.6)); transform: scale(1.05); }
      100% { filter: drop-shadow(0 3px 6px rgba(245, 158, 11, 0.35)); transform: scale(1); }
    }

    .settlement-score-pill {
      background-color: #EBF1EA;
      color: var(--primary-dark);
      padding: 8px 26px;
      border-radius: 30px;
      display: inline-block;
      font-size: calc(18px * var(--font-scale));
      font-weight: 800;
      margin: 2px 0 10px 0;
    }

    .settlement-encouragement {
      background: transparent;
      border: none;
      padding: 8px 12px;
      color: #000000;
      font-size: calc(20px * var(--font-scale));
      font-weight: 800;
      line-height: 1.5;
      margin: 8px auto 12px auto;
      max-width: 480px;
      text-align: center;
    }

    .summary-breakdown-wrapper {
      position: relative;
      width: 100%;
      max-width: 620px;
      margin: 14px auto 10px auto;
    }
    .summary-breakdown-box {
      background-color: var(--primary-light);
      border-radius: 14px;
      padding: 12px 24px;
      text-align: left;
      width: 100%;
    }
    .summary-breakdown-row {
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: calc(17px * var(--font-scale));
      font-weight: 800;
      color: #000000;
      padding: 10px 0;
      border-bottom: 1.5px dashed #D0DACF;
      gap: 10px;
    }
    .summary-breakdown-row:last-child {
      border-bottom: none;
    }
    .summary-breakdown-score {
      color: var(--primary-dark);
      font-weight: 800;
      font-size: calc(18px * var(--font-scale));
    }

    .settlement-table-card {
      width: 100%;
      max-width: 420px;
      margin: 10px auto 16px auto;
      background-color: transparent;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .settlement-table-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      font-size: calc(18px * var(--font-scale));
      font-weight: 800;
      border-radius: 12px;
      gap: 12px;
    }
    .row-correct {
      background-color: #E2EFE0;
      color: #2A5235;
    }
    .row-correct .settlement-row-label,
    .row-correct .settlement-row-val {
      color: #2A5235;
      font-weight: 800;
    }
    .row-wrong {
      background-color: #EBECEB;
      color: #4A4D4A;
    }
    .row-wrong .settlement-row-label,
    .row-wrong .settlement-row-val {
      color: #4A4D4A;
      font-weight: 800;
    }
    .settlement-row-val {
      font-size: calc(20px * var(--font-scale));
      letter-spacing: 0.5px;
    }

    .btn-clap-sound {
      background-color: #ffffff;
      border: 2px solid var(--primary-color);
      color: var(--primary-dark);
      padding: 8px 20px;
      border-radius: 22px;
      font-size: calc(16px * var(--font-scale));
      font-weight: 800;
      cursor: pointer;
      margin: 8px 0 12px 0;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      touch-action: manipulation;
    }
    .btn-clap-sound:hover { background-color: var(--primary-light); }

    .confetti-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
    }
    .confetti-piece {
      position: absolute;
      top: -20px;
      opacity: 0;
      animation: confettiFall 2.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) infinite;
    }
    @keyframes confettiFall {
      0% { transform: translateY(0) rotate(0deg) scaleX(1); opacity: 0.95; }
      75% { opacity: 0.85; }
      100% { transform: translateY(380px) rotate(720deg) scaleX(0.5); opacity: 0; }
    }

    .summary-action-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 100%;
      max-width: 520px;
      margin: 10px auto 0 auto;
    }

    .sub-nav-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      width: 100%;
    }
    .btn-sub-nav {
      flex: 1 1 0px;
      min-width: 100px;
      height: 46px;
      background-color: #FCFBF7;
      border: 2px solid var(--primary-color);
      color: var(--primary-dark);
      font-size: calc(15px * var(--font-scale));
      font-weight: 800;
      border-radius: 25px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      white-space: nowrap;
      transition: all 0.2s ease;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      padding: 0 8px;
      text-decoration: none;
      touch-action: manipulation;
    }
    .btn-sub-nav:hover {
      background-color: #FFFFFF;
      border-color: var(--primary-dark);
      color: var(--primary-dark);
      transform: translateY(-1px);
      box-shadow: 0 3px 8px rgba(79, 112, 88, 0.15);
    }
    .btn-sub-nav:active { transform: scale(0.98); }

    @media (max-width: 520px) {

  function initDisplaySettings() {
    var urlParams = new URLSearchParams(window.location.search);
    var requestedLang = urlParams.get('lang') || localStorage.getItem('app_lang') || 'zh-TW';
    currentLang = i18nDict[requestedLang] ? requestedLang : 'zh-TW';
    document.documentElement.lang = currentLang;
    currentFontScale = urlParams.get('fontScale') || localStorage.getItem('app_font_scale') || '100';

    localStorage.setItem('app_lang', currentLang);
    localStorage.setItem('app_font_scale', currentFontScale);

    document.body.classList.remove('font-scale-90', 'font-scale-100', 'font-scale-115', 'font-scale-130');
    document.body.classList.add('font-scale-' + currentFontScale);
  }

  function t(key) {
    var dict = i18nDict[currentLang] || i18nDict['zh-TW'];
    var val = (dict && dict[key] !== undefined) ? dict[key] : i18nDict['zh-TW'][key];
    return val !== undefined ? val : key;
  }

  // GitHub Pages 靜態頁面導向：不再使用 Google Apps Script 的 page 參數表單。
  // 使用相對路徑，讓根目錄或專案型 GitHub Pages 都能沿用目前網站路徑。
  function navigateToStaticPage(fileName) {
    var safeLang = i18nDict[currentLang] ? currentLang : 'zh-TW';
    var safeFontScale = ['90', '100', '115', '130'].indexOf(String(currentFontScale)) >= 0
      ? String(currentFontScale)
      : '100';

    // 同步保存設定，避免跨頁後語言或字體大小還原成預設值。
    try {
      localStorage.setItem('app_lang', safeLang);
      localStorage.setItem('app_font_scale', safeFontScale);
    } catch (e) {
      // 部分瀏覽環境可能限制 localStorage；仍繼續執行頁面導向。
    }

    var targetUrl = new URL(fileName, window.location.href);
    targetUrl.search = '';
    targetUrl.hash = '';
    targetUrl.searchParams.set('lang', safeLang);
    targetUrl.searchParams.set('fontScale', safeFontScale);

    // 直接在目前頁面導向，避免表單提交、跨框架 target 與需要重複點擊的情況。
    window.location.assign(targetUrl.href);
  }

  function lockAction(timeout) {
    if (typeof timeout === 'undefined') timeout = 450;
    if (isActionLocked) return false;
    isActionLocked = true;
    setTimeout(function() { isActionLocked = false; }, timeout);
    return true;
  }

  function shuffleArray(array) {
    const arr = array.slice();
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }
  
  let audioCtx = null;
  function playSnapSound() {
    try {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      osc.type = 'sine';
      osc.frequency.setValueAtTime(650, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(180, audioCtx.currentTime + 0.04);
      
      gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
      
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      
      osc.start();
      osc.stop(audioCtx.currentTime + 0.04);
    } catch(e) {
      console.log("Audio snap play error:", e);
    }
  }

  function triggerSnapFeedback() {
    playSnapSound();
    const svg = document.getElementById('clock-svg');
    if (svg) {
      svg.classList.remove('clock-snap-anim');
      void svg.offsetWidth;
      svg.classList.add('clock-snap-anim');
    }
  }

  function playCheerSound() {
    try {
      if (!cheerAudioInstance) {
        cheerAudioInstance = new Audio();
        cheerAudioInstance.crossOrigin = "anonymous";
        cheerAudioInstance.src = CHEER_MP3_SOURCES[0];
      }
      cheerAudioInstance.pause();
      cheerAudioInstance.currentTime = 0;
      const playPromise = cheerAudioInstance.play();
      if (playPromise !== undefined) {
        playPromise.catch(err => {
          currentSourceIdx = (currentSourceIdx + 1) % CHEER_MP3_SOURCES.length;
          cheerAudioInstance.src = CHEER_MP3_SOURCES[currentSourceIdx];
          cheerAudioInstance.play().catch(e => console.log("Audio play prevented:", e));
        });
      }
    } catch (e) {
      console.log("Audio play error:", e);
    }
  }

    initDisplaySettings();

  function startGame() {
    if (!lockAction(500)) return;
    
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume();
    }

    gameState.currentLevel = 1;
    gameState.maxUnlockedLevel = 1;
    gameState.levels[1] = { completed: false, submitted: false, score: 0, targetHour: 3, targetMin: 30, userHour: 12, userMin: 0, activeHand: 'minute', reviewRecord: null };
    gameState.levels[2] = { completed: false, submitted: false, score: 0, questionSet: [], questionIndex: 0, questionData: null, questionResults: [null], selectedOption: null };
    gameState.levels[3] = { completed: false, submitted: false, score: 0, questionData: null, selectedOption: null, answerRecords: [] };
    
    setupLevel1Question();
    setupLevel3Question();
    renderCurrentStage();
  }

  function restartGame() {
    if (!lockAction(500)) return;
    gameState.currentLevel = 'home';
    gameState.maxUnlockedLevel = 1;
    gameState.levels[1] = { completed: false, submitted: false, score: 0, targetHour: 3, targetMin: 30, userHour: 12, userMin: 0, activeHand: 'minute', reviewRecord: null };
    gameState.levels[2] = { completed: false, submitted: false, score: 0, questionSet: [], questionIndex: 0, questionData: null, questionResults: [null], selectedOption: null };
    gameState.levels[3] = { completed: false, submitted: false, score: 0, questionData: null, selectedOption: null, answerRecords: [] };
    
    setupLevel1Question();
    setupLevel3Question();
    renderCurrentStage();
  }

  function showFinalSummary() {
    if (!lockAction(400)) return;
    gameState.currentLevel = 'summary';
    renderCurrentStage();
  }

  function renderCurrentStage() {
    const mainHeader = document.getElementById('main-header');
    const headerTitle = document.getElementById('header-main-title');
    if (headerTitle) headerTitle.innerHTML = t('game.title');

    const container = document.getElementById('game-container');
    
    if (gameState.currentLevel === 'home') {
      if (mainHeader) mainHeader.style.display = 'none';
      renderHome(container);
    } else if (gameState.currentLevel === 'summary') {
      if (mainHeader) mainHeader.style.display = 'block';
      updateNavBar();
      renderFinalSummary(container);
    } else {
      if (mainHeader) mainHeader.style.display = 'block';
      updateNavBar();
      
      if (gameState.currentLevel === 1) renderLevel1(container);
      else if (gameState.currentLevel === 2) renderLevel2(container);
      else if (gameState.currentLevel === 3) renderLevel3(container);
    }
  }

  function updateNavBar() {
    const navBar = document.getElementById("nav-bar");
    if (!navBar) return;
    
    const levelInfo = [

      { name: t('nav.lvl2_name'), theme: t('nav.lvl2_theme') },

          '<span class="nav-title-main">' + t('nav.summary') + '</span>' +
        '</div>';
    } else {
      navBar.innerHTML = levelInfo.map((info, idx) => {
        const lvlNum = idx + 1;
        const isCurrent = (gameState.currentLevel === lvlNum);
        const isCompleted = gameState.levels[lvlNum] && gameState.levels[lvlNum].submitted && !isCurrent;
        const isLocked = lvlNum > gameState.maxUnlockedLevel;

        let stateClass = "";
        let clickAttr = "";

        if (isCurrent) {
          stateClass = "active";
          clickAttr = 'onclick="goToLevel(' + lvlNum + ')"';
        } else if (isCompleted) {
          stateClass = "completed";
          clickAttr = 'onclick="handleCompletedLevelClick(' + lvlNum + ')"';
        } else if (isLocked) {
          stateClass = "locked";
          clickAttr = 'disabled style="pointer-events: none;"';
        } else {
          stateClass = "";
          clickAttr = 'onclick="goToLevel(' + lvlNum + ')"';
        }

        return '<div id="nav-' + lvlNum + '" class="nav-item ' + stateClass + '" ' + clickAttr + '>' +
            '<span class="nav-title-main">' + info.name + '</span>' +
            '<span class="nav-title-sub">' + info.theme + '</span>' +
          '</div>';
      }).join('');
    }

  function getLevel2QuestionText(question) {

  function getLevel2QuestionHTML(question) {

  function getLevel2OptionText(question, optionKey) {
    const option = question.options.find(function(item) { return item.key === optionKey; });
    return option ? t(option.optKey) : '—';
  }

  function getSummaryClockTime(hour, minute) {
    return padZero(hour) + ':' + padZero(minute);
  }

  function renderSummaryClockPreview(hour, minute) {
    const cx = 90, cy = 90;
    let numbers = '';
    for (let i = 1; i <= 12; i++) {
      const rad = (i * 30 - 90) * (Math.PI / 180);
      const x = cx + 64 * Math.cos(rad);
      const y = cy + 64 * Math.sin(rad);
      numbers += '<text x="' + x.toFixed(2) + '" y="' + y.toFixed(2) + '" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="700" fill="#35473C">' + i + '</text>';
    }
    const hourAngle = (hour % 12) * 30 + minute * 0.5;
    const minuteAngle = minute * 6;
    const hourRad = (hourAngle - 90) * Math.PI / 180;
    const minuteRad = (minuteAngle - 90) * Math.PI / 180;
    const hourX = cx + 34 * Math.cos(hourRad);
    const hourY = cy + 34 * Math.sin(hourRad);
    const minuteX = cx + 51 * Math.cos(minuteRad);
    const minuteY = cy + 51 * Math.sin(minuteRad);
    return '<svg class="summary-clock-preview" viewBox="0 0 180 180" role="img" aria-label="' + getSummaryClockTime(hour, minute) + '">' +
      '<circle cx="90" cy="90" r="82" fill="#FFFFFF" stroke="#4F7058" stroke-width="5"/>' +
      numbers +
      '<line x1="90" y1="90" x2="' + hourX.toFixed(2) + '" y2="' + hourY.toFixed(2) + '" stroke="#C85A5A" stroke-width="6" stroke-linecap="round"/>' +
      '<line x1="90" y1="90" x2="' + minuteX.toFixed(2) + '" y2="' + minuteY.toFixed(2) + '" stroke="#4A7A96" stroke-width="4" stroke-linecap="round"/>' +
      '<circle cx="90" cy="90" r="5" fill="#4F7058"/>' +
      '</svg>';
  }

  function renderLevel1SummaryDetail() {

    if (!lvl || !lvl.submitted) {
      return '<p class="summary-review-empty">' + t('summary.empty') + '</p>';

    // 若這是較早版本的同一輪狀態，仍可由已保存的時鐘數值還原實際設定；不捏造繪圖或評語。
    const record = lvl.reviewRecord || {
      targetHour: lvl.targetHour,
      targetMin: lvl.targetMin,
      userHour: lvl.userHour,
      userMin: lvl.userMin,
      hourCorrect: lvl.userHour === lvl.targetHour,
      minuteCorrect: lvl.userMin === lvl.targetMin,
      score: lvl.score
    };
    const targetTime = getSummaryClockTime(record.targetHour, record.targetMin);
    const userTime = getSummaryClockTime(record.userHour, record.userMin);
    const hourPoints = record.hourCorrect ? 50 : 0;
    const minutePoints = record.minuteCorrect ? 50 : 0;
    return '<div class="summary-review-card">' +
      '<div class="summary-level1-result">' +
        renderSummaryClockPreview(record.userHour, record.userMin) +

      '<div class="summary-level1-score-row"><span class="summary-review-line"><strong>' + t('summary.minute_hand') + '</strong></span><span class="summary-review-status">' + (record.minuteCorrect ? t('summary.matched') : t('summary.needs_review')) + '・' + minutePoints + ' ' + t('summary.points_unit') + '</span></div>' +

  function renderLevel2SummaryDetail() {
    const lvl = gameState.levels[2];
    if (!lvl || !lvl.submitted || !Array.isArray(lvl.questionResults)) {
      return '<p class="summary-review-empty">' + t('summary.empty') + '</p>';
    }
    const items = lvl.questionResults.map(function(result, index) {
      if (!result) return '';
      const question = result.questionData || (Array.isArray(lvl.questionSet)
        ? lvl.questionSet.find(function(item) { return item.id === result.questionId; }) || lvl.questionSet[index]
        : null);
      if (!question || !Array.isArray(question.options)) return '';
      const yourAnswer = getLevel2OptionText(question, result.selectedOption);
      const correctKey = result.correctOption || question.correct;
      const correctAnswer = getLevel2OptionText(question, correctKey);
      const isCorrect = !!result.isCorrect;
      return '<article class="summary-review-card ' + (isCorrect ? '' : 'is-wrong') + '">' +
        '<h4 class="summary-review-item-title">' + t('summary.question') + (index + 1) + t('summary.question_suffix') +
          '<span class="summary-review-status">' + (isCorrect ? t('summary.correct') : t('summary.wrong')) + '</span>' +
        '</h4>' +
        '<p class="summary-review-line"><strong>' + getLevel2QuestionText(question) + '</strong></p>' +
        '<p class="summary-review-line">' + t('summary.question_answer') + yourAnswer + '</p>' +
        (isCorrect ? '' :
          '<p class="summary-review-line">' + t('summary.correct_answer') + '<strong>' + correctAnswer + '</strong></p>' +
          '<p class="summary-review-tip">' + t('summary.tip') + t(question.explanationKey) + '</p>') +
      '</article>';
    }).filter(Boolean).join('');
    return items || '<p class="summary-review-empty">' + t('summary.empty') + '</p>';
  }

  function getLevel3OptionText(question, optionKey) {
    if (!question || !Array.isArray(question.options)) return '—';
    const option = question.options.find(function(item) { return item.key === optionKey; });
    return option ? t(option.optKey) : '—';

  function renderLevel3SummaryDetail() {
    const lvl = gameState.levels[3];
    if (!lvl || !lvl.submitted) {
      return '<p class="summary-review-empty">' + t('summary.empty') + '</p>';
    }
    // 目前第三關原始流程每輪只抽一題；以陣列保存，未來若原機制有多題，可按作答順序完整呈現。
    let records = Array.isArray(lvl.answerRecords) ? lvl.answerRecords : [];
    if (!records.length && lvl.answerRecord) records = [lvl.answerRecord];
    // 相容同一輪中已有 questionData + selectedOption 的舊狀態，只讀取真實保存值。
    if (!records.length && lvl.questionData && lvl.selectedOption) {
      records = [{
        questionData: lvl.questionData,
        selectedOption: lvl.selectedOption,
        correctOption: lvl.questionData.correct,
        isCorrect: lvl.selectedOption === lvl.questionData.correct,
        score: lvl.score
      }];
    }
    const items = records.map(function(record, index) {
      const question = record && record.questionData;
      if (!question || !record.selectedOption) return '';
      const isCorrect = !!record.isCorrect;
      const yourAnswer = getLevel3OptionText(question, record.selectedOption);
      const correctAnswer = getLevel3OptionText(question, record.correctOption || question.correct);
      return '<article class="summary-review-card ' + (isCorrect ? '' : 'is-wrong') + '">' +
        '<h4 class="summary-review-item-title">' + t('summary.question') + (index + 1) + t('summary.question_suffix') +
          '<span class="summary-review-status">' + (isCorrect ? t('summary.correct') : t('summary.wrong')) + '</span>' +
        '</h4>' +
        '<p class="summary-review-line"><strong>' + t(question.qKey) + '</strong></p>' +
        '<p class="summary-review-line">' + t('summary.question_answer') + yourAnswer + '</p>' +
        (isCorrect ? '' :
          '<p class="summary-review-line">' + t('summary.correct_answer') + '<strong>' + correctAnswer + '</strong></p>' +
          (question.explanationKey ? '<p class="summary-review-tip">' + t('summary.tip') + t(question.explanationKey) + '</p>' : '')) +
      '</article>';
    }).filter(Boolean).join('');
    return items || '<p class="summary-review-empty">' + t('summary.empty') + '</p>';
  }

  function toggleSummaryDetail(levelNum) {
    const toggle = document.getElementById('summary-review-toggle-' + levelNum);
    const panel = document.getElementById('summary-review-panel-' + levelNum);
    if (!toggle || !panel) return;
    const willOpen = toggle.getAttribute('aria-expanded') !== 'true';

    panel.classList.toggle('is-open', willOpen);
    panel.setAttribute('aria-hidden', willOpen ? 'false' : 'true');

  function renderLevelSettlement(levelNum, container) {
    const lvl = gameState.levels[levelNum];
    const score = lvl.score;
    
    let correctCount = 0;
    let wrongCount = 0;

    if (levelNum === 1) {
      if (lvl.userHour === lvl.targetHour) correctCount++;
      if (lvl.userMin === lvl.targetMin) correctCount++;
      wrongCount = 2 - correctCount;
    } else if (levelNum === 2) {
      const results = Array.isArray(lvl.questionResults) ? lvl.questionResults : [];
      correctCount = results.filter(function(result) { return result && result.isCorrect; }).length;
      wrongCount = 1 - correctCount;
    } else {
      correctCount = score === 100 ? 1 : 0;
      wrongCount = score === 100 ? 0 : 1;
    }

    const correctUnit = levelNum === 1
      ? (correctCount === 1 ? t('settle.unit_item_one') : t('settle.unit_item_other'))
      : (correctCount === 1 ? t('settle.unit_q_one') : t('settle.unit_q_other'));
    const wrongUnit = levelNum === 1

  function renderFinalSummary(container) {
    const s1 = gameState.levels[1].score || 0;
    const s2 = gameState.levels[2].score || 0;
    const s3 = gameState.levels[3].score || 0;
    const avgScore = Math.round((s1 + s2 + s3) / 3);
    const isPerfect = (s1 === 100 && s2 === 100 && s3 === 100);
    
    const bFinal = getBadgeData(avgScore);
    const b1 = getBadgeData(s1);
    const b2 = getBadgeData(s2);
    const b3 = getBadgeData(s3);

    const formatScore = function(score) {

  function generateClockTicksAndNumbers() {
    let html = '';
    for (let i = 1; i <= 12; i++) {
      const rad = (i * 30 - 90) * (Math.PI / 180);
      html += '<line x1="' + (150 + 125 * Math.cos(rad)) + '" y1="' + (150 + 125 * Math.sin(rad)) + '" x2="' + (150 + 135 * Math.cos(rad)) + '" y2="' + (150 + 135 * Math.sin(rad)) + '" stroke="#4F7058" stroke-width="3" stroke-linecap="round"/>';
      html += '<text x="' + (150 + 102 * Math.cos(rad)) + '" y="' + (150 + 102 * Math.sin(rad)) + '" class="clock-number" onclick="clickClockNumber(' + i + ')">' + i + '</text>';
    }
    return html;
  }

  function clickClockNumber(num) {
    if (gameState.levels[1].submitted) return;
    const lvl = gameState.levels[1];
    if (lvl.activeHand === 'minute') {
      lvl.userMin = (num % 12) * 5;
    } else {
      lvl.userHour = num;
    }
    updateClockHands();
    triggerSnapFeedback();
  }

  function updateClockHands() {
    const lvl = gameState.levels[1];
    setHandAngle('hour-hand', (lvl.userHour % 12) * 30 + lvl.userMin * 0.5, 60);
    setHandAngle('minute-hand', lvl.userMin * 6, 95);
  }

  function setHandAngle(id, angleDegree, length) {
    const hand = document.getElementById(id);
    if (!hand) return;
    const rad = (angleDegree - 90) * (Math.PI / 180);
    hand.setAttribute('x2', 150 + length * Math.cos(rad));
    hand.setAttribute('y2', 150 + length * Math.sin(rad));
  }

  function bindClockEvents() {
    const svg = document.getElementById('clock-svg');
    if (!svg) return;
    let isDragging = false;

    const handlePointer = (e) => {
      if (gameState.levels[1].submitted) return;
      const rect = svg.getBoundingClientRect();
      let angle = Math.atan2(e.clientY - (rect.top + rect.height / 2), e.clientX - (rect.left + rect.width / 2)) * (180 / Math.PI) + 90;
      if (angle < 0) angle += 360;
      let tick = Math.round(angle / 30);
      if (tick === 0 || tick === 12) tick = 12;
      const lvl = gameState.levels[1];
      
      if (lvl.activeHand === 'minute') {
        let targetMin = (tick % 12) * 5;
        if (targetMin !== lvl.userMin) {
          let diff = targetMin - lvl.userMin;
          if (diff < -30) lvl.userHour = (lvl.userHour % 12) + 1;
          else if (diff > 30) lvl.userHour = lvl.userHour - 1 < 1 ? 12 : lvl.userHour - 1;
          lvl.userMin = targetMin;
          updateClockHands();
        }
      } else {
        if (tick !== lvl.userHour) {
          lvl.userHour = tick;
          updateClockHands();
        }
      }
    };

    svg.addEventListener('pointerdown', (e) => { 
      isDragging = true; 
      if (svg.setPointerCapture) {
        try { svg.setPointerCapture(e.pointerId); } catch(err) {}
      }
      handlePointer(e); 
    });
    
    svg.addEventListener('pointermove', (e) => { 
      if (isDragging) handlePointer(e); 
    });
    
    const endDrag = (e) => {
      if (isDragging) {
        isDragging = false;
        if (svg.releasePointerCapture && e.pointerId) {
          try { svg.releasePointerCapture(e.pointerId); } catch(err) {}
        }
        triggerSnapFeedback();
      }
    };

    svg.addEventListener('pointerup', endDrag);
    svg.addEventListener('pointercancel', endDrag);
  }

    if (hourCorrect) score += 50;
    if (minuteCorrect) score += 50;
    lvl.score = score;

      targetHour: lvl.targetHour,
      targetMin: lvl.targetMin,

      userMin: lvl.userMin,
      hourCorrect: hourCorrect,
      minuteCorrect: minuteCorrect,

    renderCurrentStage();
  }

      return;
    }

    if (!lockAction(400)) return;

    // 每次正式進入第二關時重新抽取兩題；同一輪作答中不會重新抽題。
    if (targetLevel === 2 && !gameState.levels[2].submitted) {
      setupLevel2Question();
    }

    gameState.currentLevel = targetLevel;
    renderCurrentStage();
  }
  </script>
</body>
