<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>節慶猜謎遊戲 - 高齡駕照輔助平台</title>
  <style>
    :root {
      --primary-color: #5C7761;
      --primary-dark: #2E4032;
      --primary-light: #F3F6F0;
      --accent-color: #4A634E;
      --bg-color: #FCFBF7;
      --card-bg: #FCFBF7;
      --text-main: #2E4032;
      --text-muted: #526356;
      --border-color: #E4E9DF;
      --border-radius: 16px;
      --shadow: none;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      --font-scale: 1;
      --base-font-size: 18px;
    }

    body.font-scale-90 { --font-scale: 0.9; }
    body.font-scale-100 { --font-scale: 1.0; }
    body.font-scale-115 { --font-scale: 1.15; }
    body.font-scale-130 { --font-scale: 1.3; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-family);
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding-bottom: 20px;
      overflow-x: hidden;
      font-size: calc(var(--base-font-size) * var(--font-scale));
      line-height: 1.6;
    }

    header {
      width: 100%;
      background-color: var(--bg-color);
      color: var(--primary-dark);
      padding: 18px 16px 8px 16px; /* 增加頂部間距 */
      text-align: center;
      border-bottom: none;
    }
    .top-nav-bar {
      width: 92%;
      max-width: 800px;
      margin: 0 auto 12px auto;
      display: flex;
      justify-content: flex-start;
      align-items: center;
    }
    #btn-back-cat-header {
      padding: 8px 20px !important; /* 加大點擊觸控範圍 */
    }
    header h1 {
      font-size: calc(36px * var(--font-scale));
      font-weight: 900;
      color: var(--primary-dark);
      margin-bottom: 4px;
      line-height: 1.25;
      text-align: center;
    }
    .nav-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      width: 92%;
      max-width: 800px;
      margin: 0 auto;
      min-height: 32px;
    }
    .progress-badge {
      background-color: var(--primary-light);
      color: var(--primary-dark);
      border: 1.5px solid #C8E6C9;
      padding: 4px 20px;
      border-radius: 30px;
      font-size: calc(18px * var(--font-scale));
      font-weight: 800;
      letter-spacing: 1px;
    }

    main {
      width: 92%;
      max-width: 800px;
      background: var(--card-bg);
      border-radius: var(--border-radius);
      box-shadow: none;
      border: none;
      margin: 0 auto;
      padding: clamp(8px, 2.5vw, 16px);
      transition: max-width 0.3s ease;
    }
    main.summary-mode {
      max-width: 900px;
    }

    .home-wrapper {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 4px 0;
      text-align: center;
      width: 100%;
    }
    .intro-back-wrap {
      display: flex;
      justify-content: flex-start;
      margin-bottom: 0;
    }
    .home-subtitle {
      font-size: calc(21px * var(--font-scale));
      color: var(--primary-dark);
      font-weight: 700;
      line-height: 1.5;
    }
    
    .home-steps-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      background-color: #ffffff;
      border: 1.5px solid var(--border-color);
      border-radius: 16px;
      padding: 16px 18px;
    }
    .home-step-item {
      display: flex;
      align-items: center;
      gap: 14px;
      text-align: left;
    }
    .home-step-icon {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background-color: var(--primary-light);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .home-step-text {
      font-size: calc(18.5px * var(--font-scale));
      font-weight: 700;
      color: var(--primary-dark);
      line-height: 1.4;
    }

    .home-reassurance-card {
      background-color: #EEF7ED;
      border: 2px solid #A5D6A7;
      border-radius: 16px;
      padding: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 4px;
    }
    .home-reassurance-text {
      font-size: calc(21px * var(--font-scale));
      font-weight: 900;
      color: var(--primary-dark);
      line-height: 1.4;
    }

    .home-action-bar {
      display: flex;
      justify-content: center;
      margin-top: 8px;
    }
    .btn-start-game {
      width: 100%;
      max-width: 440px;
      height: 52px;
      background-color: var(--primary-dark);
      color: #ffffff;
      font-size: calc(21px * var(--font-scale));
      font-weight: 800;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(46, 64, 50, 0.3);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-start-game:hover {
      background-color: #1E2D22;
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(30, 45, 34, 0.4);
    }
    .btn-start-game:active {
      transform: scale(0.98);
    }

    .question-box {
      background-color: var(--primary-light);
      border: 1.5px solid var(--border-color);
      padding: 14px 18px;
      border-radius: 14px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }
    .question-text-side {
      flex: 0 0 58%;
      text-align: left;
    }
    .question-prompt-text {
      font-size: calc(22px * var(--font-scale));
      font-weight: 800;
      color: var(--primary-dark);
      line-height: 1.4;
    }
    .question-img-side {
      flex: 0 0 40%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .question-img {
      max-width: 100%;
      max-height: 125px;
      object-fit: contain;
      border-radius: 8px;
    }
    @media (max-width: 600px) {
      .question-box {
        flex-direction: column;
        text-align: center;
        padding: 14px;
      }
      .question-text-side, .question-img-side {
        flex: 1 1 100%;
        width: 100%;
      }
      .question-text-side {
        text-align: center;
      }
      .question-img {
        max-height: 140px;
      }
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: clamp(10px, 2vw, 14px);
      margin: 14px 0;
    }
    .option-card {
      border: 2.5px solid var(--border-color);
      border-radius: var(--border-radius);
      padding: clamp(8px, 1.5vw, 12px);
      text-align: center;
      cursor: pointer;
      background: #ffffff;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      position: relative;
      user-select: none;
    }
    .option-card:hover:not(.disabled) {
      border-color: var(--primary-color);
      transform: translateY(-2px);
    }
    .option-card.selected {
      border-color: var(--primary-dark);
      background-color: #EEF7ED;
      box-shadow: 0 0 0 2px var(--primary-dark);
    }
    .option-card.disabled {
      cursor: default;
      opacity: 0.85;
    }
    .option-img-wrapper {
      width: 100%;
      aspect-ratio: 16 / 9;
      max-height: clamp(80px, 12vw, 110px);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
      overflow: hidden;
      border-radius: 8px;
      background-color: #FCFBF7;
      border: 1px solid #eeeeee;
    }
    .option-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }
    .option-label-container {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      margin-top: 2px;
    }
    .option-text {
      font-size: calc(19px * var(--font-scale));
      font-weight: 800;
      color: var(--primary-dark);
    }

    .action-bar {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 12px;
    }
    .btn {
      background-color: var(--primary-dark);
      color: white;
      border: none;
      padding: 8px 22px;
      font-size: calc(20px * var(--font-scale));
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 3px 8px rgba(46, 64, 50, 0.25);
    }
    .btn:hover:not(:disabled) {
      background-color: #1E2D22;
      transform: translateY(-2px);
    }
    .btn:active:not(:disabled) {
      transform: scale(0.98);
    }
    .btn:disabled {
      background-color: #E0E0E0 !important;
      color: #888888 !important;
      cursor: not-allowed;
      box-shadow: none !important;
    }
    .btn-submit {
      width: 100%;
      max-width: 440px;
      height: 50px;
      font-size: calc(21px * var(--font-scale));
      font-weight: 800;
    }
    .btn-submit:not(:disabled) {
      background-color: var(--primary-dark);
      color: #ffffff;
    }

    .summary-actions-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 100%;
      max-width: 480px;
      margin: 16px auto 0 auto;
      position: relative;
      z-index: 2;
    }
    .summary-actions-group .btn-start-game {
      width: 100%;
      max-width: 100%;
      margin: 0;
    }
    .secondary-btn-row {
      display: flex;
      gap: 12px;
      width: 100%;
      justify-content: center;
      flex-wrap: nowrap;
    }
    .btn-secondary {
      background-color: var(--primary-light);
      color: var(--primary-dark);
      border: 2px solid var(--primary-color);
      padding: 8px 16px;
      font-size: calc(17px * var(--font-scale));
      font-weight: 800;
      border-radius: 25px;
      cursor: pointer;
      flex: 1 1 0px;
      height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
      white-space: nowrap;
      text-decoration: none;
    }
    .btn-secondary:hover {
      background-color: #E2EADF;
      border-color: var(--primary-dark);
      transform: translateY(-1px);
    }
    .btn-secondary:active {
      transform: scale(0.98);
    }
    @media (max-width: 380px) {
      .secondary-btn-row {
        flex-wrap: wrap;
      }
      .btn-secondary {
        flex: 1 1 100%;
      }
    }

    .result-box {
      width: 100%;
      padding: 18px 16px;
      border-radius: 16px;
      text-align: center;
      animation: fadeIn 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      background-color: var(--bg-color);
      border: none;
      box-shadow: none;
    }
    .settlement-title {
      color: var(--primary-dark);
      font-size: calc(28px * var(--font-scale));
      font-weight: 900;
      line-height: 1.3;
    }

    .settlement-stars, .settlement-svg-stars, .settlement-stars-simple {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin: 4px 0 6px 0;
    }
    .feedback-svg-star, .settlement-svg-star, .simple-star {
      width: clamp(42px, 8vw, 50px);
      height: clamp(42px, 8vw, 50px);
      filter: drop-shadow(0 2px 10px rgba(245, 158, 11, 0.65));
      opacity: 0;
      transform: translateY(-20px) scale(0.3);
      animation: starDropIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.25) forwards;
    }
    .feedback-svg-star:nth-child(1), .settlement-svg-star.star-1 { animation-delay: 0.1s; }
    .feedback-svg-star:nth-child(2), .settlement-svg-star.star-2 { animation-delay: 0.25s; }
    .feedback-svg-star:nth-child(3), .settlement-svg-star.star-3 { animation-delay: 0.4s; }
    .simple-star { opacity: 1; transform: none; animation: none; }

    @keyframes starDropIn {
      0% { opacity: 0; transform: translateY(-25px) scale(0.3); }
      70% { opacity: 1; transform: translateY(3px) scale(1.15); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .settlement-score-pill {
      background-color: #EEF7ED;
      border: 1.5px solid #C8E6C9;
      color: var(--primary-dark);
      padding: 6px 22px;
      border-radius: 30px;
      display: inline-block;
      font-size: calc(18px * var(--font-scale));
      font-weight: 800;
    }
    .settlement-encouragement {
      font-size: calc(18px * var(--font-scale));
      font-weight: 800;
      color: var(--primary-dark);
      line-height: 1.45;
      text-align: center;
      margin: 4px 0;
    }
    .settlement-stats-table {
      width: 100%;
      max-width: 380px;
      margin: 4px auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 18px;
      border-radius: 12px;
      font-size: calc(18px * var(--font-scale));
      font-weight: 800;
      height: 46px;
      box-sizing: border-box;
      width: 100%;
    }
    .stat-row.correct {
      background-color: #EEF7ED;
      color: var(--primary-dark);
    }
    .stat-row.incorrect {
      background-color: #F5F5F5;
      color: #526356;
      border: none;
    }
    .stat-row .stat-val {
      font-weight: 900;
      text-align: right;
    }
    .feedback-divider {
      width: 100%;
      border: none;
      border-top: 1.5px solid #C8E6C9;
      margin: 6px 0;
    }
    .feedback-correct-label {
      font-size: calc(22px * var(--font-scale));
      font-weight: 900;
      color: #1B5E20;
      margin-bottom: 2px;
    }
    .feedback-explanation {
      font-size: calc(18px * var(--font-scale));
      color: #37474F;
      font-weight: 600;
      line-height: 1.6;
    }
    .btn-settlement-next {
      width: 100%;
      max-width: 440px;
      height: 50px;
      background-color: var(--primary-dark);
      color: #ffffff;
      font-size: calc(21px * var(--font-scale));
      font-weight: 800;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(46, 64, 50, 0.25);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-settlement-next:hover {
      background-color: #1E2D22;
      transform: translateY(-2px);
    }

    .summary-cream-card {
      position: relative;
      background-color: #FCFBF7;
      border: none;
      border-radius: 20px;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-align: center;
      box-shadow: none;
      overflow: hidden;
      width: 100%;
    }

    .summary-encouragement-text {
      font-size: calc(20px * var(--font-scale));
      font-weight: 800;
      color: var(--primary-dark);
      line-height: 1.55;
      margin: 6px 0;
      text-align: center;
    }

    .summary-breakdown-box {
      background-color: #F1F8E9;
      border: 1.5px solid #C8E6C9;
      border-radius: 14px;
      padding: 12px 20px;
      margin: 4px 0;
      text-align: left;
      width: 100%;
      box-sizing: border-box;
      overflow: visible !important;
    }
    .summary-breakdown-row {
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: calc(18px * var(--font-scale));
      font-weight: 800;
      color: #263238;
      padding: 10px 0;
      min-height: 48px;
      border-bottom: 1px dashed #C8E6C9;
      overflow: visible !important;
    }
    .summary-breakdown-row:last-child {
      border-bottom: none;
    }
    .summary-breakdown-score {
      color: #1B5E20;
      font-weight: 900;
      font-size: calc(18px * var(--font-scale));
      text-align: right;
    }

    .table-clap-container {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      overflow: visible;
      transition: opacity 0.6s ease;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
    }
    .table-clap-emoji {
      font-size: clamp(36px, 6vw, 44px);
      display: inline-block;
      line-height: 1;
      opacity: 1 !important;
      visibility: visible !important;
      transform-origin: center center;
      animation: continuousClapping 0.5s ease-in-out infinite alternate;
      filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.15));
      will-change: transform;
    }
    @keyframes continuousClapping {
      0% { transform: scale(0.9) rotate(-12deg); }
      100% { transform: scale(1.25) rotate(12deg); }
    }
    .clap-impact-ring {
      position: absolute;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 3px solid #FFC107;
      opacity: 0;
      animation: clapRingPulse 0.8s ease-out infinite;
      will-change: transform, opacity;
    }
    @keyframes clapRingPulse {
      0% { transform: scale(0.4); opacity: 0.9; }
      80% { transform: scale(1.6); opacity: 0; }
      100% { transform: scale(1.8); opacity: 0; }
    }

    .perfect-graphic-group {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 8px 0 4px 0;
      position: relative;
      width: 100%;
    }
    .trophy-wrapper {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .star-decor {
      position: absolute;
      top: 50%;
      width: 36px;
      height: 36px;
      transform: translateY(-50%);
      filter: drop-shadow(0 2px 6px rgba(255, 179, 0, 0.5));
      animation: starTwinkle 1.8s ease-in-out infinite alternate;
    }
    .star-decor.star-left { left: -46px; animation-delay: 0s; }
    .star-decor.star-right { right: -46px; animation-delay: 0.4s; }
    @keyframes starTwinkle {
      0% { transform: translateY(-50%) scale(0.85) rotate(-10deg); opacity: 0.8; }
      100% { transform: translateY(-50%) scale(1.15) rotate(15deg); opacity: 1; }
    }

    .perfect-trophy-svg {
      width: clamp(68px, 18vw, 84px);
      height: clamp(68px, 18vw, 84px);
      filter: drop-shadow(0 6px 14px rgba(255, 179, 0, 0.5));
      animation: trophyPopIn 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards, trophyFloat 3s ease-in-out 0.7s infinite alternate;
    }
    @keyframes trophyPopIn {
      0% { transform: translateY(-40px) scale(0.2); opacity: 0; }
      60% { transform: translateY(6px) scale(1.15); opacity: 1; }
      80% { transform: translateY(-3px) scale(0.95); }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }
    @keyframes trophyFloat {
      0% { transform: translateY(0) rotate(0deg); }
      100% { transform: translateY(-6px) rotate(3deg); }
    }
    .confetti-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
    }
    .confetti-piece {
      position: absolute;
      top: -20px;
      opacity: 0;
      animation: confettiFall 2.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) infinite;
    }
    @keyframes confettiFall {
      0% { transform: translateY(0) rotate(0deg) scaleX(1); opacity: 0.95; }
      75% { opacity: 0.85; }
      100% { transform: translateY(380px) rotate(720deg) scaleX(0.5); opacity: 0; }
    }
    .btn-clap-sound {
      background-color: #ffffff;
      border: 2px solid var(--primary-color);
      color: var(--primary-dark);
      padding: 6px 20px;
      border-radius: 25px;
      font-size: calc(16px * var(--font-scale));
      font-weight: bold;
      cursor: pointer;
      margin: 4px 0;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }
    .btn-clap-sound:hover {
      background-color: var(--primary-light);
    }
    .audio-status-msg {
      font-size: calc(16px * var(--font-scale));
      font-weight: bold;
      margin-top: 2px;
      color: var(--primary-color);
    }
    .img-fallback {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6px;
      color: var(--primary-dark);
      font-size: calc(16px * var(--font-scale));
      text-align: center;
      height: 100%;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body data-base-url="<?!= baseUrl ?>">

  <header id="main-header">

    function getValidBaseUrl() {
      var baseUrl = document.body.getAttribute('data-base-url') || '';
      if (baseUrl && baseUrl.indexOf('script.google.com') !== -1) {
        return baseUrl.split('?')[0].split('#')[0];
      }
      if (document.referrer && document.referrer.indexOf('script.google.com') !== -1) {
        return document.referrer.split('?')[0].split('#')[0];
      }
      try {
        if (window.top && window.top.location && window.top.location.href && window.top.location.href.indexOf('script.google.com') !== -1) {
          return window.top.location.href.split('?')[0].split('#')[0];
        }
      } catch(e) {}
      return window.location.href.split('?')[0].split('#')[0];
    }

    function navigateTo(targetPage) {
      var currentLangVal = (typeof currentLang !== 'undefined' && currentLang) ? currentLang : (localStorage.getItem('app_lang') || 'zh-TW');
      var currentFontVal = (typeof currentFontScale !== 'undefined' && currentFontScale) ? currentFontScale : (localStorage.getItem('app_font_scale') || '100');

      var baseUrl = getValidBaseUrl();
      var form = document.createElement('form');
      form.method = 'GET';
      form.action = baseUrl;
      form.target = '_top';

      var pageInput = document.createElement('input');
      pageInput.type = 'hidden'; pageInput.name = 'page'; pageInput.value = targetPage;
      form.appendChild(pageInput);

      var langInput = document.createElement('input');
      langInput.type = 'hidden'; langInput.name = 'lang'; langInput.value = currentLangVal;
      form.appendChild(langInput);

      var fontInput = document.createElement('input');
      fontInput.type = 'hidden'; fontInput.name = 'fontScale'; fontInput.value = currentFontVal;
      form.appendChild(fontInput);

      document.body.appendChild(form);
      form.submit();
    }

    window.navigateTo = navigateTo;
    window.navigateToPage = navigateTo;
    window.goToLevelSelect = function() { navigateTo('level_select'); };

    var CHEER_AUDIO_URLS = [
      "https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3",

      "https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3"
    ];
    var cheerAudioPlayer = null;
    var currentSourceIndex = 0;

    function getCheerAudioPlayer() {
      if (!cheerAudioPlayer) {
        cheerAudioPlayer = new Audio();
        cheerAudioPlayer.volume = 0.6;
        cheerAudioPlayer.src = CHEER_AUDIO_URLS[currentSourceIndex];
        cheerAudioPlayer.onerror = function() {
          currentSourceIndex++;
          if (currentSourceIndex < CHEER_AUDIO_URLS.length) {
            cheerAudioPlayer.src = CHEER_AUDIO_URLS[currentSourceIndex];
            cheerAudioPlayer.load();
          } else {
            var statusTag = document.getElementById('audio-status-tag');
            if (statusTag) {
              statusTag.innerHTML = "<span style='color:#c62828;'>❌ 音訊檔案載入失敗</span>";
            }
          }
        };
      }
      return cheerAudioPlayer;
    }

    function unlockAudioOnGesture() {
      var player = getCheerAudioPlayer();
      if (player && player.paused && player.readyState === 0) {
        player.load();
      }
    }
    document.addEventListener('click', unlockAudioOnGesture, false);
    document.addEventListener('touchstart', unlockAudioOnGesture, false);

    function showClapEffect() {
      var rows = document.querySelectorAll('.summary-breakdown-row');
      if (!rows || rows.length < 2) return;
      var targetRow = rows[1];

      var clapEl = document.getElementById('temp-clap-effect');
      if (!clapEl) {
        clapEl = document.createElement('div');
        clapEl.id = 'temp-clap-effect';
        clapEl.className = 'table-clap-container';
        clapEl.innerHTML = '<span class="table-clap-emoji">👏</span><span class="clap-impact-ring"></span>';
        targetRow.appendChild(clapEl);
      }

      clapEl.style.transition = 'opacity 0.6s ease';
      clapEl.style.opacity = '1';

      if (window.clapTimer) clearTimeout(window.clapTimer);
      if (window.clapFadeTimer) clearTimeout(window.clapFadeTimer);

      window.clapTimer = setTimeout(function() {
        var el = document.getElementById('temp-clap-effect');
        if (el) {
          el.style.opacity = '0';
          window.clapFadeTimer = setTimeout(function() {
            if (el && el.parentNode) {
              el.parentNode.removeChild(el);
            }
          }, 600);
        }
      }, 3800);
    }

    function playCheerSound(isManualClick) {
      var player = getCheerAudioPlayer();
      if (!player) return;
      player.currentTime = 0;
      player.volume = 0.6;
      var playPromise = player.play();
      if (playPromise !== undefined) {
        playPromise.then(function() {});
      }

      if (isManualClick) {
        showClapEffect();
      }
    }

    function stopCheerSound() {
      if (cheerAudioPlayer) {
        cheerAudioPlayer.pause();
        cheerAudioPlayer.currentTime = 0;
      }
    }

    function startGame() {
      stopCheerSound();
      var shuffled = QUESTION_BANK.slice().sort(function() { return Math.random() - 0.5; });
      gameState.selectedQuestions = shuffled.slice(0, 3);
      gameState.userAnswers = [
        { selectedOption: null, submitted: false, score: 0, shuffledOptions: null },
        { selectedOption: null, submitted: false, score: 0, shuffledOptions: null },
        { selectedOption: null, submitted: false, score: 0, shuffledOptions: null }
      ];
      gameState.currentStep = 1;
      renderCurrentStep();
    }

    function renderCurrentStep() {
      var card = document.getElementById('game-container');
      var progressBadge = document.getElementById('progress-text');
      var headerTitle = document.getElementById('header-title');
      var topNavBar = document.getElementById('top-nav-bar');
      var btnBackHeader = document.getElementById('btn-back-cat-header');

      if (btnBackHeader) btnBackHeader.innerHTML = t('nav.back_cat');

      if (gameState.currentStep === 0) {
        card.classList.remove('summary-mode');
        if (headerTitle) headerTitle.textContent = t('game.title');
        if (topNavBar) topNavBar.style.display = 'flex';
        if (progressBadge) {
          progressBadge.style.display = 'none';
        }
        renderWelcome();
      } else if (gameState.currentStep >= 1 && gameState.currentStep <= 3) {
        card.classList.remove('summary-mode');
        if (headerTitle) headerTitle.textContent = t('game.title');
        if (topNavBar) topNavBar.style.display = 'none';
        if (progressBadge) {
          progressBadge.style.display = 'inline-block';
          progressBadge.textContent = t('nav.progress_p1') + gameState.currentStep + t('nav.progress_p2');
        }
        renderQuestion(card, gameState.currentStep - 1);
      } else if (gameState.currentStep === 4) {
        card.classList.add('summary-mode');
        if (headerTitle) headerTitle.textContent = t('game.title');
        if (topNavBar) topNavBar.style.display = 'none';
        if (progressBadge) {
          progressBadge.style.display = 'inline-block';
          progressBadge.textContent = t('nav.summary');
        }
        renderSummary(card);
      }
    }

            '</div>' +
            '<div class="home-step-item">' +
              '<div class="home-step-icon" style="font-size: 22px; font-weight: 900; color: var(--primary-dark);">3</div>' +
              '<div class="home-step-text">' + t('home.step3') + '</div>' +
            '</div>' +
          '</div>' +
          '<div class="home-reassurance-card">' +
            '<div class="home-step-icon" style="background-color: #C8E6C9;">' +
              '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#1B5E20" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">' +
                '<path d="M18 8h1a4 4 0 0 1 0 8h-1"></path>' +
                '<path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path>' +
                '<line x1="6" y1="1" x2="6" y2="4"></line>' +
                '<line x1="10" y1="1" x2="10" y2="4"></line>' +
                '<line x1="14" y1="1" x2="14" y2="4"></line>' +
              '</svg>' +
            '</div>' +
            '<div class="home-reassurance-text">' + t('home.reassurance') + '</div>' +
          '</div>' +
          '<div class="home-action-bar">' +
            '<button class="btn-start-game" onclick="startGame()">' + t('home.start') + '</button>' +
          '</div>' +
        '</div>';
      container.innerHTML = html;
    }

    function renderQuestion(container, qIndex) {
      var q = gameState.selectedQuestions[qIndex];
      var answerState = gameState.userAnswers[qIndex];

      if (answerState.submitted) {
        renderFeedback(container, qIndex);
        return;
      }

      if (!answerState.shuffledOptions) {
        answerState.shuffledOptions = q.options.slice().sort(function() { return Math.random() - 0.5; });
      }

      var promptText = t(q.promptKey);
      var festTitle = t(q.festKey);

      var optionsHtml = (answerState.shuffledOptions || q.options).map(function(opt) {
        var optText = t(opt.textKey);
        return '<div class="option-card ' + (answerState.selectedOption === opt.key ? 'selected' : '') + '" onclick="selectOption(' + qIndex + ', \'' + opt.key + '\')">' +
          '<div class="option-img-wrapper">' +
            '<img src="' + opt.img + '" alt="' + optText + '" class="option-img" onerror="handleImgError(this, \'' + optText + '\')" />' +
          '</div>' +
          '<div class="option-label-container">' +
            '<span class="option-text">' + optText + '</span>' +
          '</div>' +
        '</div>';
      }).join('');

      var html = 
        '<div class="question-box">' +
          '<div class="question-text-side">' +
            '<div class="question-prompt-text">' + promptText + '</div>' +
          '</div>' +
          '<div class="question-img-side">' +
            '<img src="' + q.qImage + '" alt="' + festTitle + '" class="question-img" onerror="handleImgError(this, \'' + festTitle + '\')" />' +
          '</div>' +
        '</div>' +
        '<div class="options-grid">' +
          optionsHtml +
        '</div>' +
        '<div class="action-bar">' +
          '<button class="btn btn-submit" id="btn-submit" onclick="submitAnswer(' + qIndex + ')" ' + (!answerState.selectedOption ? 'disabled' : '') + '>' +
            t('btn.submit') +
          '</button>' +
        '</div>';
      container.innerHTML = html;
    }

    function selectOption(qIndex, optionKey) {
      var answerState = gameState.userAnswers[qIndex];
      if (answerState.submitted) return;
      answerState.selectedOption = optionKey;
      renderCurrentStep();
    }

    function submitAnswer(qIndex) {
      var answerState = gameState.userAnswers[qIndex];
      if (answerState.submitted || !answerState.selectedOption) return;
      var q = gameState.selectedQuestions[qIndex];
      var isCorrect = (answerState.selectedOption === q.correctAns);
      answerState.submitted = true;
      answerState.score = isCorrect ? 100 : 0;
      renderCurrentStep();
    }

    function nextQuestion() {
      if (gameState.currentStep < 3) {
        gameState.currentStep += 1;
      } else {
        gameState.currentStep = 4;
      }
      renderCurrentStep();
    }
function renderFeedback(container, qIndex) {
      var q = gameState.selectedQuestions[qIndex];
      var answerState = gameState.userAnswers[qIndex];
      
      var score = answerState.score;
      var isCorrect = (score > 0);
      var badgeData = getBadgeData(score);
      
      var correctOption = q.options.filter(function(o) { return o.key === q.correctAns; })[0];
      var numKey = 'settle.num' + (qIndex + 1);
      var currentLevelTitle = t('settle.q_p1') + t(numKey) + t('settle.q_p2');
      
      // 答對顯示金色星星，答錯顯示灰色星星
      var starsCount = qIndex + 1;
      var starsHtml = '';
      for (var i = 0; i < starsCount; i++) {
        var starColorStart = isCorrect ? "#FFC107" : "#E0E0E0";
        var starColorEnd = isCorrect ? "#FF8F00" : "#BDBDBD";
        
        starsHtml += 
          '<svg class="feedback-svg-star" viewBox="0 0 24 24">' +
            '<defs>' +
              '<linearGradient id="starGrad_' + qIndex + '_' + i + '" x1="0%" y1="0%" x2="0%" y2="100%">' +
                '<stop offset="0%" stop-color="' + starColorStart + '"/>' +
                '<stop offset="100%" stop-color="' + starColorEnd + '"/>' +
              '</linearGradient>' +
            '</defs>' +
            '<path fill="url(#starGrad_' + qIndex + '_' + i + ')" d="M12 2l2.9 6.26 6.86.83-5.1 4.75 1.4 6.74L12 17.27l-6.06 3.31 1.4-6.74-5.1-4.75 6.86-.83L12 2z"/>' +
          '</svg>';
      }

      var nextBtnText = (qIndex === 2) ? t('btn.view_summary') : t('btn.next');

      var html = 
        '<div class="result-box">' +
          '<div class="settlement-title">' + currentLevelTitle + '</div>' +
          '<div class="settlement-stars">' + starsHtml + '</div>' +
          '<div class="settlement-score-pill">' + badgeData.svg + ' ' + badgeData.scoreText + '</div>' +
          '<div class="settlement-encouragement">' + badgeData.comment + '</div>' +
          '<hr class="feedback-divider" />' +
          '<div class="feedback-correct-label">' + t('settle.ans_label') + (correctOption ? t(correctOption.textKey) : '') + '</div>' +
          '<div class="feedback-explanation">' + t(q.explanationKey) + '</div>' +
        '</div>' +
        '<div class="action-bar">' +
          '<button class="btn btn-settlement-next" onclick="nextQuestion()">' + nextBtnText + '</button>' +
        '</div>';
      container.innerHTML = html;
    }
function renderSummary(container) {
      stopCheerSound();
      var ans = gameState.userAnswers;
      var totalScore = ans.reduce(function(sum, item) { return sum + item.score; }, 0);
      var avgScore = Math.round(totalScore / 3);
      var isPerfect = (avgScore === 100);
      
      var summaryMsg = '';
      if (avgScore === 100) {
        summaryMsg = t('final.msg_perfect');
      } else if (avgScore >= 60) {
        summaryMsg = t('final.msg_good');
      } else {
        summaryMsg = t('final.msg_keep');
      }
      
      var confettiColors = ['#e91e63', '#4caf50', '#2196f3', '#ffeb3b', '#ff9800', '#9c27b0', '#00bcd4', '#ff5722'];
      var confettiHTML = '';
      for (var i = 0; i < 24; i++) {
        var left = Math.floor((i / 24) * 92 + 4 + (Math.random() * 3 - 1.5));
        var color = confettiColors[i % confettiColors.length];
        var delay = (Math.random() * 2.5).toFixed(2);
        var duration = (2.4 + Math.random() * 1.2).toFixed(2);
        var isCircle = i % 3 === 0;
        var width = isCircle ? '8px' : '7px';
        var height = isCircle ? '13px' : '9px';
        var borderRadius = isCircle ? '50%' : '2px';
        confettiHTML += '<span class="confetti-piece" style="left:' + left + '%; background:' + color + '; width:' + width + '; height:' + height + '; border-radius:' + borderRadius + '; animation-delay:' + delay + 's; animation-duration:' + duration + 's;"></span>';
      }

      // 🌟 依據平均分數動態決定金黃星星數量（100分: 3星 / 60~99分: 2星 / 60分以下: 1星）
      var goldStarsCount = (avgScore === 100) ? 3 : ((avgScore >= 60) ? 2 : 1);
      var summaryStarsHtml = '';
      for (var s = 0; s < 3; s++) {
        var isGold = (s < goldStarsCount);
        var cStart = isGold ? "#FFC107" : "#E0E0E0";
        var cEnd = isGold ? "#FF8F00" : "#BDBDBD";
        summaryStarsHtml += 
          '<svg class="settlement-svg-star star-' + (s + 1) + '" viewBox="0 0 24 24">' +
            '<defs>' +
              '<linearGradient id="sumStarGrad_' + s + '" x1="0%" y1="0%" x2="0%" y2="100%">' +
                '<stop offset="0%" stop-color="' + cStart + '"/>' +
                '<stop offset="100%" stop-color="' + cEnd + '"/>' +
              '</linearGradient>' +
            '</defs>' +
            '<path fill="url(#sumStarGrad_' + s + ')" d="M12 2l2.9 6.26 6.86.83-5.1 4.75 1.4 6.74L12 17.27l-6.06 3.31 1.4-6.74-5.1-4.75 6.86-.83L12 2z"/>' +
          '</svg>';
      }
      
      var decorStarSVG = 
        '<svg viewBox="0 0 40 40" style="width:100%; height:100%;">' +
          '<path d="M20 2 L23.5 15.5 L37 19 L23.5 22.5 L20 36 L16.5 22.5 L3 19 L16.5 15.5 Z" fill="#FFB74D"/>' +
          '<path d="M20 6 L22 16 L31 19 L22 22 L20 32 L18 22 L9 19 L18 16 Z" fill="#FFE082"/>' +
        '</svg>';

      var trophySVG = 
        '<svg class="perfect-trophy-svg" viewBox="0 0 100 100">' +
          '<defs>' +
            '<linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">' +
              '<stop offset="0%" stop-color="#FFE082"/><stop offset="30%" stop-color="#FFD54F"/><stop offset="55%" stop-color="#FFB300"/><stop offset="85%" stop-color="#FF8F00"/><stop offset="100%" stop-color="#FF6F00"/>' +
            '</linearGradient>' +
            '<linearGradient id="base-grad" x1="0%" y1="0%" x2="0%" y2="100%">' +
              '<stop offset="0%" stop-color="#8D6E63"/><stop offset="50%" stop-color="#5D4037"/><stop offset="100%" stop-color="#3E2723"/>' +
            '</linearGradient>' +
            '<linearGradient id="stem-grad" x1="0%" y1="0%" x2="100%" y2="0%">' +
              '<stop offset="0%" stop-color="#FFB300"/><stop offset="50%" stop-color="#FFE082"/><stop offset="100%" stop-color="#FF8F00"/>' +
            '</linearGradient>' +
          '</defs>' +
          '<path d="M 24 22 C 8 22, 8 46, 26 48 M 76 22 C 92 22, 92 46, 74 48" fill="none" stroke="url(#gold-grad)" stroke-width="5" stroke-linecap="round"/>' +
          '<path d="M 22 18 L 78 18 L 70 54 C 66 68, 34 68, 30 54 Z" fill="url(#gold-grad)"/>' +
          '<ellipse cx="50" cy="18" rx="28" ry="5" fill="#FFE082"/>' +
          '<path d="M 32 22 L 40 22 C 37 38, 38 48, 36 56 C 34 54, 33 40, 32 22 Z" fill="#FFFFFF" opacity="0.45"/>' +
          '<rect x="43" y="66" width="14" height="12" fill="url(#stem-grad)"/>' +
          '<ellipse cx="50" cy="66" rx="10" ry="3" fill="#FFA000"/>' +
          '<path d="M 28 78 L 72 78 L 76 92 L 24 92 Z" fill="url(#base-grad)"/>' +
          '<rect x="24" y="78" width="52" height="4" fill="#A1887F"/>' +
        '</svg>';

      var breakdownRows = gameState.selectedQuestions.map(function(q, idx) {
        var lvlName = t('final.l_p1') + t('settle.num' + (idx + 1)) + t('final.l_p2');
        var festTitle = t(q.festKey);
        var bData = getBadgeData(ans[idx].score);
        return '<div class="summary-breakdown-row">' +
          '<span>' + lvlName + '（' + festTitle + '）：</span>' +
          '<span class="summary-breakdown-score">' + bData.svg + ' <span style="vertical-align:middle; margin-left:4px;">' + bData.scoreText + '</span></span>' +
        '</div>';
      }).join('');

      var avgBadgeData = getBadgeData(avgScore);

      var html = 
        '<div class="summary-cream-card">' +
          '<div class="confetti-container">' + confettiHTML + '</div>' +
          '<h2 class="settlement-title" style="font-size: calc(28px * var(--font-scale)); position: relative; z-index: 2;">' +
            (isPerfect ? t('final.perfect_title') : t('final.normal_title')) +
          '</h2>' +
          (isPerfect ? 
            '<div class="perfect-graphic-group" style="position: relative; z-index: 2;">' +
              '<div class="trophy-wrapper">' +
                '<div class="star-decor star-left">' + decorStarSVG + '</div>' +
                trophySVG +
                '<div class="star-decor star-right">' + decorStarSVG + '</div>' +
              '</div>' +
            '</div>' : '') +
          '<div style="position: relative; z-index: 2;">' +
            '<div class="settlement-svg-stars">' + summaryStarsHtml + '</div>' +
          '</div>' +
          '<div style="position: relative; z-index: 2; align-self: center;">' +
            '<div class="settlement-score-pill">' + avgBadgeData.svg + ' ' + t('final.avg_label') + avgBadgeData.scoreText + '</div>' +
          '</div>' +
          '<div class="summary-encouragement-text" style="position: relative; z-index: 2;">' +
            summaryMsg +
          '</div>' +
          '<div class="summary-breakdown-box" style="position: relative; z-index: 2;">' +
            breakdownRows +
          '</div>' +
          (isPerfect ? 
            '<div style="position: relative; z-index: 2;">' +
              '<button class="btn-clap-sound" onclick="playCheerSound(true)">' + t('btn.replay_clap') + '</button>' +
              '<div id="audio-status-tag" class="audio-status-msg"></div>' +
            '</div>' : '') +
          '<div class="summary-actions-group">' +
            '<button class="btn-start-game" onclick="replayGame()">' + t('btn.play_again') + '</button>' +
            '<div class="secondary-btn-row">' +
              '<button class="btn-secondary" onclick="goToLevelSelect()">' + t('nav.cat') + '</button>' +
              '<button class="btn-secondary" onclick="goToHome()">' + t('nav.home') + '</button>' +
            '</div>' +
          '</div>' +
        '</div>';
      container.innerHTML = html;

      if (isPerfect) {
        playCheerSound();
        showClapEffect();
        setTimeout(triggerConfetti, 100);
      }
    }

    function triggerConfetti() {
      if (document.getElementById('confetti-canvas')) return;
      var canvas = document.createElement('canvas');
      canvas.id = 'confetti-canvas';
      canvas.style.position = 'fixed';
      canvas.style.top = '0';
      canvas.style.left = '0';
      canvas.style.width = '100vw';
      canvas.style.height = '100vh';
      canvas.style.pointerEvents = 'none';
      canvas.style.zIndex = '9999';
      canvas.style.transition = 'opacity 0.6s ease';
      document.body.appendChild(canvas);

      var ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      var particles = [];
      var colors = ['#4caf50', '#81c784', '#ffeb3b', '#ff9800', '#2196f3', '#e91e63'];
      for (var i = 0; i < 120; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height - canvas.height,
          r: Math.random() * 8 + 4,
          d: Math.random() * 120,
          color: colors[Math.floor(Math.random() * colors.length)],
          tilt: Math.floor(Math.random() * 10) - 10,
          tiltAngleIncremental: Math.random() * 0.07 + 0.05,
          tiltAngle: 0
        });
      }
      var animationId;
      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (var idx = 0; idx < particles.length; idx++) {
          var p = particles[idx];
          p.tiltAngle += p.tiltAngleIncremental;
          p.y += (Math.cos(p.d) + 3 + p.r / 2) / 2;
          p.x += Math.sin(p.d);
          p.tilt = Math.sin(p.tiltAngle) * 15;
          ctx.beginPath();
          ctx.lineWidth = p.r;
          ctx.strokeStyle = p.color;
          ctx.moveTo(p.x + p.tilt + p.r / 2, p.y);
          ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r / 2);
          ctx.stroke();
          if (p.y > canvas.height) {
            particles[idx] = {
              x: Math.random() * canvas.width,
              y: -20,
              r: p.r,
              d: p.d,
              color: p.color,
              tilt: p.tilt,
              tiltAngleIncremental: p.tiltAngleIncremental,
              tiltAngle: p.tiltAngle
            };
          }
        }
        animationId = requestAnimationFrame(render);
      }
      render();

      setTimeout(function() {
        canvas.style.opacity = '0';
        setTimeout(function() {
          cancelAnimationFrame(animationId);
          if (canvas.parentNode) canvas.parentNode.removeChild(canvas);
        }, 600);
      }, 3800);
    }

    function handleImgError(imgEl, titleText) {
      var wrapper = imgEl.parentElement;
      if (wrapper) {
        wrapper.innerHTML = '<div class="img-fallback"><strong>' + titleText + '</strong></div>';
      }
    }
  </script>
</body>
</html>
